<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSD Admin | Logiciel Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .bg-gsd { background-color: #0f172a; }
        /* Style spécifique pour le devis sur l'écran */
        #devis-a-imprimer {
            color: #000000 !important;
            background-color: #ffffff !important;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        #devis-a-imprimer * { color: #000000 !important; }
    </style>
</head>
<body class="bg-gsd text-white font-sans p-4 pb-20">

    <div class="max-w-2xl mx-auto space-y-6">
        <header class="text-center py-4">
            <h1 class="text-2xl font-black text-emerald-400 uppercase tracking-tighter">GSD | Logiciel Devis</h1>
        </header>

        <div class="bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <input type="text" id="nomClient" placeholder="Nom du client" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none" oninput="calculerDevis()">
                <input type="text" id="adresseClient" placeholder="Adresse du client" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none" oninput="calculerDevis()">
            </div>
            
            <div class="grid grid-cols-2 gap-3">
                <input type="number" id="prixAchat" oninput="calculerDevis()" placeholder="Prix d'achat (€)" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl font-bold text-xl outline-none">
                <select id="fraisPort" onchange="calculerDevis()" class="w-full p-4 bg-slate-700 border border-slate-600 rounded-2xl font-bold">
                    <option value="30">Port Petit (30€)</option>
                    <option value="150">Port Moyen (150€)</option>
                    <option value="0">À Définir</option>
                </select>
            </div>

            <div class="grid grid-cols-1 gap-2">
                <button onclick="genererPDF()" class="bg-blue-600 p-5 rounded-2xl font-bold text-lg shadow-lg active:bg-blue-700">
                    <i class="fas fa-file-pdf mr-2"></i> TÉLÉCHARGER LE PDF
                </button>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="enregistrerDevis()" class="bg-slate-700 p-4 rounded-2xl font-bold text-xs uppercase italic">Enregistrer</button>
                    <button onclick="partagerWhatsApp()" class="bg-[#25D366] p-4 rounded-2xl font-bold text-xs uppercase italic">WhatsApp</button>
                </div>
            </div>
        </div>

        <div id="devis-a-imprimer">
            <div style="display: flex; justify-content: space-between; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px;">
                <div>
                    <img src="Logo.jpg" style="height: 50px; margin-bottom: 10px;">
                    <p style="font-size: 12px; font-weight: 900; color: #059669; margin: 0;">GUYANE SOURCING DIRECT</p>
                </div>
                <div style="text-align: right;">
                    <h2 style="font-size: 20px; font-weight: 900; margin: 0;">DEVIS</h2>
                    <p style="font-size: 12px; color: #666; margin: 0;">N° <span id="numDevisDisplay">20260001</span></p>
                    <p style="font-size: 10px; color: #999; margin: 0;">Le <span id="dateDevis">--/--/----</span></p>
                </div>
            </div>

            <div style="margin-bottom: 30px; text-align: right;">
                <div style="display: inline-block; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 5px; border: 1px solid #eee; min-width: 200px;">
                    <p style="font-size: 9px; color: #999; margin: 0;">CLIENT :</p>
                    <p id="clientNomPdf" style="font-weight: bold; font-size: 12px; margin: 0;">--</p>
                    <p id="clientAdPdf" style="font-size: 10px; color: #666; margin: 0;">--</p>
                </div>
            </div>

            <table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;">
                <thead>
                    <tr style="background: #f1f1f1; font-size: 10px;">
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">DÉSIGNATION</th>
                        <th style="padding: 10px; border: 1px solid #ddd; text-align: center; width: 100px;">TOTAL TTC</th>
                    </tr>
                </thead>
                <tbody style="font-size: 11px;">
                    <tr>
                        <td style="padding: 10px; border: 1px solid #ddd;">Achat & Sourcing pièces automobiles</td>
                        <td id="displayVente" style="padding: 10px; border: 1px solid #ddd; text-align: center; font-weight: bold;">0.00 €</td>
                    </tr>
                    <tr>
                        <td style="padding: 10px; border: 1px solid #ddd;">Logistique & Expédition Guyane</td>
                        <td id="displayPort" style="padding: 10px; border: 1px solid #ddd; text-align: center; font-weight: bold;">30.00 €</td>
                    </tr>
                </tbody>
            </table>

            <div style="text-align: right; border-top: 3px solid #059669; padding-top: 10px;">
                <p style="font-size: 10px; color: #999; margin: 0;">TOTAL À RÉGLER</p>
                <p id="displayTotal" style="font-size: 24px; font-weight: 900; color: #059669; margin: 0;">0.00 €</p>
            </div>
        </div>

        <div class="bg-slate-800/50 p-6 rounded-3xl border border-slate-700">
            <div id="historique" class="space-y-2 mb-4 text-xs"></div>
            <button onclick="exporterDonnees()" class="w-full bg-emerald-500/10 text-emerald-500 p-3 rounded-xl font-bold uppercase text-[10px]">Sauvegarde Drive (.json)</button>
        </div>
    </div>

    <script>
        function obtenirProchainNumero() {
            let dernierNum = localStorage.getItem('gsd_last_id') || 0;
            return "2026" + (parseInt(dernierNum) + 1).toString().padStart(4, '0');
        }

        function calculerDevis() {
            const achat = parseFloat(document.getElementById('prixAchat').value) || 0;
            const port = parseFloat(document.getElementById('fraisPort').value);
            const nom = document.getElementById('nomClient').value || "NOM DU CLIENT";
            const adr = document.getElementById('adresseClient').value || "GUYANE";
            
            const vente = achat * 1.18;
            const total = vente + port;

            document.getElementById('dateDevis').innerText = new Date().toLocaleDateString('fr-FR');
            document.getElementById('clientNomPdf').innerText = nom.toUpperCase();
            document.getElementById('clientAdPdf').innerText = adr.toUpperCase();
            document.getElementById('displayVente').innerText = vente.toFixed(2) + " €";
            document.getElementById('displayPort').innerText = port.toFixed(2) + " €";
            document.getElementById('displayTotal').innerText = total.toFixed(2) + " €";
        }

        function genererPDF() {
            const element = document.getElementById('devis-a-imprimer');
            const num = document.getElementById('numDevisDisplay').innerText;
            
            // On s'assure que le devis est bien rempli avant
            if(parseFloat(document.getElementById('displayTotal').innerText) === 0) {
                alert("Veuillez saisir un prix d'achat.");
                return;
            }

            const options = {
                margin: 10,
                filename: 'DEVIS_GSD_' + num + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            html2pdf().set(options).from(element).save();
        }

        function enregistrerDevis() {
            const total = document.getElementById('displayTotal').innerText;
            if(total === "0.00 €") return;
            const devis = {
                id: Date.now(),
                num: document.getElementById('numDevisDisplay').innerText,
                client: document.getElementById('nomClient').value || 'Client',
                total: total,
                date: document.getElementById('dateDevis').innerText
            };
            let h = JSON.parse(localStorage.getItem('gsd_devis') || "[]");
            h.unshift(devis);
            localStorage.setItem('gsd_devis', JSON.stringify(h));
            localStorage.setItem('gsd_last_id', parseInt(localStorage.getItem('gsd_last_id') || 0) + 1);
            location.reload();
        }

        function afficherHistorique() {
            const h = JSON.parse(localStorage.getItem('gsd_devis') || "[]");
            document.getElementById('historique').innerHTML = h.map(d => `
                <div class="bg-slate-900/50 p-3 rounded-2xl border border-slate-700 flex justify-between items-center">
                    <div><span class="text-[8px] text-slate-500">${d.num}</span><p class="font-bold text-emerald-400">${d.total}</p></div>
                    <button onclick="supprimerUn(${d.id})" class="text-red-500"><i class="fas fa-trash"></i></button>
                </div>`).join('');
        }

        function supprimerUn(id) {
            let h = JSON.parse(localStorage.getItem('gsd_devis') || "[]");
            localStorage.setItem('gsd_devis', JSON.stringify(h.filter(x => x.id !== id)));
            afficherHistorique();
        }

        function exporterDonnees() {
            const data = { devis: localStorage.getItem('gsd_devis'), last_id: localStorage.getItem('gsd_last_id') };
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type: "application/json"}));
            a.download = "SAVE_GSD.json";
            a.click();
        }

        function partagerWhatsApp() {
            const msg = `*GSD*\nDevis n° ${document.getElementById('numDevisDisplay').innerText}\nTotal : *${document.getElementById('displayTotal').innerText}*`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.onload = function() {
            document.getElementById('numDevisDisplay').innerText = obtenirProchainNumero();
            calculerDevis();
            afficherHistorique();
        };
    </script>
</body>
</html>
