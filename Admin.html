<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSD Admin | Éditeur de Devis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-gsd { background-color: #0f172a; }
        .accent-gsd { color: #10b981; }
    </style>
</head>
<body class="bg-gsd text-white font-sans p-4 pb-20">

    <div class="max-w-2xl mx-auto space-y-6">
        <header class="text-center py-4">
            <h1 class="text-2xl font-black text-emerald-400 uppercase tracking-tighter">GSD | Logiciel Devis</h1>
            <p class="text-slate-400 text-xs">Édition & Archivage interne</p>
        </header>

        <div class="bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700">
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1 ml-2">Lien de la pièce (Sourcing)</label>
                    <input type="url" id="lienPiece" placeholder="Lien Oscaro, Auto-doc, etc..." class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-emerald-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1 ml-2">Prix d'achat (€)</label>
                        <input type="number" id="prixAchat" oninput="calculerDevis()" placeholder="0.00" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl font-bold text-xl outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1 ml-2">Frais de Port (GSD)</label>
                        <select id="fraisPort" onchange="calculerDevis()" class="w-full p-4 bg-slate-700 border border-slate-600 rounded-2xl font-bold outline-none">
                            <option value="30">Petit Colis (30€)</option>
                            <option value="150">Moyen Colis (150€)</option>
                            <option value="0">À Définir (Gros)</option>
                        </select>
                    </div>
                </div>

                <div id="apercuDevis" class="bg-white text-slate-900 rounded-2xl p-6 shadow-inner border-t-8 border-emerald-600">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="font-black text-sm uppercase">Devis Client</h3>
                            <p class="text-[10px] text-slate-500 uppercase">Guyane Sourcing Direct</p>
                        </div>
                        <img src="Logo.jpg" class="h-8 opacity-50">
                    </div>
                    
                    <div class="border-y border-slate-100 py-4 my-4 space-y-2">
                        <div class="flex justify-between text-sm">
                            <span>Prix de la pièce :</span>
                            <span id="displayVente" class="font-bold">0.00 €</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span>Livraison (Est.) :</span>
                            <span id="displayPort" class="font-bold">30.00 €</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center">
                        <span class="text-xs font-black uppercase">Total à régler :</span>
                        <span id="displayTotal" class="text-3xl font-black text-emerald-600">0.00 €</span>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="enregistrerDevis()" class="bg-slate-700 text-white py-4 rounded-2xl font-black uppercase text-xs hover:bg-slate-600">
                        <i class="fas fa-save mr-2"></i> Enregistrer
                    </button>
                    <button onclick="partagerWhatsApp()" class="bg-[#25D366] text-white py-4 rounded-2xl font-black uppercase text-xs flex items-center justify-center gap-2">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </button>
                </div>
            </div>
        </div>

        <div class="space-y-4">
            <h2 class="text-sm font-black uppercase text-slate-500 ml-2">Derniers devis enregistrés</h2>
            <div id="historique" class="space-y-3">
                </div>
            <button onclick="effacerHistorique()" class="text-[10px] text-red-400 uppercase font-bold opacity-50">Effacer l'historique</button>
        </div>
    </div>

    <script>
        function calculerDevis() {
            const achat = parseFloat(document.getElementById('prixAchat').value) || 0;
            const port = parseFloat(document.getElementById('fraisPort').value);
            
            const prixVenteGSD = achat * 1.18;
            const total = prixVenteGSD + port;

            document.getElementById('displayVente').innerText = prixVenteGSD.toFixed(2) + " €";
            document.getElementById('displayPort').innerText = port === 0 ? "À DÉFINIR" : port.toFixed(2) + " €";
            document.getElementById('displayTotal').innerText = total.toFixed(2) + " €";
        }

        function enregistrerDevis() {
            const achat = document.getElementById('prixAchat').value;
            if(!achat) return alert("Saisis un prix avant d'enregistrer !");

            const devis = {
                date: new Date().toLocaleDateString('fr-FR'),
                total: document.getElementById('displayTotal').innerText,
                lien: document.getElementById('lienPiece').value
            };

            let historique = JSON.parse(localStorage.getItem('gsd_devis') || "[]");
            historique.unshift(devis);
            localStorage.setItem('gsd_devis', JSON.stringify(historique.slice(0, 10))); // Garde les 10 derniers
            afficherHistorique();
        }

        function afficherHistorique() {
            const container = document.getElementById('historique');
            const historique = JSON.parse(localStorage.getItem('gsd_devis') || "[]");
            
            container.innerHTML = historique.map(d => `
                <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700 flex justify-between items-center">
                    <div>
                        <p class="text-[10px] font-black text-slate-500 uppercase">${d.date}</p>
                        <p class="font-black text-emerald-400 text-lg">${d.total}</p>
                    </div>
                    ${d.lien ? `<a href="${d.lien}" target="_blank" class="bg-slate-700 p-3 rounded-xl text-xs"><i class="fas fa-link"></i></a>` : ''}
                </div>
            `).join('');
        }

        function partagerWhatsApp() {
            const total = document.getElementById('displayTotal').innerText;
            const lien = document.getElementById('lienPiece').value;
            const port = document.getElementById('displayPort').innerText;
            
            const message = `*GUYANE SOURCING DIRECT - DEVIS*\n\n` +
                            `Prix de la pièce : ${document.getElementById('displayVente').innerText}\n` +
                            `Frais de port : ${port}\n` +
                            `--------------------------\n` +
                            `*TOTAL À RÉGLER : ${total}*\n\n` +
                            `Lien source : ${lien ? lien : 'Consultable en agence'}\n\n` +
                            `Validez votre commande sur notre site officiel !`;

            window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
        }

        function effacerHistorique() {
            if(confirm("Effacer tous les devis enregistrés ?")) {
                localStorage.removeItem('gsd_devis');
                afficherHistorique();
            }
        }

        // Charger l'historique au démarrage
        afficherHistorique();
    </script>
</body>
</html>
