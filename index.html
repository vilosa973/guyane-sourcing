<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-image: url('Font_Premium.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            background-repeat: no-repeat; background-color: #1a1a1a;
        }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        section:hover { transform: translateY(-3px); background-color: rgba(255, 255, 255, 0.5) !important; }
        input, textarea, select {
            background-color: rgba(255, 255, 255, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #000 !important; font-weight: 700;
        }
        .tab-btn.active { background-color: #1d4ed8; color: white; border-bottom: 4px solid #1e40af; }
        .card-choice { transition: all 0.2s; border: 2px solid transparent; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">

    <div class="content-overlay flex flex-col">
        <header class="bg-white/95 p-4 text-center border-b-4 border-green-600 shadow-md sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo Guyane Sourcing Direct" class="h-16 mx-auto">
            <p class="text-green-700 text-[10px] font-black uppercase mt-1 tracking-widest">Sourcing • Logistique • Agricole • Auto</p>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full mt-6">

            <section class="rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-600">
                <div class="flex bg-white/50 border-b border-blue-200">
                    <button onclick="switchTab('plaque')" id="tab-plaque" class="tab-btn active flex-1 py-4 font-black uppercase text-xs">Auto (Plaque)</button>
                    <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-xs text-slate-600">Modèle / Agricole</button>
                </div>

                <div class="p-6 space-y-4">
                    <div id="form-plaque" class="space-y-4">
                        <input type="text" id="ai-immat" placeholder="AB-123-CD" class="w-full p-4 rounded-2xl uppercase text-center outline-none">
                    </div>

                    <div id="form-modele" class="hidden space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="m-marque" placeholder="MARQUE" class="p-3 rounded-xl text-sm uppercase text-center">
                            <input type="text" id="m-modele" placeholder="MODÈLE" class="p-3 rounded-xl text-sm uppercase text-center">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="m-type" class="p-3 rounded-xl text-sm text-center outline-none font-bold">
                                <option value="" disabled selected>TYPE</option>
                                <option value="Berline">Berline</option>
                                <option value="SUV">SUV / 4x4</option>
                                <option value="Citadine">Citadine</option>
                                <option value="Utilitaire">Utilitaire</option>
                                <option value="Tracteur">Tracteur</option>
                                <option value="Engin">Engin TP</option>
                            </select>
                            <select id="m-energie" class="p-3 rounded-xl text-sm text-center outline-none font-bold">
                                <option value="" disabled selected>ÉNERGIE</option>
                                <option value="Diesel">Diesel</option>
                                <option value="Essence">Essence</option>
                                <option value="Electrique">Électrique</option>
                            </select>
                        </div>
                    </div>

                    <input type="text" id="ai-piece" placeholder="PIÈCE RECHERCHÉE..." class="w-full p-4 rounded-2xl outline-none border-2 border-blue-500 shadow-inner">

                    <button onclick="rechercheIA()" id="btn-ia" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase shadow-lg flex items-center justify-center gap-3">
                        <i class="fas fa-search"></i> RECHERCHE
                    </button>

                    <div id="ai-resultat" class="hidden mt-4 space-y-4">
                        <div id="ai-loading" class="py-8 bg-white/80 rounded-2xl text-center"><i class="fas fa-sync fa-spin text-blue-700 text-3xl"></i><p class="font-bold mt-2 uppercase text-[10px]">Identification et Sourcing...</p></div>
                        <div id="ai-content" class="hidden space-y-4 text-left">
                            <div class="bg-white p-4 rounded-2xl flex items-center gap-4 shadow-md border-l-8 border-blue-700">
                                <img id="ai-vehicule-img" class="w-24 h-24 object-contain rounded-lg bg-slate-50 border" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3039/3039427.png'">
                                <div class="flex-1 text-left text-left">
                                    <p id="ai-modele-long" class="font-black uppercase text-base leading-tight text-slate-900"></p>
                                    <p id="ai-moteur-details" class="text-[11px] font-bold text-blue-600 mt-1 italic"></p>
                                </div>
                            </div>
                            <div id="offres-container" class="grid grid-cols-1 gap-3"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 border-2 border-orange-500 text-center">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center justify-center"><i class="fas fa-shield-check mr-3 text-orange-500"></i> Espace Client</h2>
                <div class="space-y-3"><input type="text" id="nomRecherche" placeholder="NOM (MAJUSCULES)" class="w-full p-4 rounded-2xl outline-none text-center"><div class="flex space-x-2"><input type="text" id="numDevis" placeholder="N° DEVIS" class="flex-1 p-4 rounded-2xl text-blue-900 font-black text-center outline-none"><button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-2xl shadow-lg"><i class="fas fa-search"></i></button></div></div>
                <div id="resultat" class="hidden mt-6 text-center"><div class="bg-slate-900/95 rounded-3xl p-6 text-center text-white border-b-8 border-yellow-500 shadow-2xl"><p id="nomClientDisplay" class="text-xl font-black uppercase text-yellow-500 mb-2"></p><div class="my-4 py-4 border-y border-slate-800 text-center"><p id="montantDisplay" class="text-5xl font-black text-white"></p></div><div id="statut" class="inline-block px-6 py-2 rounded-full text-white font-black text-[10px] uppercase shadow-inner text-center"></div></div><div id="zonePaiement" class="hidden mt-6 space-y-4"><a id="btnStripe" href="#" target="_blank" class="hidden w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase flex items-center justify-center gap-3"><i class="fas fa-credit-card"></i> Payer par Carte</a><a id="btnPaypal" href="#" target="_blank" class="hidden w-full bg-[#0070ba] text-white py-5 rounded-2xl font-black uppercase flex items-center justify-center gap-3"><i class="fab fa-paypal"></i> PayPal / 4X</a></div></div>
            </section>
        </div>
    </div>

    <script>
        const OPENAI_API_KEY = "sk-proj-fqujJmA0bqzAHOgU-GuxlZxDMVmUYyJXGqtUB0b4mLIiUsOiHOmWswLdWoV" + "aUkYkRfqi3ehEM3T3BlbkFJnlfBbAyJ_uxv0l58PwIrksEoFvxqx-TJ4eYzWgtx7m6AQCGP3qRIc0EzAduLZVTcyj-Bb1lkYA";

        function switchTab(tab) {
            document.getElementById('tab-plaque').classList.toggle('active', tab === 'plaque');
            document.getElementById('tab-modele').classList.toggle('active', tab === 'modele');
            document.getElementById('form-plaque').classList.toggle('hidden', tab !== 'plaque');
            document.getElementById('form-modele').classList.toggle('hidden', tab !== 'modele');
        }

        function copierTexte(btn, texte) {
            navigator.clipboard.writeText(texte).then(() => {
                const iconeOriginale = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check text-green-500"></i>';
                setTimeout(() => { btn.innerHTML = iconeOriginale; }, 1500);
            });
        }

        async function rechercheIA() {
            const piece = document.getElementById('ai-piece').value;
            const typeV = document.getElementById('m-type').value;
            let context = document.getElementById('ai-immat').value || `${typeV} ${document.getElementById('m-marque').value} ${document.getElementById('m-modele').value} ${document.getElementById('m-energie').value}`;
            
            if(!piece || !context) return alert("Infos manquantes !");
            
            document.getElementById('ai-resultat').classList.remove('hidden');
            document.getElementById('ai-loading').classList.remove('hidden');
            document.getElementById('ai-content').classList.add('hidden');

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${OPENAI_API_KEY}` },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{ 
                            role: "system", 
                            content: `Expert technique GSD. 
                            ÉTAPE 1 : Identifie le MODÈLE COMPLET (Ex: Peugeot 208 II 1.2 PureTech).
                            ÉTAPE 2 : Trouve 3 offres RÉELLES avec RÉFÉRENCE FABRICANT RÉELLE (OEM). 
                            ÉTAPE 3 : IMAGES : Trouve des URLs directes d'images produits (fond blanc) se terminant par .jpg ou .png. 
                            JSON format: {'machine':{'nom':'','infos':'','img':'URL_VEHICULE'}, 'offres':[{'vendeur':'','vendeur_logo':'','nom_piece':'','fabricant':'','ref_fab':'','prix_ht':0,'img_piece':'URL_PRODUIT','description_technique':'','garantie':''}]}` 
                        }, { role: "user", content: `Cherche ${piece} pour ce véhicule : ${context}` }],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                const res = JSON.parse(data.choices[0].message.content);
                const buildProxyUrl = (url) => url ? `https://wsrv.nl/?url=${encodeURIComponent(url)}&n=-1&output=webp` : 'https://cdn-icons-png.flaticon.com/512/3039/3039427.png';

                document.getElementById('ai-vehicule-img').src = buildProxyUrl(res.machine.img);
                document.getElementById('ai-modele-long').innerText = res.machine.nom;
                document.getElementById('ai-moteur-details').innerText = "⚙️ " + res.machine.infos;

                let html = "";
                res.offres.forEach(o => {
                    const prixFinal = (parseFloat(o.prix_ht) * 1.20) + 45;
                    const googleVerify = `https://www.google.com/search?q=${o.fabricant}+${o.ref_fab}+photo&tbm=isch`;
                    
                    html += `
                        <div class="card-choice bg-white rounded-2xl p-4 shadow-lg flex flex-col gap-3 text-left">
                            <div class="flex items-center gap-2 border-b pb-2"><img src="${buildProxyUrl(o.vendeur_logo)}" class="w-5 h-5 rounded border"><span class="text-[10px] font-black uppercase text-left">${o.vendeur}</span></div>
                            <div class="flex items-start gap-4">
                                <img src="${buildProxyUrl(o.img_piece)}" class="w-24 h-24 object-contain rounded border bg-white" onerror="this.src='Logo.jpg'">
                                <div class="flex-1 text-left">
                                    <p class="text-[11px] font-black uppercase text-left">${o.nom_piece}</p>
                                    <p class="text-[10px] text-blue-600 font-bold text-left">${o.fabricant}</p>
                                    <p class="text-[8px] text-slate-500 italic text-left">${o.description_technique}</p>
                                    <div class="mt-2 p-2 bg-slate-50 rounded border flex flex-col gap-1 text-left text-left">
                                        <div class="flex justify-between items-center text-left text-left">
                                            <span class="text-[9px] font-black uppercase text-left">Réf: ${o.ref_fab}</span>
                                            <button onclick="copierTexte(this, '${o.ref_fab}')" class="text-slate-400 hover:text-blue-700 text-left"><i class="far fa-copy text-xs"></i></button>
                                        </div>
                                        <a href="${googleVerify}" target="_blank" class="text-[8px] text-blue-500 underline font-bold uppercase text-left"><i class="fas fa-eye"></i> Vérifier la photo sur Google</a>
                                    </div>
                                </div>
                                <div class="text-right min-w-[90px] text-right"><p class="text-xl font-black text-right">${prixFinal.toFixed(2)}€</p><button onclick="window.location.href='https://wa.me/33699337803?text=Commande: ${o.ref_fab}'" class="mt-2 bg-slate-900 text-white text-[8px] px-3 py-1.5 rounded-lg font-black uppercase text-center">Commander</button></div>
                            </div>
                        </div>`;
                });
                document.getElementById('offres-container').innerHTML = html;
                document.getElementById('ai-loading').classList.add('hidden');
                document.getElementById('ai-content').classList.remove('hidden');
            } catch (e) { alert("Erreur sourcing. Soyez plus précis !"); }
        }

        async function chercherDossier() {
            const nomSaisi = document.getElementById('nomRecherche').value.trim().toUpperCase();
            const idSaisi = document.getElementById('numDevis').value.trim().toUpperCase();
            if(!nomSaisi || !idSaisi) return alert("Identifiants requis.");
            try {
                const response = await fetch("https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/export?format=csv");
                const data = await response.text();
                const lignes = data.split('\n');
                let trouve = false;
                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(col[0]?.replace(/"/g, '').trim().toUpperCase() === idSaisi && col[2]?.replace(/"/g, '').trim().toUpperCase() === nomSaisi) {
                        trouve = true;
                        document.getElementById('resultat').classList.remove('hidden');
                        document.getElementById('nomClientDisplay').innerText = col[1]?.replace(/"/g, '').trim() + " " + col[2]?.replace(/"/g, '').trim();
                        document.getElementById('montantDisplay').innerText = col[7]?.replace(/"/g, '').trim() + " €";
                        const s = document.getElementById('statut');
                        s.innerText = col[3]?.replace(/"/g, '').trim();
                        s.style.backgroundColor = s.innerText.toLowerCase().includes('payé') ? '#00843D' : '#D97706';
                        
                        const stripeL = col[4]?.replace(/"/g, '').trim();
                        if(stripeL?.startsWith('http')) { document.getElementById('btnStripe').href = stripeL; document.getElementById('btnStripe').classList.remove('hidden'); }
                        const paypalL = col[6]?.replace(/"/g, '').trim();
                        if(paypalL?.startsWith('http')) { document.getElementById('btnPaypal').href = paypalL; document.getElementById('btnPaypal').classList.remove('hidden'); }
                        document.getElementById('zonePaiement').classList.remove('hidden');
                        break;
                    }
                }
                if (!trouve) alert("Dossier introuvable.");
            } catch (e) { alert("Erreur réseau."); }
        }
    </script>
</body>
</html>
