<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Pièces Auto & Logistique 973</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* FOND GÉNÉRÉ PAR CODE - AUCUNE IMAGE REQUISE */
        body {
            background: linear-gradient(135deg, rgba(0,85,164,0.08) 0%, rgba(255,255,255,1) 50%, rgba(0,132,61,0.08) 100%);
            background-attachment: fixed;
            min-height: 100-screen;
        }

        /* ICÔNES LOGISTIQUES EN FILIGRANE */
        .watermark {
            position: fixed;
            z-index: -1;
            color: rgba(0,0,0,0.03);
            pointer-events: none;
        }

        .bg-guyane-green { background-color: #00843D; }
        .text-guyane-yellow { color: #FFCD00; }
        
        @keyframes planeTravel {
            0% { transform: translateX(-30px) translateY(10px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(30px) translateY(-10px); opacity: 0; }
        }
        .animate-plane { animation: planeTravel 4s infinite linear; }
    </style>
</head>
<body class="font-sans flex flex-col min-h-screen">

    <i class="fas fa-plane watermark" style="top: 15%; left: 10%; font-size: 8rem; transform: rotate(-20deg);"></i>
    <i class="fas fa-ship watermark" style="bottom: 20%; right: 10%; font-size: 10rem;"></i>
    <i class="fas fa-truck-container watermark" style="top: 40%; right: 15%; font-size: 7rem; transform: rotate(10deg);"></i>

    <header class="bg-white/90 backdrop-blur-md shadow-md p-6 text-center border-b-4 border-guyane-green sticky top-0 z-50">
        <img src="Logo.jpg" alt="Logo Guyane Sourcing Direct" class="h-24 mx-auto mb-2 drop-shadow-md">
        <p class="text-guyane-green text-xs mt-1 font-black italic uppercase tracking-[0.3em]">Sourcing • Logistique • Guyane</p>
    </header>

    <div class="max-w-2xl mx-auto p-4 space-y-8 flex-grow w-full">

        <section class="bg-white/85 backdrop-blur-sm rounded-3xl shadow-lg p-6 border border-slate-100">
            <h2 class="text-xl font-black text-slate-800 uppercase mb-6 flex items-center border-b-2 border-blue-700 pb-2">
                <i class="fas fa-file-invoice-dollar mr-3 text-blue-700"></i> Demande de Devis
            </h2>
            <form id="devisForm" action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4">
                <input type="text" name="nom" placeholder="Votre Nom complet" required class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" name="immatriculation" placeholder="Immatriculation" required class="w-full p-4 bg-blue-50/50 border-2 border-blue-100 rounded-2xl font-bold outline-none focus:border-blue-600 uppercase text-center">
                    <input type="text" name="modele" placeholder="Marque / Modèle" class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600">
                </div>
                <input type="tel" name="telephone" placeholder="Téléphone" required class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600">
                <input type="email" name="email" placeholder="Adresse Email" required class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600">
                <textarea name="besoin" placeholder="Détaillez votre besoin ici..." rows="3" required class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-600"></textarea>
                <button type="submit" class="w-full bg-blue-700 text-white py-5 rounded-2xl font-black text-lg uppercase tracking-widest shadow-md hover:bg-blue-800 transition-all">Envoyer ma demande</button>
            </form>
            <div id="successMessage" class="hidden text-center p-6 bg-green-100 text-green-800 rounded-2xl font-bold">
                <i class="fas fa-check-circle text-3xl mb-2"></i><br>Merci ! Votre demande a été envoyée.
            </div>
        </section>

        <section class="bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl p-6 border-2 border-guyane-green">
            <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center">
                <i class="fas fa-shield-check mr-3 text-guyane-green"></i> Espace Client Sécurisé
            </h2>
            
            <div class="space-y-3">
                <input type="text" id="nomRecherche" onkeypress="if(event.key === 'Enter') chercherDossier()" placeholder="VOTRE NOM (SANS M. OU MME)" class="w-full p-4 border-2 border-slate-100 rounded-2xl font-bold text-slate-700 uppercase outline-none focus:border-guyane-green transition-all">
                <div class="flex space-x-2">
                    <input type="text" id="numDevis" onkeypress="if(event.key === 'Enter') chercherDossier()" placeholder="N° DE DEVIS" class="flex-1 p-4 border-2 border-slate-100 rounded-2xl font-black text-blue-700 uppercase outline-none focus:border-guyane-green text-center transition-all">
                    <button onclick="chercherDossier()" class="bg-guyane-green text-white px-8 py-4 rounded-2xl shadow-lg hover:brightness-110 transition-all">
                        <i class="fas fa-search text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div id="resultat" class="hidden mt-8">
                <div class="flex justify-center mb-4 text-slate-300">
                    <i class="fas fa-plane text-4xl animate-plane"></i>
                </div>

                <div class="bg-slate-900/95 rounded-3xl p-6 text-center text-white border-b-8 border-guyane-yellow shadow-2xl">
                    <p id="nomClientDisplay" class="text-xl font-black uppercase tracking-widest text-guyane-yellow mb-2"></p>
                    <div class="my-4 py-4 px-2 border-y border-slate-700">
                        <p class="text-slate-500 text-[10px] font-black uppercase tracking-[0.3em] mb-1">Montant à régler</p>
                        <p id="montantDisplay" class="text-5xl font-black text-white"></p>
                    </div>
                    <p id="detailDevis" class="text-[10px] font-bold text-slate-500 uppercase mb-4 italic"></p>
                    <div id="statut" class="inline-block px-5 py-2 rounded-full text-white font-black text-[10px] uppercase tracking-widest shadow-inner"></div>
                </div>
                
                <div id="zonePaiement" class="hidden mt-6 space-y-4 text-center border-t border-slate-100 pt-6">
                    <p class="text-[10px] font-black uppercase tracking-widest text-emerald-600 mb-2"><i class="fas fa-lock"></i> Paiement 100% Sécurisé</p>
                    <a id="btnStripe" href="#" target="_blank" class="hidden w-full bg-[#059669] text-white py-5 rounded-2xl font-black text-lg uppercase shadow-lg flex items-center justify-center gap-3">
                        <i class="fas fa-credit-card"></i> Payer par Carte
                    </a>
                    <a id="btnPaypal" href="#" target="_blank" class="hidden w-full bg-[#0070ba] text-white py-5 rounded-2xl font-black text-lg uppercase shadow-lg flex items-center justify-center gap-3">
                        <i class="fab fa-paypal"></i> PayPal / 4X
                    </a>
                    <div class="flex justify-center items-center gap-8 pt-6 text-slate-400">
                        <div class="text-center"><i class="fas fa-plane-departure text-xl"></i><p class="text-[8px] uppercase mt-1 font-bold">Aérien</p></div>
                        <div class="text-center"><i class="fas fa-ship text-xl"></i><p class="text-[8px] uppercase mt-1 font-bold">Maritime</p></div>
                        <div class="text-center"><i class="fas fa-truck-container text-xl"></i><p class="text-[8px] uppercase mt-1 font-bold">Route</p></div>
                    </div>
                </div>
            </div>
        </section>

        <a href="https://wa.me/33699337803" class="flex items-center justify-center space-x-4 bg-[#25D366] text-white p-5 rounded-2xl font-black shadow-xl hover:scale-[1.02] transition-transform">
            <i class="fab fa-whatsapp text-4xl"></i><span class="text-xl uppercase tracking-tighter text-center">Assistance WhatsApp Direct</span>
        </a>
    </div>

    <footer class="bg-white/80 mt-12 p-10 text-center border-t border-slate-200 text-slate-400 text-[10px] uppercase font-bold tracking-widest">
        <p>© 2026 Guyane Sourcing Direct | VILOSA</p>
    </footer>

    <script>
        const urlCSV = "https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/export?format=csv";
        
        const formDevis = document.getElementById('devisForm');
        formDevis.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(formDevis);
            await fetch(formDevis.action, { method: 'POST', body: formData, headers: {'Accept': 'application/json'} });
            formDevis.classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
        };

        async function chercherDossier() {
            const nomSaisi = document.getElementById('nomRecherche').value.trim().toUpperCase();
            const idSaisi = document.getElementById('numDevis').value.trim().toUpperCase();
            const res = document.getElementById('resultat');
            if(!nomSaisi || !idSaisi) return;
            
            try {
                const response = await fetch(urlCSV);
                const data = await response.text();
                const lignes = data.split('\n');
                let trouve = false;
                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(col[0]?.replace(/"/g, '').trim().toUpperCase() === idSaisi && col[2]?.replace(/"/g, '').trim().toUpperCase() === nomSaisi) {
                        trouve = true;
                        res.classList.remove('hidden');
                        document.getElementById('nomClientDisplay').innerText = col[1]?.replace(/"/g, '').trim() + " " + col[2]?.replace(/"/g, '').trim();
                        document.getElementById('montantDisplay').innerText = col[7]?.replace(/"/g, '').trim() + " €";
                        document.getElementById('detailDevis').innerText = "Réf. Dossier : " + idSaisi + " • " + col[5]?.replace(/"/g, '').trim();
                        const s = document.getElementById('statut');
                        s.innerText = col[3]?.replace(/"/g, '').trim();
                        s.style.backgroundColor = s.innerText.toLowerCase().includes('payé') ? '#00843D' : '#D97706';
                        document.getElementById('zonePaiement').classList.remove('hidden');
                        const bStripe = document.getElementById('btnStripe');
                        const linkStripe = col[4]?.replace(/"/g, '').trim();
                        if(linkStripe?.startsWith('http')) { bStripe.href = linkStripe; bStripe.classList.remove('hidden'); bStripe.classList.add('flex'); }
                        const bPaypal = document.getElementById('btnPaypal');
                        const linkPaypal = col[6]?.replace(/"/g, '').trim();
                        if(linkPaypal?.startsWith('http')) { bPaypal.href = linkPaypal; bPaypal.classList.remove('hidden'); bPaypal.classList.add('flex'); }
                        break;
                    }
                }
                if (!trouve) alert("Dossier introuvable.");
            } catch (e) { alert("Erreur de connexion."); }
        }
    </script>
</body>
</html>
