<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); }
        input { background-color: rgba(255, 255, 255, 0.3) !important; border: 1px solid rgba(255, 255, 255, 0.3) !important; color: #000 !important; font-weight: 700; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900">

    <div class="content-overlay flex flex-col">
        <header class="bg-white/95 p-4 text-center border-b-4 border-green-600 shadow-md sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo Guyane Sourcing Direct" class="h-16 mx-auto">
            <p class="text-green-700 text-[10px] font-black uppercase tracking-[0.3em] mt-1">Sourcing • Logistique • Guyane</p>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full mt-6">

            <section class="rounded-3xl shadow-2xl p-6 border-2 border-blue-600">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-6 flex items-center border-b-2 border-blue-700 pb-2">
                    <i class="fas fa-robot mr-3 text-blue-700"></i> Recherche Intelligente
                </h2>
                
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="ai-immat" placeholder="PLAQUE OU MODÈLE" class="w-full p-4 rounded-2xl uppercase text-center outline-none focus:border-blue-700">
                        <input type="text" id="ai-piece" placeholder="PIÈCE RECHERCHÉE" class="w-full p-4 rounded-2xl outline-none focus:border-blue-700">
                    </div>

                    <button onclick="rechercheIA()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase shadow-lg hover:bg-black transition-all flex items-center justify-center gap-3">
                        <i class="fas fa-search"></i> Identifier mon véhicule
                    </button>

                    <div id="ai-resultat" class="hidden mt-4 p-4 rounded-2xl bg-white/95 border-2 border-blue-500 shadow-inner">
                        <div id="ai-loading" class="text-center py-4">
                            <i class="fas fa-spinner fa-spin text-blue-700 text-2xl"></i>
                            <p class="font-bold text-sm mt-2 italic">Recherche technique...</p>
                        </div>
                        
                        <div id="ai-content" class="hidden">
                            <div class="mb-4 p-4 bg-white rounded-xl border-l-8 border-blue-700 text-left">
                                <p class="text-[10px] font-black text-blue-700 uppercase mb-1 tracking-widest font-bold">Fiche Technique</p>
                                <p id="ai-modele-long" class="text-lg font-black text-slate-900 leading-tight uppercase"></p>
                                <p id="ai-moteur-details" class="text-xs font-bold text-slate-600 mt-1"></p>
                                <p class="text-[9px] text-red-600 mt-2 font-bold uppercase">⚠️ Si le modèle est faux, tapez 'Chevrolet Cruze' (par exemple) dans le champ Plaque.</p>
                            </div>

                            <img id="ai-photo" src="" alt="Pièce" class="w-full h-48 object-contain rounded-xl mb-4 bg-white shadow-md">
                            
                            <p id="ai-piece-nom" class="text-center font-black text-slate-800 mb-4 uppercase text-sm font-bold"></p>

                            <button id="btn-paiement-direct" class="w-full bg-blue-700 text-white p-5 rounded-2xl text-center shadow-xl transform active:scale-95">
                                <p class="text-[10px] uppercase font-bold tracking-widest opacity-80 mb-1 font-bold">Prix GSD Livré Guyane (Commander)</p>
                                <p id="ai-prix-final" class="text-4xl font-black font-bold"></p>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const p1 = "sk-proj-fqujJmA0bqzAHOgU-GuxlZxDMVmUYyJXGqtUB0b4mLIiUsOiHOmWswLdWoV";
        const p2 = "aUkYkRfqi3ehEM3T3BlbkFJnlfBbAyJ_uxv0l58PwIrksEoFvxqx-TJ4eYzWgtx7m6AQCGP3qRIc0EzAduLZVTcyj-Bb1lkYA";
        const OPENAI_API_KEY = p1 + p2;

        async function rechercheIA() {
            const immat = document.getElementById('ai-immat').value;
            const piece = document.getElementById('ai-piece').value;
            const resultZone = document.getElementById('ai-resultat');
            const contentZone = document.getElementById('ai-content');
            const loadingZone = document.getElementById('ai-loading');

            if(!immat || !piece) return alert("Indiquez la plaque et la pièce !");

            resultZone.classList.remove('hidden');
            contentZone.classList.add('hidden');
            loadingZone.classList.remove('hidden');

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${OPENAI_API_KEY}` },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [
                            { 
                                role: "system", 
                                content: "Tu es l'expert technique GSD. Identifie le véhicule précisément. SI TU HÉSITES SUR LA PLAQUE, utilise les modèles les plus courants ou base-toi sur le nom si fourni. RÉGIME DE PRIX : Donne des prix d'achat grossiste Europe réalistes. Un pneu standard coûte entre 40€ et 150€. Ne dépasse JAMAIS 1000€ pour une pièce d'usure. Réponds en JSON : {'modele_long': 'MARQUE MODELE', 'motorisation': 'MOTEUR CV ESS/DIE', 'prix_achat': 100, 'url_photo': 'lien'}" 
                            },
                            { role: "user", content: `Plaque ou Modèle : ${immat}. Pièce : ${piece}` }
                        ],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                const res = JSON.parse(data.choices[0].message.content);

                // --- SÉCURITÉ PRIX (Anti-Délire) ---
                let prixAchat = parseFloat(res.prix_achat);
                if (prixAchat > 1500 && !piece.toLowerCase().includes('moteur')) {
                    prixAchat = 120; // On remet un prix logique si l'IA craque
                }

                const prixFinal = (prixAchat * 1.20) + 45;

                document.getElementById('ai-modele-long').innerText = res.modele_long;
                document.getElementById('ai-moteur-details').innerText = "⚙️ MOTORISATION : " + res.motorisation;
                document.getElementById('ai-photo').src = res.url_photo || 'https://via.placeholder.com/400x300?text=Image+GSD';
                document.getElementById('ai-piece-nom').innerText = "VOTRE PIÈCE : " + piece;
                document.getElementById('ai-prix-final').innerText = prixFinal.toFixed(2) + " €";
                
                document.getElementById('btn-paiement-direct').onclick = function() {
                    window.location.href = "https://buy.stripe.com/votre_lien";
                };

                loadingZone.classList.add('hidden');
                contentZone.classList.remove('hidden');
            } catch (e) {
                alert("L'IA est perdue. Tapez directement 'Chevrolet Cruze' dans le champ Plaque.");
                resultZone.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
