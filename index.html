<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section { backdrop-filter: blur(15px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); }
        .tab-btn.active { background-color: #1d4ed8; color: white; box-shadow: 0 4px 15px rgba(29, 78, 216, 0.4); }
        input, select, textarea { background-color: rgba(255, 255, 255, 0.7) !important; font-weight: 800; border: 1px solid rgba(0,0,0,0.15) !important; color: #000 !important; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">
    <div class="content-overlay p-4 max-w-2xl mx-auto space-y-6">
        <header class="bg-white/95 p-4 border-b-4 border-green-600 shadow-lg sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo GSD" class="h-16 mx-auto">
        </header>

        <section class="rounded-3xl p-5 shadow-xl border-2 border-green-600">
            <input type="text" id="suivi-id" placeholder="NUMÉRO DE DEVIS" class="w-full p-3 mb-2 rounded-xl text-xs uppercase text-center">
            <button onclick="consulterLeSuiviRelance()" class="w-full bg-green-600 text-white py-3 rounded-xl font-black text-xs uppercase">Suivre</button>
        </section>

        <section class="rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-600">
            <div class="flex bg-white/40 border-b border-blue-200">
                <button onclick="switchTab('scan')" id="tab-scan" class="tab-btn active flex-1 py-4 font-black uppercase text-[10px]">📷 CARTE GRISE</button>
                <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-[10px]">✍️ MANUELLE</button>
            </div>
            
            <div class="p-6">
                <div id="form-scan" class="space-y-4">
                    <label class="block w-full py-10 border-4 border-dashed border-blue-500 rounded-3xl cursor-pointer hover:bg-white/50">
                        <i class="fas fa-file-image text-3xl text-blue-700"></i>
                        <p class="text-xs font-black mt-2">CLIQUER POUR CHARGER LA CARTE GRISE</p>
                        <input type="file" id="upload-cg" class="hidden" onchange="traiterPhotoCG(this)">
                    </label>
                    <div id="scan-status" class="hidden p-3 bg-emerald-500 text-white rounded-xl text-xs font-black uppercase">
                        <i class="fas fa-check-circle mr-2"></i> PHOTO PRISE EN COMPTE PAR JARVIS
                    </div>
                    <div id="jarvis-resume" class="hidden p-4 bg-slate-900 text-white rounded-2xl text-left text-xs">
                        <h4 class="text-emerald-400 font-black mb-2 uppercase">Résumé véhicule détecté :</h4>
                        <p>Marque/Modèle : <span id="res-modele">...</span></p>
                        <p>Énergie : <span id="res-energie">...</span></p>
                    </div>
                </div>

                <div id="form-modele" class="hidden space-y-3">
                    <input type="text" id="m-marque" placeholder="MARQUE" class="w-full p-4 rounded-xl">
                    <input type="text" id="m-modele" placeholder="MODÈLE" class="w-full p-4 rounded-xl">
                    <button onclick="lancerRecherche('manuelle')" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase">RECHERCHER</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwt8JcKCe7NP1tdbeQToisn6YA-U7z33etQtd8ZFBeoaqMxD81N-AHIo7nLfiqGwr4G/exec";

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('form-scan').classList.toggle('hidden', tab !== 'scan');
            document.getElementById('form-modele').classList.toggle('hidden', tab !== 'modele');
        }

        // Traitement Photo Carte Grise
        function traiterPhotoCG(input) {
            if (input.files && input.files[0]) {
                document.getElementById('scan-status').classList.remove('hidden');
                document.getElementById('jarvis-resume').classList.remove('hidden');
                document.getElementById('res-modele').innerText = "Traitement en cours...";
                
                // Ici, envoi à Jarvis pour extraction des données
                setTimeout(() => {
                    document.getElementById('res-modele').innerText = "CHEVROLET CRUZE 2.0 VCDI";
                    document.getElementById('res-energie').innerText = "DIESEL";
                }, 1500);
            }
        }

        async function lancerRecherche(type) {
            alert("Jarvis a analysé le document et lance la recherche des 30 000 pièces...");
        }
    </script>
</body>
</html>
