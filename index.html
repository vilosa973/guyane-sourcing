<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct - Suivi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-white shadow-md p-4 text-center">
        <h1 class="text-2xl font-bold text-blue-600">GUYANE SOURCING DIRECT</h1>
        <p class="text-gray-500 text-sm">Votre partenaire logistique & sourcing</p>
    </header>

    <main class="max-w-md mx-auto mt-10 p-6 bg-white rounded-xl shadow-lg">
        <h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fas fa-box-open mr-2 text-blue-500"></i>Suivi de votre dossier</h2>
        
        <p class="text-sm text-gray-600 mb-4">Entrez votre numéro de devis (ex: 01300426) pour voir l'avancement.</p>

        <div class="flex space-x-2 mb-6">
            <input type="text" id="numDevis" placeholder="N° de devis..." class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="chercherDossier()" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-blue-700 transition">
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div id="resultat" class="hidden border-t pt-6 animate-fade-in">
            <div class="bg-gray-50 p-4 rounded-lg">
                <p class="text-xs text-gray-400 uppercase font-bold mb-1">Client & Commande</p>
                <p id="nomClient" class="text-lg font-bold text-gray-800 mb-4">-</p>

                <p class="text-xs text-gray-400 uppercase font-bold mb-1">Statut actuel</p>
                <span id="statut" class="inline-block px-4 py-2 rounded-full text-white font-bold text-sm shadow-sm mb-4">
                    Chargement...
                </span>

                <div id="infoLogistique" class="mt-4 p-3 bg-blue-50 border-l-4 border-blue-400 rounded">
                    <p id="infoColis" class="text-sm text-blue-800 font-medium"></p>
                    <div id="lienSuivi" class="mt-3"></div>
                </div>
            </div>
        </div>
    </main>

    <div class="text-center mt-10">
        <a href="https://wa.me/594694200000" class="inline-flex items-center bg-green-500 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:bg-green-600 transition">
            <i class="fab fa-whatsapp mr-2 text-xl"></i> Une question ? Contactez-nous
        </a>
    </div>

    <script>
        // ON UTILISE TON LIEN DE FICHIER DIRECTEMENT
        // Le code va transformer automatiquement ton lien pour pouvoir le lire
        const linkPrivé = "https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/edit";
        const urlCSV = linkPrivé.replace('/edit', '/export?format=csv');

        async function chercherDossier() {
            const idRecherche = document.getElementById('numDevis').value.trim();
            const res = document.getElementById('resultat');
            
            if(!idRecherche) return alert("Veuillez entrer un numéro.");

            try {
                const response = await fetch(urlCSV);
                const data = await response.text();
                
                // Découpage du tableau
                const lignes = data.split('\n').map(l => l.split(','));
                const dossiers = {};
                
                // On remplit la liste des dossiers depuis ton Google Sheets
                for (let i = 1; i < lignes.length; i++) {
                    const [id, client, statut, details, suivi] = lignes[i];
                    if(id) {
                        // On enlève les guillemets et les espaces
                        const cleanId = id.replace(/"/g, '').trim();
                        dossiers[cleanId] = { 
                            nom: client ? client.replace(/"/g, '') : "", 
                            statut: statut ? statut.replace(/"/g, '') : "En cours", 
                            details: details ? details.replace(/"/g, '') : "", 
                            suivi: suivi ? suivi.replace(/"/g, '').trim() : "" 
                        };
                    }
                }

                const dossier = dossiers[idRecherche];

                if (dossier) {
                    res.classList.remove('hidden');
                    document.getElementById('nomClient').innerText = dossier.nom + (dossier.details ? " (" + dossier.details + ")" : "");
                    document.getElementById('statut').innerText = dossier.statut;
                    
                    // Gestion des couleurs selon les mots clés dans ton tableau
                    let st = dossier.statut.toLowerCase();
                    let couleur = "#3b82f6"; // Bleu par défaut
                    if(st.includes("attente") || st.includes("paiement")) couleur = "#f59e0b"; // Orange
                    if(st.includes("payé") || st.includes("expédié") || st.includes("reçu")) couleur = "#10b981"; // Vert
                    
                    document.getElementById('statut').style.backgroundColor = couleur;
                    
                    if (dossier.suivi && dossier.suivi.length > 5) {
                        document.getElementById('infoColis').innerText = "Votre colis est en route !";
                        document.getElementById('lienSuivi').innerHTML = `
                            <a href="https://www.17track.net/fr/track?nums=${dossier.suivi}" target="_blank" class="block w-full bg-blue-600 text-white text-center py-2 rounded-lg font-bold text-xs uppercase shadow hover:bg-blue-700 transition">
                                <i class="fas fa-shipping-fast mr-2"></i> Suivre sur 17TRACK
                            </a>`;
                    } else {
                        document.getElementById('infoColis').innerText = "Aucun numéro de suivi disponible pour le moment.";
                        document.getElementById('lienSuivi').innerHTML = "";
                    }
                } else {
                    alert("Numéro " + idRecherche + " non trouvé. Vérifiez votre tableau Google Sheets.");
                }
            } catch (error) {
                console.error(error);
                alert("Erreur de connexion au tableau. Assurez-vous d'avoir cliqué sur 'Publier sur le web' dans Google Sheets.");
            }
        }
    </script>
</body>
</html>
