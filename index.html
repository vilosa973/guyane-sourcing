<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-image: url('Font_Premium.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #1a1a1a;
        }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        input, textarea, select {
            background-color: rgba(255, 255, 255, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #000 !important;
            font-weight: 700;
        }
        input::placeholder, textarea::placeholder { color: #374151; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900">

    <div class="content-overlay flex flex-col">
        
        <header class="bg-white/95 p-4 text-center border-b-4 border-green-600 shadow-md sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo Guyane Sourcing Direct" class="h-16 mx-auto">
            <p class="text-green-700 text-[10px] font-black uppercase tracking-[0.3em] mt-1">Sourcing • Logistique • Guyane</p>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full mt-6">

            <section class="rounded-3xl shadow-2xl p-6 border-2 border-blue-600">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-6 flex items-center border-b-2 border-blue-700 pb-2">
                    <i class="fas fa-robot mr-3 text-blue-700"></i> Recherche Intelligente
                </h2>
                
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="ai-immat" placeholder="PLAQUE IMMAT" class="w-full p-4 rounded-2xl uppercase text-center outline-none focus:border-blue-700">
                        <input type="text" id="ai-piece" placeholder="PIÈCE RECHERCHÉE" class="w-full p-4 rounded-2xl outline-none focus:border-blue-700">
                    </div>

                    <button onclick="rechercheIA()" id="btn-ia" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase shadow-lg hover:bg-black transition-all flex items-center justify-center gap-3">
                        <i class="fas fa-search"></i> Identifier mon véhicule
                    </button>

                    <div id="ai-resultat" class="hidden mt-4 p-4 rounded-2xl bg-white/95 border-2 border-blue-500 shadow-inner">
                        <div id="ai-loading" class="text-center py-4">
                            <i class="fas fa-spinner fa-spin text-blue-700 text-2xl"></i>
                            <p class="font-bold text-sm mt-2 italic">Analyse de la motorisation...</p>
                        </div>
                        
                        <div id="ai-content" class="hidden">
                            <div class="mb-4 p-4 bg-slate-100 rounded-xl border-l-8 border-blue-700 text-left shadow-sm">
                                <p class="text-[10px] font-black text-blue-700 uppercase tracking-widest mb-1">Véhicule identifié</p>
                                <p id="ai-modele-long" class="text-lg font-black text-slate-900 leading-tight uppercase"></p>
                                <p id="ai-moteur-details" class="text-xs font-bold text-slate-600 mt-1 italic"></p>
                            </div>

                            <img id="ai-photo" src="" alt="Pièce" class="w-full h-48 object-contain rounded-xl mb-4 bg-white shadow-md border-4 border-white">
                            
                            <p id="ai-piece-nom" class="text-center font-black text-slate-800 mb-4 uppercase text-sm"></p>

                            <button id="btn-paiement-direct" class="w-full bg-blue-700 text-white p-5 rounded-2xl text-center shadow-xl hover:bg-blue-800 transition-all transform active:scale-95 group">
                                <p class="text-[10px] uppercase font-bold tracking-widest opacity-80 mb-1 group-hover:scale-110 transition-transform">Prix GSD Livré Guyane (Commander)</p>
                                <p id="ai-prix-final" class="text-4xl font-black"></p>
                            </button>
                            
                            <p class="text-[9px] text-center mt-4 text-slate-500 italic font-bold">Vérifiez la motorisation ci-dessus. Cliquez sur le prix pour régler via Stripe.</p>
                        </div>
                    </div>
                </div>
            </section>

            <form id="hidden-form" action="https://formspree.io/f/meenjkyj" method="POST" class="hidden">
                <input type="hidden" name="details_ia" id="final-besoin">
            </form>

            <a href="https://wa.me/33699337803" class="flex items-center justify-center space-x-4 bg-[#25D366] text-white p-5 rounded-3xl font-black shadow-xl hover:scale-[1.02] transition-transform">
                <i class="fab fa-whatsapp text-4xl"></i>
                <span class="text-xl uppercase tracking-tighter text-center">Assistance WhatsApp Direct</span>
            </a>
        </div>

        <footer class="bg-white/80 p-8 text-center mt-10 text-slate-500 text-[10px] uppercase font-bold tracking-[0.3em]">
            © 2026 Guyane Sourcing Direct | VILOSA
        </footer>
    </div>

    <script>
        // --- CONFIGURATION IA (Clé découpée) ---
        const partA = "sk-proj-fqujJmA0bqzAHOgU-GuxlZxDMVmUYyJXGqtUB0b4mLIiUsOiHOmWswLdWoV";
        const partB = "aUkYkRfqi3ehEM3T3BlbkFJnlfBbAyJ_uxv0l58PwIrksEoFvxqx-TJ4eYzWgtx7m6AQCGP3qRIc0EzAduLZVTcyj-Bb1lkYA";
        const OPENAI_API_KEY = partA + partB;

        async function rechercheIA() {
            const immat = document.getElementById('ai-immat').value;
            const piece = document.getElementById('ai-piece').value;
            const resultZone = document.getElementById('ai-resultat');
            const contentZone = document.getElementById('ai-content');
            const loadingZone = document.getElementById('ai-loading');

            if(!immat || !piece) { alert("Indiquez la plaque et la pièce !"); return; }

            resultZone.classList.remove('hidden');
            contentZone.classList.add('hidden');
            loadingZone.classList.remove('hidden');

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${OPENAI_API_KEY}` },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [
                            { 
                                role: "system", 
                                content: "Tu es l'expert technique de Guyane Sourcing Direct. 1. Identifie le véhicule via la plaque. 2. Donne le modèle précis, la motorisation exacte (ex: 1.5 BlueHDi 130ch), et le carburant. 3. Trouve le prix d'achat moyen (EURO). 4. Trouve un lien d'image direct JPG/PNG. Réponds en JSON : {'modele_long': 'PEUGEOT 3008 II', 'motorisation': '1.2 PureTech 131ch Essence S&S', 'prix_achat': 100, 'url_photo': 'lien'}" 
                            },
                            { role: "user", content: `Plaque : ${immat}, Pièce : ${piece}` }
                        ],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                const res = JSON.parse(data.choices[0].message.content);

                // --- CALCUL GSD (MARGE 20% + TRANSPORT 45€) ---
                const prixFinal = (parseFloat(res.prix_achat) * 1.20) + 45;
                const prixTexte = prixFinal.toFixed(2);

                // Mise à jour de la Fiche Technique
                document.getElementById('ai-modele-long').innerText = res.modele_long;
                document.getElementById('ai-moteur-details').innerText = "⚙️ " + res.motorisation;
                document.getElementById('ai-photo').src = res.url_photo || 'https://via.placeholder.com/400x300?text=Image+GSD';
                document.getElementById('ai-piece-nom').innerText = "RECHERCHE : " + piece;
                document.getElementById('ai-prix-final').innerText = prixTexte + " €";
                
                // Préparation du champ caché
                document.getElementById('final-besoin').value = `CLIENT: ${immat} | VEHICULE: ${res.modele_long} ${res.motorisation} | PIECE: ${piece} | PRIX: ${prixTexte}€`;

                // ACTION PAIEMENT STRIPE
                document.getElementById('btn-paiement-direct').onclick = function() {
                    // Remplace par ton vrai lien de paiement Stripe
                    const stripeLink = "https://buy.stripe.com/votre_lien_paiement_gsd";
                    window.location.href = `${stripeLink}?client_reference_id=${immat}&amount=${prixFinal*100}`;
                };

                loadingZone.classList.add('hidden');
                contentZone.classList.remove('hidden');
            } catch (e) {
                console.error(e);
                alert("Erreur IA. Vérifiez vos crédits OpenAI.");
                resultZone.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
