<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct - Devis Pièces Auto & Agricoles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-guyane { background-color: #004d3d; }
        .text-guyane { color: #004d3d; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <header class="bg-white py-4 px-4 shadow-sm text-center">
        <div class="flex justify-center mb-2">
            <div class="w-24 h-24 bg-gray-100 rounded-lg flex items-center justify-center border border-gray-200 overflow-hidden">
                 <i class="fas fa-truck-loading text-guyane text-4xl"></i>
            </div>
        </div>
        <h1 class="text-xl font-extrabold text-guyane tracking-tight">GUYANE SOURCING DIRECT</h1>
        <p class="text-xs font-semibold text-gray-500 uppercase tracking-widest">Hexagone ➔ Guyane</p>
    </header>

    <main class="max-w-xl mx-auto p-4 pb-24">
        
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-gray-100">
            <h2 class="text-lg font-bold mb-5 text-guyane flex items-center gap-2">
                <i class="fas fa-file-invoice"></i> Demande de devis gratuit
            </h2>
            
            <form action="https://formspree.io/f/xyzkpvze" method="POST" enctype="multipart/form-data" class="space-y-4">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Nom *</label>
                        <input type="text" name="nom" required class="w-full border-gray-200 border p-3 rounded-xl bg-gray-50 focus:ring-2 focus:ring-green-800 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Prénom *</label>
                        <input type="text" name="prenom" required class="w-full border-gray-200 border p-3 rounded-xl bg-gray-50 focus:ring-2 focus:ring-green-800 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Immatriculation *</label>
                    <input type="text" name="immatriculation" placeholder="Ex: AB-123-CD" required class="w-full border-gray-200 border p-3 rounded-xl bg-gray-50 uppercase text-blue-700 font-bold placeholder:text-gray-300 focus:ring-2 focus:ring-green-800 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Téléphone (WhatsApp) *</label>
                    <input type="tel" name="telephone" placeholder="06..." required class="w-full border-gray-200 border p-3 rounded-xl bg-gray-50 focus:ring-2 focus:ring-green-800 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Email (Optionnel)</label>
                    <input type="email" name="email" placeholder="votre@email.com" class="w-full border-gray-200 border p-3 rounded-xl bg-gray-50 focus:ring-2 focus:ring-green-800 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Description de la pièce *</label>
                    <textarea name="message" rows="3" placeholder="Moteur, alternateur, pièce de tracteur..." required class="w-full border-gray-200 border p-3 rounded-xl bg-gray-50 focus:ring-2 focus:ring-green-800 outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Adresse de livraison (Guyane) *</label>
                    <input type="text" name="livraison" placeholder="Ville ou commune" required class="w-full border-gray-200 border p-3 rounded-xl bg-gray-50 focus:ring-2 focus:ring-green-800 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-gray-500 mb-1">Photo de la pièce (Optionnel)</label>
                    <input type="file" name="photo" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
                </div>

                <button type="submit" class="w-full bg-guyane text-white font-extrabold py-4 rounded-xl shadow-lg hover:bg-green-900 transition-all flex justify-center items-center gap-3 mt-4">
                    <i class="fas fa-paper-plane"></i> ENVOYER LA DEMANDE
                </button>
            </form>
        </div>

        <div class="grid grid-cols-2 gap-4 text-center text-[10px] uppercase font-bold tracking-wider text-gray-500">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <i class="fas fa-shield-alt text-guyane text-xl mb-2"></i><br>Paiement Sécurisé
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <i class="fas fa-ship text-guyane text-xl mb-2"></i><br>Livraison Guyane
            </div>
        </div>

    </main>

    <a href="https://wa.me/33699337803" class="fixed bottom-6 right-6 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl z-50 text-2xl hover:scale-110 active:scale-95 transition-all">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer class="text-center py-8 text-gray-400 text-[10px] uppercase tracking-widest">
        © 2026 Guyane Sourcing Direct
    </footer>

</body>
</html>
