<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Automatisation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans">

    <header class="bg-white shadow-sm p-6 text-center border-b-4 border-blue-600">
        <h1 class="text-xl font-black text-blue-900 uppercase italic">Guyane Sourcing Direct</h1>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Suivi & Règlement en ligne</p>
    </header>

    <div class="max-w-xl mx-auto p-4 space-y-6">
        
        <section class="bg-white rounded-3xl shadow-xl p-6 border-t-8 border-orange-500">
            <h2 class="text-xl font-black text-slate-800 uppercase mb-4 text-center">Accéder à mon dossier</h2>
            <div class="flex space-x-2">
                <input type="text" id="numDevis" placeholder="N° DE DEVIS (ex: 2026002)" class="flex-1 p-4 border-2 border-slate-200 rounded-xl font-black text-blue-800 uppercase outline-none focus:border-orange-500">
                <button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-xl shadow-md hover:bg-orange-600">
                    <i class="fas fa-search text-2xl"></i>
                </button>
            </div>
            
            <div id="resultat" class="hidden mt-6 space-y-4">
                <div class="p-6 rounded-2xl bg-slate-50 border-2 border-dashed border-slate-200 text-center">
                    <p id="nomClient" class="text-xl font-black text-slate-800 uppercase mb-2"></p>
                    <div id="statut" class="inline-block px-6 py-2 rounded-full text-white font-black text-xs uppercase tracking-widest"></div>
                </div>

                <div id="zonePaiement" class="hidden">
                    <a id="lienStripe" href="#" target="_blank" class="block w-full bg-emerald-600 text-white py-5 rounded-2xl font-black text-xl uppercase text-center shadow-lg hover:bg-emerald-700 transition transform hover:scale-[1.02]">
                        <i class="fas fa-credit-card mr-2"></i> Payer mon devis
                    </a>
                    <p class="text-center text-[10px] text-slate-400 mt-2 uppercase font-bold">Paiement sécurisé par Stripe &copy;</p>
                </div>
            </div>
        </section>

    </div>

    <script>
        // TON URL DE TABLEAU EXCEL (CSV)
        const urlCSV = "https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/export?format=csv";

        async function chercherDossier() {
            const idRecherche = document.getElementById('numDevis').value.trim();
            const res = document.getElementById('resultat');
            const zonePay = document.getElementById('zonePaiement');
            const btnStripe = document.getElementById('lienStripe');
            
            if(!idRecherche) return;

            try {
                const response = await fetch(urlCSV);
                const data = await response.text();
                const lignes = data.split('\n').map(l => l.split(','));
                
                // On crée une liste des dossiers à partir de ton Excel
                const dossiers = {};
                for (let i = 1; i < lignes.length; i++) {
                    const [id, client, statut, lien] = lignes[i];
                    if(id) {
                        dossiers[id.replace(/"/g, '').trim()] = { 
                            nom: client ? client.replace(/"/g, '') : "Client", 
                            statut: statut ? statut.replace(/"/g, '') : "En cours",
                            stripe: lien ? lien.replace(/"/g, '').trim() : ""
                        };
                    }
                }

                const d = dossiers[idRecherche];
                if (d) {
                    res.classList.remove('hidden');
                    document.getElementById('nomClient').innerText = d.nom;
                    const s = document.getElementById('statut');
                    s.innerText = d.statut;
                    s.style.backgroundColor = d.statut.toLowerCase().includes('payé') ? '#10b981' : '#f59e0b';
                    
                    // AUTOMATISATION DU BOUTON
                    if(d.stripe && d.stripe.includes('http')) {
                        zonePay.classList.remove('hidden');
                        btnStripe.href = d.stripe;
                    } else {
                        zonePay.classList.add('hidden');
                    }
                } else {
                    alert("Numéro de devis non trouvé.");
                }
            } catch (e) {
                alert("Erreur de connexion au tableau.");
            }
        }
    </script>
</body>
</html>
