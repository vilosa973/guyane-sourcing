<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section { backdrop-filter: blur(15px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); }
        #scanner-container { position: relative; width: 100%; max-width: 320px; margin: 0 auto; aspect-ratio: 3/4; background: #000; border-radius: 24px; overflow: hidden; border: 3px solid #1d4ed8; }
        .tab-btn.active { background-color: #1d4ed8; color: white; box-shadow: 0 4px 15px rgba(29, 78, 216, 0.4); }
        input, select, textarea { background-color: rgba(255, 255, 255, 0.7) !important; font-weight: 800; border: 1px solid rgba(0,0,0,0.15) !important; color: #000 !important; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">
    <div class="content-overlay p-4 max-w-2xl mx-auto space-y-6">
        <header class="bg-white/95 p-4 border-b-4 border-green-600 shadow-lg sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo GSD" class="h-16 mx-auto">
        </header>

        <section class="rounded-3xl p-4 shadow-xl border-2 border-slate-700 bg-black/20">
            <video id="videoPlayer" controls class="w-full aspect-video rounded-2xl bg-black"><source src="explication.mp4" type="video/mp4"></video>
        </section>

        <section class="rounded-3xl p-5 shadow-xl border-2 border-green-600">
            <input type="text" id="suivi-id" placeholder="NUMÉRO DE DEVIS" class="w-full p-3 mb-2 rounded-xl text-xs uppercase text-center">
            <input type="text" id="suivi-nom" placeholder="NOM DE FAMILLE" class="w-full p-3 mb-2 rounded-xl text-xs uppercase text-center">
            <button onclick="consulterLeSuiviRelance()" class="w-full bg-green-600 text-white py-3 rounded-xl font-black text-xs uppercase">Suivre</button>
        </section>

        <section class="rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-600">
            <div class="flex bg-white/40 border-b border-blue-200">
                <button onclick="switchTab('scan')" id="tab-scan" class="tab-btn active flex-1 py-4 font-black uppercase text-[10px]">📷 Scanner</button>
                <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-[10px]">✍️ Manuelle</button>
                <button onclick="switchTab('hors-cat')" id="tab-hors-cat" class="tab-btn flex-1 py-4 font-black uppercase text-[10px]">📧 Hors Cat.</button>
            </div>
            
            <div class="p-6">
                <div id="form-scan" class="space-y-4">
                    <div id="scanner-container"><video id="camera-feed" autoplay playsinline muted></video></div>
                    <select id="s-domaine" class="w-full p-4 rounded-xl text-sm font-bold bg-white"><option value="">-- DOMAINE --</option><option value="voiture">🚗 AUTO</option><option value="agri">🚜 AGRI</option></select>
                    <select id="s-famille" class="w-full p-4 rounded-xl text-sm font-bold bg-white"><option>-- FAMILLE --</option></select>
                    <select id="s-piece" class="w-full p-4 rounded-xl text-sm font-black bg-white"><option>-- PIÈCE --</option></select>
                    <button onclick="lancerRecherche('scan')" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-black uppercase">RECHERCHER ET AJOUTER</button>
                </div>

                <div id="form-modele" class="hidden space-y-3">
                    <input type="text" id="m-marque" placeholder="MARQUE" class="w-full p-4 rounded-xl">
                    <input type="text" id="m-modele" placeholder="MODÈLE" class="w-full p-4 rounded-xl">
                    <select id="m-carburant" class="w-full p-4 rounded-xl"><option value="essence">ESSENCE</option><option value="diesel">DIESEL</option></select>
                    <input type="number" id="m-annee" placeholder="ANNÉE" class="w-full p-4 rounded-xl">
                    <input type="number" id="m-cv" placeholder="PUISSANCE FISCALE" class="w-full p-4 rounded-xl">
                    <input type="number" id="m-cylindree" placeholder="CYLINDRÉE" class="w-full p-4 rounded-xl">
                    <button onclick="lancerRecherche('manuelle')" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase">RECHERCHER</button>
                </div>

                <div id="form-hors-cat" class="hidden flex flex-col gap-3">
                    <select id="f-civilite" class="p-3 rounded-xl"><option value="Mr">Monsieur</option><option value="Mme">Madame</option></select>
                    <input type="text" id="f-nom" placeholder="NOM" class="p-3 rounded-xl">
                    <select id="f-type" class="p-3 rounded-xl"><option value="prix">Demande de prix</option><option value="renseignement">Renseignement</option></select>
                    <textarea id="f-desc" placeholder="DESCRIPTION" class="p-3 rounded-xl h-20"></textarea>
                    <button onclick="envoyerDemandeEmail()" class="w-full bg-blue-600 text-white py-4 rounded-xl">ENVOYER</button>
                </div>
            </div>
        </section>
    </div>

    <div id="zone-panier" class="hidden fixed bottom-0 w-full bg-emerald-700 p-4 text-white font-black text-center">
        <button onclick="finaliserCommande()">VALIDER MON DEVIS ET COMMANDER</button>
    </div>

    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwt8JcKCe7NP1tdbeQToisn6YA-U7z33etQtd8ZFBeoaqMxD81N-AHIo7nLfiqGwr4G/exec";
        let panier = [];

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            ['scan', 'modele', 'hors-cat'].forEach(t => document.getElementById('form-' + t).classList.add('hidden'));
            document.getElementById('form-' + tab).classList.remove('hidden');
        }

        async function lancerRecherche(type) {
            alert("Recherche lancée via Jarvis... Analyse en cours.");
            document.getElementById('zone-panier').classList.remove('hidden');
        }

        async function finaliserCommande() {
            const data = { action: "creer_devis", nom: "Client", pieces: JSON.stringify(panier) };
            const res = await fetch(URL_WEB_APP, { method: "POST", body: new URLSearchParams(data) });
            const json = await res.json();
            alert("Devis généré avec succès ! ID : " + json.devis_id);
        }

        navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}})
            .then(s => document.getElementById('camera-feed').srcObject = s)
            .catch(e => console.log("Caméra désactivée"));
    </script>
</body>
</html>
