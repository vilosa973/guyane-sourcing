<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-image: url('Font_Premium.jpg');
            background-size: cover; background-position: center; background-attachment: fixed;
            background-repeat: no-repeat; background-color: #1a1a1a;
        }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.4) !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        section:hover {
            transform: translateY(-3px);
            background-color: rgba(255, 255, 255, 0.5) !important;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.3);
        }
        input, textarea, select {
            background-color: rgba(255, 255, 255, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #000 !important; font-weight: 700;
        }
        .tab-btn.active { background-color: #1d4ed8; color: white; border-bottom: 4px solid #1e40af; }
        .card-choice { transition: all 0.2s; border: 2px solid transparent; }
        .card-choice:hover { border-color: #1d4ed8; transform: scale(1.02); }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center text-center text-center text-center">

    <div class="content-overlay flex flex-col text-center">
        
        <header class="bg-white/95 p-4 text-center border-b-4 border-green-600 shadow-md sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo Guyane Sourcing Direct" class="h-16 mx-auto">
            <p class="text-green-700 text-[10px] font-black uppercase mt-1 tracking-widest text-center text-center">Sourcing • Logistique • Agricole • Auto</p>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full mt-6 text-center">

            <section class="rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-600 text-center">
                <div class="flex bg-white/50 border-b border-blue-200">
                    <button onclick="switchTab('plaque')" id="tab-plaque" class="tab-btn active flex-1 py-4 font-black uppercase text-xs tracking-widest">Auto (Plaque)</button>
                    <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-xs tracking-widest text-slate-600">Modèle / Agricole</button>
                </div>

                <div class="p-6 space-y-4">
                    <div id="form-plaque" class="space-y-4 text-center"><input type="text" id="ai-immat" placeholder="AB-123-CD" class="w-full p-4 rounded-2xl uppercase text-center outline-none"></div>

                    <div id="form-modele" class="hidden space-y-2 text-center">
                        <div class="grid grid-cols-2 gap-2"><input type="text" id="m-marque" placeholder="MARQUE" class="p-3 rounded-xl text-sm uppercase text-center"><input type="text" id="m-modele" placeholder="MODÈLE" class="p-3 rounded-xl text-sm uppercase text-center"></div>
                        <div class="grid grid-cols-2 gap-2"><select id="m-energie" class="p-3 rounded-xl text-sm text-center outline-none"><option value="" disabled selected>ÉNERGIE</option><option value="Essence">Essence</option><option value="Diesel">Diesel</option><option value="Electrique">Électrique</option><option value="Hybride">Hybride</option></select><input type="text" id="m-litrage" placeholder="LITRAGE (EX: 1.6L)" class="p-3 rounded-xl text-sm text-center"></div>
                        <div class="grid grid-cols-2 gap-2"><input type="text" id="m-annee" placeholder="ANNÉE" class="p-3 rounded-xl text-xs text-center"><input type="text" id="m-fiscale" placeholder="PUISSANCE (CV)" class="p-3 rounded-xl text-xs text-center"></div>
                    </div>

                    <input type="text" id="ai-piece" placeholder="PIÈCE RECHERCHÉE..." class="w-full p-4 rounded-2xl outline-none border-2 border-blue-500 shadow-inner">

                    <button onclick="rechercheIA()" id="btn-ia" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase shadow-lg flex items-center justify-center gap-3">
                        <i class="fas fa-search text-center"></i> RECHERCHE
                    </button>

                    <div id="ai-resultat" class="hidden mt-4 space-y-4">
                        <div id="ai-loading" class="py-8 bg-white/80 rounded-2xl text-center"><i class="fas fa-sync fa-spin text-blue-700 text-3xl"></i><p class="font-bold mt-2 uppercase text-[10px] tracking-widest text-center text-center">Identification technique...</p></div>
                        <div id="ai-content" class="hidden space-y-4 text-left">
                            <div class="bg-white p-4 rounded-2xl flex items-center gap-4 shadow-md border-l-8 border-blue-700 text-slate-900 font-bold">
                                <img id="ai-vehicule-img" class="w-20 h-20 object-contain rounded-lg bg-slate-50 border" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3039/3039427.png'">
                                <div><p id="ai-modele-long" class="font-black uppercase text-sm leading-tight text-center"></p><p id="ai-moteur-details" class="text-[10px] font-bold text-blue-700 italic text-center"></p><p id="ai-fiscale-display" class="text-[9px] font-black bg-slate-100 px-2 py-0.5 rounded-full inline-block mt-1 uppercase text-slate-500 text-center"></p></div>
                            </div>
                            <div id="offres-container" class="grid grid-cols-1 gap-3"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 text-center text-center">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center justify-center"><i class="fas fa-file-invoice-dollar mr-3 text-blue-700"></i> Devis Manuel</h2>
                <form action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4 text-center"><select name="civilite" required class="w-full p-4 rounded-2xl outline-none"><option value="" disabled selected>VOTRE CIVILITÉ</option><option value="Monsieur">Monsieur</option><option value="Madame">Madame</option><option value="Autre">Autre / Entreprise</option></select><div class="grid grid-cols-2 gap-2 text-center"><input type="text" name="nom" placeholder="NOM" required class="p-4 rounded-2xl outline-none uppercase text-center"><input type="text" name="prenom" placeholder="PRÉNOM" required class="p-4 rounded-2xl outline-none text-center"></div><input type="text" name="plaque" placeholder="PLAQUE D'IMMATRICULATION" class="w-full p-4 rounded-2xl outline-none uppercase text-center"><div class="grid grid-cols-2 gap-2 text-center"><input type="text" name="marque" placeholder="MARQUE VÉHICULE" required class="p-4 rounded-2xl outline-none uppercase text-center"><input type="text" name="modele" placeholder="MODÈLE EXACT" required class="p-4 rounded-2xl outline-none uppercase text-center"></div><input type="email" name="email" placeholder="VOTRE ADRESSE EMAIL" required class="w-full p-4 rounded-2xl outline-none text-center"><textarea name="description" placeholder="DÉCRIVEZ VOTRE BESOIN..." rows="4" required class="w-full p-4 rounded-2xl outline-none"></textarea><button type="submit" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black uppercase shadow-lg hover:bg-blue-800 transition-all text-center">Envoyer ma demande de devis</button></form>
            </section>
        </div>
    </div>

    <script>
        let currentTab = 'plaque';
        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-plaque').classList.toggle('active', tab === 'plaque');
            document.getElementById('tab-modele').classList.toggle('active', tab === 'modele');
            document.getElementById('form-plaque').classList.toggle('hidden', tab !== 'plaque');
            document.getElementById('form-modele').classList.toggle('hidden', tab !== 'modele');
        }

        function copierTexte(btn, texte) {
            navigator.clipboard.writeText(texte).then(() => {
                const iconeOriginale = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check text-green-500"></i>';
                setTimeout(() => { btn.innerHTML = iconeOriginale; }, 1500);
            });
        }

        const OPENAI_API_KEY = "sk-proj-fqujJmA0bqzAHOgU-GuxlZxDMVmUYyJXGqtUB0b4mLIiUsOiHOmWswLdWoV" + "aUkYkRfqi3ehEM3T3BlbkFJnlfBbAyJ_uxv0l58PwIrksEoFvxqx-TJ4eYzWgtx7m6AQCGP3qRIc0EzAduLZVTcyj-Bb1lkYA";

        async function rechercheIA() {
            const piece = document.getElementById('ai-piece').value;
            let context = currentTab === 'plaque' ? `Plaque: ${document.getElementById('ai-immat').value}` : `Véhicule: ${document.getElementById('m-marque').value} ${document.getElementById('m-modele').value}, Énergie: ${document.getElementById('m-energie').value}, Litrage: ${document.getElementById('m-litrage').value}, Année: ${document.getElementById('m-annee').value}`;
            
            if(!piece || !context) return alert("Infos manquantes !");
            
            document.getElementById('ai-resultat').classList.remove('hidden');
            document.getElementById('ai-loading').classList.remove('hidden');
            document.getElementById('ai-content').classList.add('hidden');

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${OPENAI_API_KEY}` },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{ 
                            role: "system", 
                            content: "Expert Sourcing Europe. Sourcer 3 offres RÉELLES. POUR L'IMAGE : Utilise UNIQUEMENT des URLs directes de photos produits (pas de liens Google Photos). AJOUTE une 'description_courte' technique (ex: 12V, 90A, 5 dents). JSON format: {'machine':{'nom':'','infos':'','img':'','cv_fiscaux':''}, 'offres':[{'vendeur':'','vendeur_logo':'','nom_piece':'','fabricant':'','ref_fab':'','prix_ht':0,'img_piece':'','description_courte':'','garantie':''}]}" 
                        }, { role: "user", content: `Sourcer ${piece} pour ${context}` }],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                const res = JSON.parse(data.choices[0].message.content);
                const buildProxyUrl = (url) => `https://wsrv.nl/?url=${encodeURIComponent(url)}&n=-1&output=webp`;

                document.getElementById('ai-vehicule-img').src = buildProxyUrl(res.machine.img);
                document.getElementById('ai-modele-long').innerText = res.machine.nom;
                document.getElementById('ai-moteur-details').innerText = res.machine.infos;
                document.getElementById('ai-fiscale-display').innerText = (res.machine.cv_fiscaux || "N/A") + " CV FISCAUX";

                let html = "";
                res.offres.forEach(o => {
                    const prixFinal = (parseFloat(o.prix_ht) * 1.20) + 45;
                    html += `
                        <div class="card-choice bg-white rounded-2xl p-4 shadow-lg flex flex-col gap-3 text-left">
                            <div class="flex justify-between items-center border-b pb-2">
                                <div class="flex items-center gap-2"><img src="${buildProxyUrl(o.vendeur_logo)}" class="w-5 h-5 object-contain rounded border bg-white" onerror="this.src='Logo.jpg'"><span class="text-[9px] font-black uppercase text-slate-500">Vendu par : <b class="text-slate-900">${o.vendeur}</b></span></div>
                                <span class="text-[9px] font-black text-blue-700 italic uppercase">Garantie ${o.garantie || '12m'}</span>
                            </div>
                            <div class="flex items-start gap-4">
                                <img src="${buildProxyUrl(o.img_piece)}" class="w-24 h-24 object-contain rounded-lg bg-slate-50 border" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3039/3039427.png'">
                                <div class="flex-1 text-left">
                                    <p class="text-[11px] font-black uppercase text-slate-800 leading-tight">${o.nom_piece}</p>
                                    <p class="text-[10px] font-bold text-blue-600 uppercase mt-0.5">${o.fabricant}</p>
                                    <p class="text-[9px] text-slate-500 font-medium italic mt-1 leading-tight">${o.description_courte || 'Détails techniques standards'}</p>
                                    <div class="mt-2 p-2 bg-slate-50 rounded border border-slate-100 flex items-center justify-between gap-2">
                                        <div class="text-left"><p class="text-[7px] text-slate-400 font-bold uppercase">Numéro article :</p><p class="text-[8px] text-slate-700 font-black uppercase">${o.ref_fab}</p></div>
                                        <button onclick="copierTexte(this, '${o.ref_fab}')" class="text-slate-400 hover:text-blue-700 transition-colors"><i class="far fa-copy text-xs"></i></button>
                                    </div>
                                </div>
                                <div class="text-right min-w-[90px]"><p class="text-xl font-black text-slate-900">${prixFinal.toFixed(2)}€</p><button onclick="window.location.href='https://wa.me/33699337803?text=Commande ${o.vendeur}: ${o.nom_piece} (${o.ref_fab})'" class="mt-2 bg-slate-900 text-white text-[8px] px-3 py-1.5 rounded-lg font-black uppercase w-full">Commander</button></div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById('offres-container').innerHTML = html;
                document.getElementById('ai-loading').classList.add('hidden');
                document.getElementById('ai-content').classList.remove('hidden');
            } catch (e) {
                alert("Erreur de sourcing. Soyez plus précis !");
            }
        }
    </script>
</body>
</html>
