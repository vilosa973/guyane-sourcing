<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
        input, textarea, select { background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.4) !important; color: #000 !important; font-weight: 800; }
        .tab-btn.active { background-color: #1d4ed8; color: white; border-bottom: 4px solid #1e40af; }
        .grid-manual { display: flex; flex-direction: column; gap: 12px; }
        .manual-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">

    <div class="content-overlay flex flex-col">
        <header class="bg-white/95 p-4 border-b-4 border-green-600 shadow-md sticky top-0 z-50 text-center">
            <img src="Logo.jpg" alt="Logo GSD" class="h-16 mx-auto">
            <p class="text-green-700 text-[10px] font-black uppercase mt-1 tracking-widest text-center">Sourcing • Logistique • Agricole • Auto</p>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full mt-6">

            <section class="rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-600">
                <div class="flex bg-white/50 border-b border-blue-200">
                    <button onclick="switchTab('photo')" id="tab-photo" class="tab-btn active flex-1 py-4 font-black uppercase text-xs text-center">📷 Photo Carte Grise</button>
                    <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-xs text-center">✍️ Saisie Manuelle</button>
                </div>
                
                <div class="p-6 space-y-6">
                    <div id="form-photo" class="space-y-4">
                        <label class="w-full flex flex-col items-center justify-center p-8 border-2 border-dashed border-blue-500 rounded-2xl bg-white/50 cursor-pointer">
                            <i class="fas fa-camera text-4xl text-blue-600 mb-2"></i>
                            <span class="text-sm font-black uppercase">Scanner ma Carte Grise</span>
                            <input type="file" accept="image/*" id="input-cg" class="hidden" onchange="previewCG(this)">
                        </label>
                        <div id="cg-status" class="hidden text-xs font-bold text-green-700 uppercase">Image chargée avec succès</div>
                    </div>
                    
                    <div id="form-modele" class="hidden grid-manual">
                        <div class="manual-row">
                            <input type="text" id="m-marque" placeholder="MARQUE" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                            <input type="text" id="m-modele" placeholder="MODÈLE" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                        </div>
                        <div class="manual-row">
                            <input type="text" id="m-moteur" placeholder="MOTORISATION" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                            <input type="number" id="m-annee" placeholder="ANNÉE" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                        </div>
                    </div>

                    <div class="space-y-4 border-t border-blue-100 pt-4">
                        <input type="text" id="ai-piece" placeholder="QUELLE PIÈCE RECHERCHEZ-VOUS ?" class="w-full p-5 rounded-2xl outline-none border-2 border-blue-500 shadow-inner text-center font-black">
                        <button onclick="rechercheIA()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black uppercase shadow-lg flex items-center justify-center gap-3">
                            <i class="fas fa-microchip"></i> ANALYSER & TROUVER
                        </button>
                    </div>

                    <div id="ai-resultat" class="hidden mt-4">
                        <div id="ai-loading" class="py-8 bg-white/80 rounded-2xl text-center"><i class="fas fa-sync fa-spin text-blue-700 text-3xl"></i></div>
                        <div id="ai-content" class="hidden space-y-4 text-left"><div id="offres-container"></div></div>
                    </div>
                </div>
            </section>

            <section class="rounded-3xl shadow-2xl p-4 border-l-8 border-emerald-500 overflow-hidden">
                <div class="rounded-2xl overflow-hidden shadow-inner bg-black aspect-video">
                    <video controls class="w-full h-full object-cover"><source src="explication.mp4" type="video/mp4"></video>
                </div>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 text-center">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4"><i class="fas fa-file-invoice-dollar mr-3 text-blue-700"></i> Demande de Devis</h2>
                <form action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4">
                    <select name="civilite" required class="w-full p-4 rounded-2xl outline-none text-center">
                        <option value="Monsieur">Monsieur</option>
                        <option value="Madame">Madame</option>
                    </select>
                    <div class="manual-row">
                        <input type="text" name="nom" placeholder="NOM" required class="p-4 rounded-2xl outline-none uppercase text-center">
                        <input type="text" name="prenom" placeholder="PRÉNOM" required class="p-4 rounded-2xl outline-none text-center">
                    </div>
                    <input type="text" name="plaque" placeholder="PLAQUE D'IMMATRICULATION" class="w-full p-4 rounded-2xl outline-none uppercase text-center">
                    <input type="email" name="email" placeholder="VOTRE EMAIL" required class="w-full p-4 rounded-2xl outline-none text-center">
                    <textarea name="description" placeholder="VOTRE DEMANDE..." rows="3" required class="w-full p-4 rounded-2xl outline-none text-center"></textarea>
                    <button type="submit" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black uppercase shadow-lg">Envoyer ma demande</button>
                </form>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 border-2 border-orange-500">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center justify-center"><i class="fas fa-shield-check mr-3 text-orange-500"></i> Suivre mon dossier</h2>
                <div class="space-y-3">
                    <input type="text" id="nomRecherche" placeholder="NOM DU CLIENT (MAJUSCULES)" class="w-full p-4 rounded-2xl outline-none text-center uppercase font-black">
                    <div class="flex space-x-2">
                        <input type="text" id="numDevis" placeholder="N° DE DEVIS" class="flex-1 p-4 rounded-2xl text-blue-900 font-black text-center outline-none uppercase">
                        <button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-2xl shadow-lg active:scale-95 transition"><i class="fas fa-search"></i></button>
                    </div>
                </div>
                
                <div id="resultat" class="hidden mt-6 text-center">
                    <div class="bg-slate-900/95 rounded-3xl p-6 text-white border-b-8 border-yellow-500 shadow-2xl space-y-6">
                        <div class="border-b border-slate-700 pb-3">
                            <p class="text-[10px] text-yellow-500 font-bold uppercase">Devis N° <span id="resNumDevis"></span></p>
                            <p class="text-xl font-black uppercase mt-1"><span id="resCivilite"></span> <span id="resNomClient"></span></p>
                        </div>

                        <div id="zoneValidation" class="hidden py-4 border-b border-slate-800 space-y-4">
                            <div class="bg-blue-900/40 p-4 rounded-2xl border border-blue-500/50">
                                <p class="text-sm font-black text-white uppercase leading-relaxed">✍️ Pour valider et signer votre commande :</p>
                                <p class="text-[11px] mt-1 text-slate-300 italic">Obtenez votre code de signature unique par WhatsApp.</p>
                            </div>

                            <div class="flex flex-col gap-4 max-w-sm mx-auto">
                                <div class="space-y-3">
                                    <div class="flex gap-2">
                                        <select id="prefixeTel" class="bg-slate-800 text-white p-3 rounded-xl text-xs font-bold border border-slate-600 outline-none">
                                            <option value="594" selected>🇬🇫 +594</option>
                                            <option value="33">🇫🇷 +33</option>
                                            <option value="596">🇲🇶 +596</option>
                                            <option value="590">🇬🇵 +590</option>
                                        </select>
                                        <input type="tel" id="telClient" placeholder="Numéro" class="flex-1 p-3 rounded-xl text-center text-black font-bold outline-none">
                                    </div>
                                    <button onclick="demanderCodeWhatsApp()" id="btnWA" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase flex items-center justify-center gap-3">
                                        <i class="fab fa-whatsapp text-lg"></i> Recevoir mon code
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div id="inputCodeDossier" class="hidden py-4 border-b border-slate-800 bg-white/5 rounded-2xl p-4 space-y-3">
                            <p class="text-xs text-yellow-500 font-bold uppercase">Saisissez votre code de signature :</p>
                            <input type="number" id="codeSaisi" placeholder="----" class="w-32 p-3 text-2xl tracking-[10px] rounded-xl text-center text-black font-black bg-white">
                            <button onclick="validerCodeFinal()" class="w-full bg-yellow-500 text-black py-4 rounded-xl font-black uppercase shadow-lg">Confirmer la Signature</button>
                        </div>
                        
                        <div>
                            <p class="text-[10px] opacity-50 uppercase mb-1 font-bold">Statut actuel :</p>
                            <div id="resStatut" class="inline-block px-4 py-1 rounded-full text-[10px] font-black uppercase shadow-inner"></div>
                        </div>

                        <div class="py-4 border-y border-slate-800">
                            <p id="resMontant" class="text-5xl font-black text-white"></p>
                        </div>

                        <div id="zonePaiement" class="hidden pt-2">
                            <a id="btnStripe" href="#" target="_blank" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase flex items-center justify-center gap-3 shadow-lg">
                                <i class="fas fa-credit-card"></i> Accéder au Paiement
                            </a>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        // CONFIGURATION DE TES URLS (Lien Web App injecté avec succès !)
        const URL_CSV = "https://docs.google.com/spreadsheets/d/1h7cfN7f2l1U9eSxmdIlCngIK5AXUNwxNxJ-Zz8H4y2c/export?format=csv";
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbxsKGx_q4wU46MI2z0TirB10QwdQJI6WCGyCfKtIq1ZQY8B-Jq0CH3TtWqcfDKuu6Km/exec";
        let codeGenere = null;

        function switchTab(tab) {
            document.getElementById('tab-photo').classList.toggle('active', tab === 'photo');
            document.getElementById('tab-modele').classList.toggle('active', tab === 'modele');
            document.getElementById('form-photo').classList.toggle('hidden', tab !== 'photo');
            document.getElementById('form-modele').classList.toggle('hidden', tab !== 'modele');
        }

        async function chercherDossier() {
            const nomS = document.getElementById('nomRecherche').value.trim().toUpperCase();
            const idS = document.getElementById('numDevis').value.trim().toUpperCase().replace("GSD", "").replace(/[- ]/g, "");
            try {
                const res = await fetch(URL_CSV + "&v=" + Date.now());
                const data = await res.text();
                const lignes = data.split(/\r?\n/);
                const sep = data.includes(';') ? ';' : ',';
                let tr = false;
                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(new RegExp(`${sep}(?=(?:(?:[^"]*"){2})*[^"]*$)`)).map(v => v.replace(/^"|"$/g, '').trim());
                    if (col.length < 5) continue;
                    const idTab = col[0].toUpperCase().replace("GSD", "").replace(/[- ]/g, "");
                    if(idTab === idS && (nomS === (col[2]||"").toUpperCase())) {
                        tr = true;
                        document.getElementById('resNumDevis').innerText = col[0];
                        document.getElementById('resNomClient').innerText = col[2] + " " + (col[3] || "");
                        document.getElementById('resCivilite').innerText = col[1];
                        const stat = (col[4] || "ACTIF").toUpperCase();
                        const sBox = document.getElementById('resStatut');
                        sBox.innerText = stat;
                        sBox.style.backgroundColor = (stat.includes('PAYÉ') || stat.includes('CONFIRMÉE')) ? '#059669' : '#D97706';
                        document.getElementById('zoneValidation').classList.toggle('hidden', !stat.includes('ATTENTE'));
                        document.getElementById('resMontant').innerText = col[8] || "0.00 €";
                        if(col[7] && col[7].startsWith('http')) {
                            document.getElementById('btnStripe').href = col[7];
                            document.getElementById('zonePaiement').classList.remove('hidden');
                        } else { document.getElementById('zonePaiement').classList.add('hidden'); }
                        document.getElementById('resultat').classList.remove('hidden');
                        break;
                    }
                }
                if(!tr) alert("Dossier introuvable.");
            } catch(e) { alert("Erreur réseau."); }
        }

        function genererCode() { codeGenere = Math.floor(1000 + Math.random() * 9000); return codeGenere; }

        function demanderCodeWhatsApp() {
            const c = genererCode();
            const p = document.getElementById('prefixeTel').value;
            let t = document.getElementById('telClient').value.trim().replace(/[\s.-]/g, '');
            if(t.startsWith('0')) t = t.substring(1);
            if(!t || t.length < 9) return alert("Numéro invalide.");
            
            const numClientComplet = p + t;
            const message = encodeURIComponent(`GSD | Votre code de signature unique pour le devis ${document.getElementById('resNumDevis').innerText} est : ${c}`);
            window.open(`https://wa.me/${numClientComplet}?text=${message}`, '_blank');
            document.getElementById('inputCodeDossier').classList.remove('hidden');
        }

        async function validerCodeFinal() {
            const s = document.getElementById('codeSaisi').value;
            const devisID = document.getElementById('resNumDevis').innerText;
            if (s == codeGenere) {
                try {
                    const params = new URLSearchParams();
                    params.append('id', devisID);
                    await fetch(URL_WEB_APP, { method: 'POST', mode: 'no-cors', body: params });
                    alert("Signature validée ! Votre commande est confirmée.");
                    location.reload();
                } catch(e) { alert("Erreur serveur."); }
            } else { alert("Code incorrect."); }
        }

        function previewCG(input) { if(input.files[0]) document.getElementById('cg-status').classList.remove('hidden'); }

        // Nouvelle fonction de recherche IA ultra-puissante connectée à OpenAI
        async function rechercheIA() {
            const inputCG = document.getElementById('input-cg');
            const piece = document.getElementById('ai-piece').value.trim();
            const resultBox = document.getElementById('ai-resultat');
            const loadingBox = document.getElementById('ai-loading');
            const contentBox = document.getElementById('ai-content');
            const container = document.getElementById('offres-container');

            if (!piece) return alert("Veuillez indiquer la pièce recherchée.");

            resultBox.classList.remove('hidden');
            loadingBox.classList.remove('hidden');
            contentBox.classList.add('hidden');

            const formData = new FormData();
            formData.append('piece', piece);

            // Cas 1 : Mode Photo Carte Grise
            if (document.getElementById('tab-photo').classList.contains('active')) {
                if (!inputCG.files[0]) {
                    alert("Veuillez charger une photo de votre carte grise.");
                    loadingBox.classList.add('hidden');
                    return;
                }
                
                const reader = new FileReader();
                reader.readAsDataURL(inputCG.files[0]);
                reader.onloadend = async () => {
                    const base64Data = reader.result.split(',')[1];
                    formData.append('image', base64Data);
                    formData.append('mimeType', inputCG.files[0].type);
                    await envoyerDemandeIA(formData, loadingBox, contentBox, container);
                };
            } else {
                // Cas 2 : Mode Saisie Manuelle
                formData.append('marque', document.getElementById('m-marque').value);
                formData.append('modele', document.getElementById('m-modele').value);
                formData.append('moteur', document.getElementById('m-moteur').value);
                formData.append('annee', document.getElementById('m-annee').value);
                await envoyerDemandeIA(formData, loadingBox, contentBox, container);
            }
        }

        async function envoyerDemandeIA(formData, loading, content, container) {
            try {
                const response = await fetch(URL_WEB_APP, {
                    method: 'POST',
                    body: new URLSearchParams(formData)
                });
                const json = await response.json();
                loading.classList.add('hidden');
                content.classList.remove('hidden');
                
                if (json.status === "Succès") {
                    container.innerHTML = `<div class="p-4 bg-white/90 rounded-xl border-l-4 border-green-600 text-sm font-bold text-black uppercase text-center">${json.message}</div>`;
                } else {
                    container.innerHTML = `<div class="p-4 bg-white/90 rounded-xl border-l-4 border-red-600 text-sm font-bold text-black uppercase text-center">Erreur : ${json.details || "Impossible de traiter la demande"}</div>`;
                }
            } catch (e) {
                loading.classList.add('hidden');
                content.classList.remove('hidden');
                container.innerHTML = `<div class="p-4 bg-white/90 rounded-xl border-l-4 border-red-600 text-sm font-bold text-black uppercase text-center">Erreur de connexion avec Jarvis.</div>`;
            }
        }
    </script>
</body>
</html>
