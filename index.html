<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
        input, textarea, select { background-color: rgba(255, 255, 255, 0.3) !important; border: 1px solid rgba(255, 255, 255, 0.3) !important; color: #000 !important; font-weight: 700; }
        .tab-btn.active { background-color: #1d4ed8; color: white; border-bottom: 4px solid #1e40af; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">

    <div class="content-overlay flex flex-col">
        <header class="bg-white/95 p-4 border-b-4 border-green-600 shadow-md sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo GSD" class="h-16 mx-auto">
            <p class="text-green-700 text-[10px] font-black uppercase mt-1 tracking-widest text-center">Sourcing • Logistique • Agricole • Auto</p>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full mt-6">

            <section class="rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-600">
                <div class="flex bg-white/50 border-b border-blue-200">
                    <button onclick="switchTab('photo')" id="tab-photo" class="tab-btn active flex-1 py-4 font-black uppercase text-xs tracking-widest text-center">📷 Analyse Carte Grise</button>
                    <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-xs tracking-widest text-slate-600 text-center text-center">✍️ Saisie Manuelle</button>
                </div>

                <div class="p-6 space-y-4 text-center">
                    <div id="form-photo" class="space-y-4">
                        <label class="w-full flex flex-col items-center justify-center p-6 border-2 border-dashed border-blue-500 rounded-2xl bg-white/50 cursor-pointer hover:bg-white/80">
                            <i class="fas fa-id-card text-3xl text-blue-600 mb-2"></i>
                            <span class="text-xs font-bold uppercase">Scanner ma Carte Grise</span>
                            <input type="file" accept="image/*" id="input-cg" class="hidden" onchange="previewCG(this)">
                        </label>
                        <div id="cg-status" class="hidden text-[10px] text-green-700 font-bold uppercase text-center">✓ Document prêt pour analyse</div>
                    </div>

                    <div id="form-modele" class="hidden space-y-2">
                        <div class="grid-inputs">
                            <input type="text" id="m-marque" placeholder="MARQUE" class="p-3 rounded-xl text-sm uppercase text-center">
                            <input type="text" id="m-modele" placeholder="MODÈLE" class="p-3 rounded-xl text-sm uppercase text-center">
                        </div>
                        <div class="grid-inputs">
                            <input type="number" id="m-annee" placeholder="ANNÉE" class="p-3 rounded-xl text-sm text-center">
                            <input type="text" id="m-puissance" placeholder="PUISSANCE (kW/CH)" class="p-3 rounded-xl text-sm text-center">
                        </div>
                    </div>

                    <input type="text" id="ai-piece" placeholder="QUELLE PIÈCE RECHERCHEZ-VOUS ?" class="w-full p-4 rounded-2xl outline-none border-2 border-blue-500 shadow-inner text-center font-bold">

                    <button onclick="rechercheIA()" id="btn-ia" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase shadow-lg flex items-center justify-center gap-3">
                        <i class="fas fa-microchip"></i> VÉRIFIER LA DISPONIBILITÉ
                    </button>

                    <div id="ai-resultat" class="hidden mt-4 space-y-4">
                        <div id="ai-loading" class="py-8 bg-white/80 rounded-2xl text-center"><i class="fas fa-sync fa-spin text-blue-700 text-3xl"></i><p class="font-bold mt-2 uppercase text-[10px]">Recherche en cours...</p></div>
                        <div id="ai-content" class="hidden space-y-4">
                            <div class="bg-white p-4 rounded-2xl flex items-center gap-4 shadow-md border-l-8 border-blue-700 text-left">
                                <img id="ai-vehicule-img" class="w-24 h-24 object-contain rounded-lg bg-slate-50 border" src="Logo.jpg">
                                <div class="flex-1 text-left">
                                    <p id="ai-modele-long" class="font-black uppercase text-base leading-tight text-slate-900"></p>
                                    <p id="ai-moteur-details" class="text-[11px] font-bold text-blue-600 mt-1 italic"></p>
                                </div>
                            </div>
                            <div id="offres-container" class="grid grid-cols-1 gap-3"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 border-2 border-orange-500 text-center">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center justify-center text-center">
                    <i class="fas fa-shield-check mr-3 text-orange-500"></i> Suivre mon dossier
                </h2>
                <div class="space-y-3">
                    <input type="text" id="nomRecherche" placeholder="VOTRE NOM (MAJUSCULES)" class="w-full p-4 rounded-2xl outline-none text-center">
                    <div class="flex space-x-2">
                        <input type="text" id="numDevis" placeholder="N° DE DEVIS" class="flex-1 p-4 rounded-2xl text-blue-900 font-black text-center outline-none">
                        <button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-2xl shadow-lg">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <div id="resultat" class="hidden mt-6 text-center">
                    <div class="bg-slate-900/95 rounded-3xl p-6 text-white border-b-8 border-yellow-500 shadow-2xl">
                        <p id="nomClientDisplay" class="text-xl font-black uppercase text-yellow-500 mb-2"></p>
                        <div class="my-4 py-4 border-y border-slate-800 text-center">
                            <p id="montantDisplay" class="text-5xl font-black text-white"></p>
                        </div>
                        <div id="statutDisplay" class="inline-block px-6 py-2 rounded-full text-white font-black text-[10px] uppercase shadow-inner"></div>
                    </div>
                    <div id="zonePaiement" class="hidden mt-6 space-y-4">
                        <a id="btnStripe" href="#" target="_blank" class="hidden w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase flex items-center justify-center gap-3 text-center"><i class="fas fa-credit-card"></i> Payer par Carte</a>
                        <a id="btnPaypal" href="#" target="_blank" class="hidden w-full bg-[#0070ba] text-white py-5 rounded-2xl font-black uppercase flex items-center justify-center gap-3 text-center"><i class="fab fa-paypal"></i> PayPal / 4X</a>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const OPENAI_API_KEY = "sk-proj-fqujJmA0bqzAHOgU-GuxlZxDMVmUYyJXGqtUB0b4mLIiUsOiHOmWswLdWoV" + "aUkYkRfqi3ehEM3T3BlbkFJnlfBbAyJ_uxv0l58PwIrksEoFvxqx-TJ4eYzWgtx7m6AQCGP3qRIc0EzAduLZVTcyj-Bb1lkYA";
        const URL_CSV = "https://docs.google.com/spreadsheets/d/1h7cfN7f2l1U9eSxmdIlCngIK5AXUNwxNxJ-Zz8H4y2c/export?format=csv";

        function switchTab(tab) {
            document.getElementById('tab-photo').classList.toggle('active', tab === 'photo');
            document.getElementById('tab-modele').classList.toggle('active', tab === 'modele');
            document.getElementById('form-photo').classList.toggle('hidden', tab !== 'photo');
            document.getElementById('form-modele').classList.toggle('hidden', tab !== 'modele');
        }

        function previewCG(input) { if(input.files[0]) document.getElementById('cg-status').classList.remove('hidden'); }

        async function rechercheIA() {
            // ... (Garder ta fonction de recherche IA actuelle ici)
        }

        // FONCTION DE SUIVI CLIENT MISE À JOUR
        async function chercherDossier() {
            const nomSaisi = document.getElementById('nomRecherche').value.trim().toUpperCase();
            const idSaisi = document.getElementById('numDevis').value.trim().toUpperCase();
            
            if(!nomSaisi || !idSaisi) return alert("Nom et N° de Devis requis.");
            
            try {
                const res = await fetch(URL_CSV + "?v=" + Date.now());
                const data = await res.text();
                const lignes = data.split('\n');
                const sep = data.includes(';') ? ';' : ',';
                
                let trouve = false;
                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(sep).map(v => v.replace(/"/g, '').trim());
                    
                    // Vérification : ID Devis en Col A (0) et NOM en Col C (2)
                    if(col[0] === idSaisi && col[2].toUpperCase() === nomSaisi) {
                        trouve = true;
                        document.getElementById('resultat').classList.remove('hidden');
                        document.getElementById('nomClientDisplay').innerText = col[1] + " " + col[2];
                        document.getElementById('montantDisplay').innerText = col[8]; // Montant Total en Col I (8)
                        
                        const s = document.getElementById('statutDisplay');
                        const statut = col[4].toUpperCase(); // Statut en Col E (4)
                        s.innerText = statut;
                        s.style.backgroundColor = (statut.includes('PAYÉ') || statut.includes('OK')) ? '#00843D' : '#D97706';
                        
                        // Boutons de paiement
                        const stripeL = col[7]; // Lien Stripe en Col H (7)
                        if(stripeL.startsWith('http')) { 
                            document.getElementById('btnStripe').href = stripeL; 
                            document.getElementById('btnStripe').classList.remove('hidden'); 
                            document.getElementById('zonePaiement').classList.remove('hidden');
                        }
                        
                        break;
                    }
                }
                if (!trouve) alert("Dossier introuvable. Vérifiez l'orthographe du NOM et le numéro de Devis.");
            } catch (e) { alert("Erreur de connexion aux archives."); }
        }

        const toBase64 = file => new Promise((res, rej) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => res(reader.result);
            reader.onerror = e => rej(e);
        });
    </script>
</body>
</html>
