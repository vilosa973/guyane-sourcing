<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-attachment: fixed; background-color: #1a1a1a; }
        .tab-btn.active { background-color: #1d4ed8; color: white; }
        select, button { background-color: rgba(255, 255, 255, 0.9) !important; font-weight: 900 !important; }
        #scanner-container { background: #000; border-radius: 24px; overflow: hidden; border: 3px solid #1d4ed8; aspect-ratio: 3/4; }
    </style>
</head>
<body class="font-sans text-center p-4">
    <div class="max-w-2xl mx-auto space-y-6">
        <div class="flex bg-white/40 rounded-t-2xl overflow-hidden border-2 border-blue-600">
            <button onclick="switchTab('scan')" id="tab-scan" class="tab-btn active flex-1 py-4 font-black uppercase text-[10px]">📷 Scanner</button>
            <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-[10px]">✍️ Manuelle</button>
        </div>
        
        <div id="form-scan" class="bg-white/80 p-6 rounded-b-3xl shadow-2xl space-y-4">
            <div id="scanner-container"><video id="camera-feed" autoplay playsinline muted></video></div>
            
            <select id="s-domaine" onchange="majFamilles()" class="w-full p-4 rounded-xl text-sm"><option value="">-- 1. CHOISIR DOMAINE --</option></select>
            <select id="s-famille" onchange="majPieces()" disabled class="w-full p-4 rounded-xl text-sm"><option value="">-- 2. CHOISIR FAMILLE --</option></select>
            <select id="s-piece" disabled class="w-full p-4 rounded-xl text-sm font-black"><option value="">-- 3. CHOISIR LA PIÈCE --</option></select>
            
            <button onclick="ajouterPanier()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase">AJOUTER AU PANIER</button>
        </div>

        <div id="zone-panier" class="hidden p-6 bg-emerald-100 rounded-3xl text-left border-2 border-emerald-500">
            <h3 class="font-black uppercase mb-2">🛒 PANIER</h3>
            <ul id="liste-panier" class="text-sm font-bold"></ul>
            <button onclick="validerDevis()" class="w-full mt-4 bg-emerald-600 text-white py-3 rounded-xl font-black uppercase">VALIDER MON DEVIS</button>
        </div>
    </div>

    <script>
        // STRUCTURE DES 3000 PIÈCES (Exemple de structure)
        const dbPieces = {
            "chassis": {
                "suspension": ["Amortisseur Avant", "Amortisseur Arrière", "Ressort court", "Coupelle"],
                "direction": ["Crémaillère", "Rotule de direction", "Biellette"]
            },
            "freinage": {
                "disques": ["Disque ventilé", "Disque plein", "Disque sport"],
                "plaquettes": ["Jeu avant", "Jeu arrière"]
            }
        };

        // INITIALISATION SCANNER
        async function startScanner() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                document.getElementById('camera-feed').srcObject = stream;
            } catch (err) { console.error("Erreur caméra", err); }
        }
        startScanner();

        // LOGIQUE DES MENUS
        function majFamilles() {
            const dom = document.getElementById("s-domaine").value;
            const fam = document.getElementById("s-famille");
            fam.innerHTML = '<option value="">-- 2. FAMILLE --</option>';
            if(dbPieces[dom]) {
                fam.disabled = false;
                for(let f in dbPieces[dom]) fam.innerHTML += `<option value="${dom}|${f}">${f.toUpperCase()}</option>`;
            }
        }

        function majPieces() {
            const val = document.getElementById("s-famille").value;
            const piece = document.getElementById("s-piece");
            piece.innerHTML = '<option value="">-- 3. PIÈCE --</option>';
            if(val) {
                piece.disabled = false;
                const [d, f] = val.split('|');
                dbPieces[d][f].forEach(p => piece.innerHTML += `<option value="${p}">${p}</option>`);
            }
        }

        function ajouterPanier() {
            const p = document.getElementById('s-piece').value;
            if(!p) return alert("Sélectionnez une pièce");
            panier.push(p);
            document.getElementById('zone-panier').classList.remove('hidden');
            document.getElementById('liste-panier').innerHTML += `<li>✅ ${p}</li>`;
        }
    </script>
</body>
</html>
