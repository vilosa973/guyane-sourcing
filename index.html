<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section { backdrop-filter: blur(15px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); }
        input, select { background-color: rgba(255, 255, 255, 0.7) !important; font-weight: 800; border: 1px solid rgba(0,0,0,0.15) !important; color: #000 !important; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">

    <div class="content-overlay flex flex-col">
        <header class="bg-white/95 p-4 border-b-4 border-green-600 shadow-lg sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo GSD" class="h-16 mx-auto mb-1">
            <p class="text-green-700 text-[10px] font-black uppercase tracking-widest">Sourcing • Logistique • Agricole • Auto</p>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6">
            <section class="rounded-3xl p-5 shadow-xl border-2 border-green-600">
                <h2 class="text-xs font-black uppercase text-green-900 mb-3"><i class="fas fa-truck-fast mr-2"></i> Suivi de votre livraison</h2>
                <div class="flex flex-col gap-2">
                    <input type="text" id="suivi-id" placeholder="NUMÉRO DE DEVIS" class="p-3 rounded-xl text-xs uppercase text-center">
                    <input type="text" id="suivi-nom" placeholder="NOM DE FAMILLE" class="p-3 rounded-xl text-xs uppercase text-center">
                    <button onclick="consulterLeSuiviRelance()" class="bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-black text-xs uppercase transition">Suivre</button>
                </div>
                <div id="resultat-suivi-container" class="hidden mt-4 p-4 bg-white/80 rounded-2xl text-left text-xs font-bold space-y-2"></div>
            </section>
        </div>
    </div>

    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwt8JcKCe7NP1tdbeQToisn6YA-U7z33etQtd8ZFBeoaqMxD81N-AHIo7nLfiqGwr4G/exec";

        async function consulterLeSuiviRelance() {
            const id = document.getElementById('suivi-id').value.trim();
            const nom = document.getElementById('suivi-nom').value.trim();
            const conteneur = document.getElementById('resultat-suivi-container');
            conteneur.classList.remove('hidden');
            conteneur.innerHTML = "Recherche...";

            let res = await fetch(URL_WEB_APP, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: "action=track&suivi_id=" + encodeURIComponent(id) + "&suivi_nom=" + encodeURIComponent(nom)
            });
            let json = await res.json();
            
            if (json.status === "Trouvé") {
                let html = `<p class="text-blue-700 font-black">📦 ${json.statut_general}</p><p>Étape : ${json.commentaire_etape}</p>`;
                if (json.statut_general.toUpperCase().includes("ACCORD")) {
                    html += `
                        <div class="mt-4 pt-4 border-t border-green-300">
                            <input type="email" id="input-client-email" placeholder="VOTRE E-MAIL" class="w-full p-3 rounded-xl mb-2 text-center text-xs">
                            <button onclick="declencherEnvoiCode('${id}', '${nom}')" id="btn-otp" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black text-xs">RECEVOIR LE CODE PAR E-MAIL</button>
                            <div id="feedback-otp" class="hidden mt-2">
                                <input type="number" id="input-code-otp" placeholder="CODE À 4 CHIFFRES" class="w-full p-3 rounded-xl text-center text-xs">
                                <button onclick="envoyerVerificationCodeOTP('${id}', '${nom}')" class="w-full bg-emerald-600 text-white py-3 rounded-xl mt-2 font-black text-xs">VALIDER MA COMMANDE</button>
                            </div>
                        </div>`;
                }
                conteneur.innerHTML = html;
            } else { conteneur.innerHTML = "Dossier introuvable."; }
        }

        async function declencherEnvoiCode(id, nom) {
            const email = document.getElementById('input-client-email').value;
            let res = await fetch(URL_WEB_APP, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: "action=demander_code&suivi_id=" + encodeURIComponent(id) + "&suivi_nom=" + encodeURIComponent(nom) + "&client_email=" + encodeURIComponent(email)
            });
            let json = await res.json();
            if (json.status === "CodeEnvoye") {
                document.getElementById('btn-otp').classList.add('hidden');
                document.getElementById('feedback-otp').classList.remove('hidden');
                alert("Code envoyé !");
            }
        }

        async function envoyerVerificationCodeOTP(id, nom) {
            const code = document.getElementById('input-code-otp').value;
            let res = await fetch(URL_WEB_APP, {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: "action=verifier_code&suivi_id=" + encodeURIComponent(id) + "&suivi_nom=" + encodeURIComponent(nom) + "&code_validation=" + encodeURIComponent(code)
            });
            let json = await res.json();
            if (json.status === "ValidationSucces") { alert("Commande validée avec succès !"); } else { alert("Code incorrect."); }
        }
    </script>
</body>
</html>
