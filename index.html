<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-white shadow-md p-6 text-center">
        <img src="logo.jpg" alt="Logo Guyane Sourcing Direct" class="h-32 mx-auto mb-2">
        <p class="text-gray-500 text-sm mt-1 font-medium italic uppercase tracking-widest">Sourcing • Logistique • Accompagnement</p>
    </header>

    <div class="max-w-2xl mx-auto p-4 space-y-8">

        <section class="bg-white rounded-2xl shadow-xl p-6 border-t-8 border-blue-700">
            <h2 class="text-2xl font-black text-gray-800 uppercase mb-6 flex items-center">
                <i class="fas fa-file-signature mr-3 text-blue-700"></i> Demande de Devis
            </h2>
            <form action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4">
                <input type="text" name="nom" placeholder="Votre Nom complet" required class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl font-bold outline-none">
                <input type="tel" name="telephone" placeholder="Téléphone" required class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl font-bold outline-none">
                <input type="email" name="email" placeholder="Adresse Email" required class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl font-bold outline-none">
                <textarea name="besoin" placeholder="Détaillez votre besoin ici..." rows="4" required class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl outline-none"></textarea>
                <button type="submit" class="w-full bg-blue-700 text-white py-5 rounded-2xl font-black text-xl uppercase tracking-widest shadow-lg">
                    Envoyer ma demande
                </button>
            </form>
        </section>

        <section class="bg-white rounded-2xl shadow-xl p-6 border-t-8 border-orange-500">
            <h2 class="text-xl font-black text-gray-800 uppercase mb-4">Suivi de Dossier</h2>
            <div class="flex space-x-2">
                <input type="text" id="numDevis" placeholder="N° DE DEVIS" class="flex-1 p-4 border-2 border-gray-200 rounded-xl font-black text-blue-700 uppercase outline-none focus:border-orange-500">
                <button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-xl shadow-md">
                    <i class="fas fa-search text-2xl"></i>
                </button>
            </div>
            <div id="resultat" class="hidden mt-4 bg-gray-50 p-5 rounded-2xl border-2 border-dashed border-gray-200 text-center animate-fade-in">
                <p id="nomClient" class="text-xl font-black text-gray-800 uppercase mb-2"></p>
                <div id="statut" class="inline-block px-6 py-3 rounded-full text-white font-black text-sm uppercase tracking-widest shadow-md"></div>
            </div>
        </section>

        <a href="https://wa.me/33699337803" class="flex items-center justify-center space-x-4 bg-green-500 text-white p-5 rounded-3xl font-black shadow-2xl transition transform hover:scale-105">
            <i class="fab fa-whatsapp text-4xl"></i>
            <span class="text-xl uppercase">WhatsApp Direct</span>
        </a>
    </div>

    <script>
        const urlCSV = "https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/export?format=csv";
        async function chercherDossier() {
            const idRecherche = document.getElementById('numDevis').value.trim();
            const res = document.getElementById('resultat');
            if(!idRecherche) return;
            try {
                const response = await fetch(urlCSV);
                const data = await response.text();
                const lignes = data.split('\n').map(l => l.split(','));
                const dossiers = {};
                for (let i = 1; i < lignes.length; i++) {
                    const [id, client, statut] = lignes[i];
                    if(id) dossiers[id.replace(/"/g, '').trim()] = { nom: client, statut: statut };
                }
                const d = dossiers[idRecherche];
                if (d) {
                    res.classList.remove('hidden');
                    document.getElementById('nomClient').innerText = d.nom.replace(/"/g, '');
                    const s = document.getElementById('statut');
                    s.innerText = d.statut.replace(/"/g, '');
                    s.style.backgroundColor = (d.statut.toLowerCase().includes('expédié') || d.statut.toLowerCase().includes('payé')) ? '#10b981' : '#f59e0b';
                } else { alert("Numéro non trouvé."); }
            } catch (e) { alert("Erreur."); }
        }
    </script>
</body>
</html>
