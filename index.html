<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            /* On utilise .jpg comme tu l'as confirmé */
            background-image: url('Fond.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #f1f5f9;
        }
        /* Transparence pour voir ton beau fond d'écran */
        section { 
            backdrop-filter: blur(8px); 
            background-color: rgba(255, 255, 255, 0.7) !important;
        }
    </style>
</head>
<body class="font-sans flex flex-col min-h-screen">

    <header class="bg-white/90 p-6 text-center border-b-4 border-green-600 sticky top-0 z-50">
        <img src="Logo.jpg" alt="Logo" class="h-20 mx-auto">
        <p class="text-green-700 text-[10px] font-black uppercase tracking-widest">Sourcing • Logistique • Guyane</p>
    </header>

    <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full">

        <section class="rounded-3xl shadow-lg p-6 border border-white/20">
            <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center border-b-2 border-blue-700 pb-2">
                <i class="fas fa-file-invoice-dollar mr-3 text-blue-700"></i> Demande de Devis
            </h2>
            <form id="devisForm" action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4">
                <input type="text" name="nom" placeholder="Nom complet" required class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" name="immatriculation" placeholder="Immat." required class="w-full p-4 bg-blue-50/50 border-2 border-blue-100 rounded-2xl font-bold uppercase text-center outline-none focus:border-blue-600">
                    <input type="text" name="modele" placeholder="Marque / Modèle" class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600">
                </div>
                <input type="tel" name="telephone" placeholder="Téléphone" required class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600">
                <input type="email" name="email" placeholder="Email" required class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600">
                <textarea name="besoin" placeholder="Détaillez votre besoin..." rows="2" required class="w-full p-4 bg-white/50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-600"></textarea>
                <button type="submit" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black uppercase shadow-lg hover:bg-blue-800 transition-all">Envoyer ma demande</button>
            </form>
        </section>

        <section class="rounded-3xl shadow-xl p-6 border-2 border-orange-500">
            <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center">
                <i class="fas fa-shield-check mr-3 text-orange-500"></i> Suivi Sécurisé
            </h2>
            <div class="space-y-3">
                <input type="text" id="nomRecherche" placeholder="VOTRE NOM" class="w-full p-4 border-2 border-slate-100 rounded-2xl font-bold uppercase outline-none focus:border-orange-500">
                <div class="flex space-x-2">
                    <input type="text" id="numDevis" placeholder="N° DE DEVIS" class="flex-1 p-4 border-2 border-slate-100 rounded-2xl font-black text-blue-700 uppercase text-center outline-none focus:border-orange-500">
                    <button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-2xl shadow-lg hover:bg-orange-600 transition-all">
                        <i class="fas fa-search text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div id="resultat" class="hidden mt-6">
                <div class="bg-slate-900/95 rounded-3xl p-6 text-center text-white border-b-8 border-yellow-500 shadow-2xl">
                    <p id="nomClientDisplay" class="text-xl font-black uppercase text-yellow-500 mb-2"></p>
                    <div class="my-4 py-4 border-y border-slate-800">
                        <p id="montantDisplay" class="text-5xl font-black text-white"></p>
                    </div>
                    <div id="statut" class="inline-block px-5 py-2 rounded-full text-white font-black text-[10px] uppercase shadow-inner"></div>
                </div>
                <div id="zonePaiement" class="hidden mt-6 space-y-4">
                    <a id="btnStripe" href="#" target="_blank" class="hidden w-full bg-emerald-600 text-white py-4 rounded-2xl font-black uppercase shadow-lg flex items-center justify-center gap-3">Payer par Carte</a>
                    <a id="btnPaypal" href="#" target="_blank" class="hidden w-full bg-[#0070ba] text-white py-4 rounded-2xl font-black uppercase shadow-lg flex items-center justify-center gap-3">PayPal / 4X</a>
                </div>
            </div>
        </section>

        <a href="https://wa.me/33699337803" class="flex items-center justify-center space-x-4 bg-[#25D366] text-white p-5 rounded-2xl font-black shadow-xl">
            <i class="fab fa-whatsapp text-3xl"></i><span class="text-xl uppercase">WhatsApp Direct</span>
        </a>
    </div>

    <footer class="bg-white/80 p-8 text-center border-t border-slate-200 text-slate-400 text-[10px] uppercase font-bold tracking-widest">
        © 2026 Guyane Sourcing Direct | VILOSA
    </footer>

    <script>
        const urlCSV = "https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/export?format=csv";
        async function chercherDossier() {
            const nomSaisi = document.getElementById('nomRecherche').value.trim().toUpperCase();
            const idSaisi = document.getElementById('numDevis').value.trim().toUpperCase();
            const res = document.getElementById('resultat');
            if(!nomSaisi || !idSaisi) return;
            try {
                const response = await fetch(urlCSV);
                const data = await response.text();
                const lignes = data.split('\n');
                let trouve = false;
                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(col[0]?.replace(/"/g, '').trim().toUpperCase() === idSaisi && col[2]?.replace(/"/g, '').trim().toUpperCase() === nomSaisi) {
                        trouve = true;
                        res.classList.remove('hidden');
                        document.getElementById('nomClientDisplay').innerText = col[1]?.replace(/"/g, '').trim() + " " + col[2]?.replace(/"/g, '').trim();
                        document.getElementById('montantDisplay').innerText = col[7]?.replace(/"/g, '').trim() + " €";
                        const s = document.getElementById('statut');
                        s.innerText = col[3]?.replace(/"/g, '').trim();
                        s.style.backgroundColor = s.innerText.toLowerCase().includes('payé') ? '#00843D' : '#D97706';
                        document.getElementById('zonePaiement').classList.remove('hidden');
                        const bStripe = document.getElementById('btnStripe');
                        if(col[4]?.startsWith('http')) { bStripe.href = col[4]; bStripe.classList.remove('hidden'); bStripe.classList.add('flex'); }
                        const bPaypal = document.getElementById('btnPaypal');
                        if(col[6]?.startsWith('http')) { bPaypal.href = col[6]; bPaypal.classList.remove('hidden'); bPaypal.classList.add('flex'); }
                        break;
                    }
                }
                if (!trouve) alert("Dossier introuvable.");
            } catch (e) { alert("Erreur de connexion."); }
        }
    </script>
</body>
</html>
