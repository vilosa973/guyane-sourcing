<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct - Devis Pièces Auto & Agricoles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-guyane { background-color: #004d3d; }
        .text-guyane { color: #004d3d; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <header class="bg-guyane text-white py-6 px-4 shadow-lg text-center">
        <h1 class="text-2xl font-bold">GUYANE SOURCING DIRECT</h1>
        <p class="text-sm opacity-90">Pièces Auto & Agricoles : Hexagone -> Guyane</p>
    </header>

    <main class="max-w-xl mx-auto p-4 pb-24">
        
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h2 class="text-xl font-bold mb-4 text-guyane border-b pb-2 italic">Demande de devis gratuit</h2>
            
            <form action="https://formspree.io/f/xyzkpvze" method="POST" enctype="multipart/form-data" class="space-y-4">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">Nom *</label>
                        <input type="text" name="nom" required class="w-full border p-2 rounded bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">Prénom *</label>
                        <input type="text" name="prenom" required class="w-full border p-2 rounded bg-gray-50">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Immatriculation *</label>
                    <input type="text" name="immatriculation" placeholder="Ex: AB-123-CD" required class="w-full border p-2 rounded bg-gray-50 uppercase text-blue-700 font-bold">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Téléphone (WhatsApp) *</label>
                    <input type="tel" name="telephone" required class="w-full border p-2 rounded bg-gray-50">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Email (Optionnel)</label>
                    <input type="email" name="email" class="w-full border p-2 rounded bg-gray-50">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Description de la pièce *</label>
                    <textarea name="message" rows="3" placeholder="Moteur, alternateur, pièce de tracteur..." required class="w-full border p-2 rounded bg-gray-50"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Adresse de livraison en Guyane *</label>
                    <input type="text" name="livraison" placeholder="Ville ou commune" required class="w-full border p-2 rounded bg-gray-50">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Photo de la pièce (Optionnel)</label>
                    <input type="file" name="photo" accept="image/*" class="w-full text-sm">
                </div>

                <button type="submit" class="w-full bg-guyane text-white font-bold py-3 rounded-lg shadow hover:bg-green-900 transition flex justify-center items-center gap-2">
                    <i class="fas fa-paper-plane"></i> ENVOYER MA DEMANDE
                </button>
            </form>
        </div>

        <div class="grid grid-cols-2 gap-4 text-center text-xs">
            <div class="bg-white p-3 rounded shadow-sm border-t-2 border-yellow-500">
                <i class="fas fa-shield-alt text-guyane text-lg mb-1"></i><br>Paiement Sécurisé
            </div>
            <div class="bg-white p-3 rounded shadow-sm border-t-2 border-yellow-500">
                <i class="fas fa-truck text-guyane text-lg mb-1"></i><br>Livraison Guyane
            </div>
        </div>

    </main>

    <a href="https://wa.me/336XXXXXXXX" class="fixed bottom-6 right-6 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl z-50 text-2xl hover:scale-110 transition">
        <i class="fab fa-whatsapp"></i>
    </a>

    <footer class="text-center py-4 text-gray-400 text-xs italic">
        © 2026 Guyane Sourcing Direct - Entreprise de Sourcing Pro
    </footer>

</body>
</html>
