<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Pièces Auto & Logistique 973</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .bg-guyane-green { background-color: #00843D; } /* Vert forêt Guyane */
        .text-guyane-yellow { color: #FFCD00; } /* Jaune Logo */
        .border-guyane-yellow { border-color: #FFCD00; }
    </style>
</head>
<body class="bg-slate-50 font-sans flex flex-col min-h-screen text-slate-900">

    <header class="bg-white shadow-sm p-6 text-center border-b-4 border-guyane-green">
        <img src="Logo.jpg" alt="Logo Guyane Sourcing Direct" class="h-32 mx-auto mb-2 drop-shadow-md">
        <p class="text-guyane-green text-sm mt-1 font-black italic uppercase tracking-[0.2em]">Sourcing • Logistique • Guyane</p>
    </header>

    <div class="max-w-2xl mx-auto p-4 space-y-8 flex-grow w-full">

        <section class="bg-white rounded-3xl shadow-lg p-6 border border-slate-100">
            <h2 class="text-xl font-black text-slate-800 uppercase mb-6 flex items-center">
                <i class="fas fa-file-invoice-dollar mr-3 text-blue-700"></i> Demande de Devis
            </h2>
            <form id="devisForm" action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4">
                <input type="text" name="nom" placeholder="Nom complet" required class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600 transition-all">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" name="immatriculation" placeholder="Immatriculation" required class="w-full p-4 bg-blue-50 border-2 border-blue-100 rounded-2xl font-bold outline-none focus:border-blue-600 uppercase">
                    <input type="text" name="modele" placeholder="Modèle" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold outline-none focus:border-blue-600">
                </div>
                <textarea name="besoin" placeholder="Que recherchez-vous ?" rows="3" required class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-600"></textarea>
                <button type="submit" class="w-full bg-blue-700 text-white py-5 rounded-2xl font-black text-lg uppercase tracking-wider shadow-md hover:bg-blue-800 transition-all active:scale-95">Envoyer la demande</button>
            </form>
            <div id="successMessage" class="hidden text-center p-6 bg-green-100 text-green-800 rounded-2xl font-bold">
                <i class="fas fa-check-circle text-3xl mb-2"></i><br>Demande envoyée avec succès !
            </div>
        </section>

        <section class="bg-white rounded-3xl shadow-xl p-6 border-2 border-guyane-green relative overflow-hidden">
            <div class="absolute top-0 right-0 w-20 h-20 bg-guyane-green opacity-5 -mr-10 -mt-10 rounded-full"></div>
            
            <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center">
                <i class="fas fa-shield-check mr-3 text-guyane-green"></i> Espace Client Sécurisé
            </h2>
            
            <div class="space-y-3 relative z-10">
                <input type="text" id="nomRecherche" onkeypress="if(event.key === 'Enter') chercherDossier()" placeholder="VOTRE NOM" class="w-full p-4 border-2 border-slate-100 rounded-2xl font-bold text-slate-700 uppercase outline-none focus:border-guyane-green transition-all">
                <div class="flex space-x-2">
                    <input type="text" id="numDevis" onkeypress="if(event.key === 'Enter') chercherDossier()" placeholder="N° DE DEVIS" class="flex-1 p-4 border-2 border-slate-100 rounded-2xl font-black text-blue-700 uppercase outline-none focus:border-guyane-green transition-all">
                    <button onclick="chercherDossier()" class="bg-guyane-green text-white px-8 py-4 rounded-2xl shadow-lg hover:brightness-110 transition-all active:scale-95">
                        <i class="fas fa-search text-xl"></i>
                    </button>
                </div>
            </div>
            
            <div id="resultat" class="hidden mt-8 animate-in fade-in zoom-in duration-300">
                <div class="bg-slate-900 rounded-3xl p-6 text-center text-white border-b-8 border-guyane-yellow shadow-2xl">
                    <p id="nomClientDisplay" class="text-xl font-black uppercase tracking-widest text-guyane-yellow mb-2"></p>
                    
                    <div class="my-4 py-4 px-2 border-y border-slate-700">
                        <p class="text-slate-400 text-[10px] font-black uppercase tracking-[0.3em] mb-1">Montant total du devis</p>
                        <p id="montantDisplay" class="text-5xl font-black text-white"></p>
                    </div>

                    <p id="detailDevis" class="text-[10px] font-bold text-slate-400 uppercase mb-4 italic"></p>
                    <div id="statut" class="inline-block px-5 py-2 rounded-full text-white font-black text-[10px] uppercase tracking-widest shadow-inner"></div>
                </div>
                
                <div id="zonePaiement" class="hidden mt-6 space-y-4">
                    <div class="flex items-center justify-center gap-2 text-slate-400 mb-2">
                        <i class="fas fa-lock text-[10px]"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest">Paiement 100% Sécurisé</span>
                    </div>
                    
                    <a id="btnStripe" href="#" target="_blank" class="hidden w-full bg-[#059669] text-white py-5 rounded-2xl font-black text-lg uppercase shadow-lg hover:brightness-110 transition-all flex items-center justify-center gap-3">
                        <i class="fas fa-credit-card text-2xl"></i> Payer par Carte
                    </a>

                    <a id="btnPaypal" href="#" target="_blank" class="hidden w-full bg-[#0070ba] text-white py-5 rounded-2xl font-black text-lg uppercase shadow-lg hover:brightness-110 transition-all flex items-center justify-center gap-3">
                        <i class="fab fa-paypal text-2xl"></i> PayPal / 4X
                    </a>

                    <div class="flex justify-center items-center gap-4 pt-2 opacity-30 grayscale">
                        <i class="fab fa-cc-visa text-2xl"></i>
                        <i class="fab fa-cc-mastercard text-2xl"></i>
                        <i class="fab fa-cc-paypal text-2xl"></i>
                        <i class="fab fa-apple-pay text-2xl"></i>
                    </div>
                </div>
            </div>
        </section>

        <a href="https://wa.me/33699337803" class="flex items-center justify-center space-x-4 bg-[#25D366] text-white p-5 rounded-2xl font-black shadow-xl hover:scale-[1.02] transition-transform active:scale-95">
            <i class="fab fa-whatsapp text-3xl"></i>
            <span class="text-lg uppercase tracking-tighter">Assistance WhatsApp Direct</span>
        </a>
    </div>

    <footer class="bg-white mt-12 p-10 text-center border-t border-slate-200 text-slate-400 text-[10px] uppercase tracking-[0.3em] font-bold">
        <p>© 2026 Guyane Sourcing Direct | VILOSA</p>
    </footer>

    <script>
        const urlCSV = "https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/export?format=csv";
        
        const formDevis = document.getElementById('devisForm');
        formDevis.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(formDevis);
            await fetch(formDevis.action, { method: 'POST', body: formData, headers: {'Accept': 'application/json'} });
            formDevis.classList.add('hidden');
            document.getElementById('successMessage').classList.remove('hidden');
        };

        async function chercherDossier() {
            const nomSaisi = document.getElementById('nomRecherche').value.trim().toUpperCase();
            const idSaisi = document.getElementById('numDevis').value.trim().toUpperCase();
            const res = document.getElementById('resultat');

            if(!nomSaisi || !idSaisi) {
                alert("Veuillez remplir votre NOM et votre N° DE DEVIS.");
                return;
            }
            
            try {
                const response = await fetch(urlCSV);
                const data = await response.text();
                const lignes = data.split('\n');
                let trouve = false;
                
                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    const idTableau = col[0]?.replace(/"/g, '').trim().toUpperCase();
                    const civiliteTableau = col[1]?.replace(/"/g, '').trim() || "";
                    const nomTableau = col[2]?.replace(/"/g, '').trim().toUpperCase();

                    if(idTableau === idSaisi && nomTableau === nomSaisi) {
                        trouve = true;
                        res.classList.remove('hidden');
                        
                        document.getElementById('nomClientDisplay').innerText = civiliteTableau + " " + col[2]?.replace(/"/g, '').trim();
                        
                        const montant = col[7]?.replace(/"/g, '').trim() || "0";
                        document.getElementById('montantDisplay').innerText = montant + " €";
                        
                        const detail = col[5]?.replace(/"/g, '').trim() || "Pièces Auto";
                        document.getElementById('detailDevis').innerText = "Réf. Dossier : " + idSaisi + " • " + detail;
                        
                        const s = document.getElementById('statut');
                        const statutTexte = col[3]?.replace(/"/g, '').trim();
                        s.innerText = statutTexte;
                        s.style.backgroundColor = statutTexte.toLowerCase().includes('payé') ? '#00843D' : '#D97706';
                        
                        document.getElementById('zonePaiement').classList.remove('hidden');

                        const linkStripe = col[4]?.replace(/"/g, '').trim();
                        const bStripe = document.getElementById('btnStripe');
                        if(linkStripe && linkStripe.startsWith('http')) {
                            bStripe.href = linkStripe;
                            bStripe.classList.remove('hidden'); bStripe.classList.add('flex');
                        } else { bStripe.classList.add('hidden'); bStripe.classList.remove('flex'); }

                        const linkPaypal = col[6]?.replace(/"/g, '').trim();
                        const bPaypal = document.getElementById('btnPaypal');
                        if(linkPaypal && linkPaypal.startsWith('http')) {
                            bPaypal.href = linkPaypal;
                            bPaypal.classList.remove('hidden'); bPaypal.classList.add('flex');
                        } else { bPaypal.classList.add('hidden'); bPaypal.classList.remove('flex'); }
                        
                        break;
                    }
                }
                if (!trouve) alert("Dossier introuvable. Vérifiez l'orthographe de votre NOM et le N° de Devis.");
            } catch (e) { alert("Erreur de connexion au serveur."); }
        }
    </script>
</body>
</html>
