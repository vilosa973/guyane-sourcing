<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
        input, textarea, select { background-color: rgba(255, 255, 255, 0.3) !important; border: 1px solid rgba(255, 255, 255, 0.3) !important; color: #000 !important; font-weight: 700; }
        .tab-btn.active { background-color: #1d4ed8; color: white; border-bottom: 4px solid #1e40af; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">

    <div class="content-overlay flex flex-col">
        <header class="bg-white/95 p-4 border-b-4 border-green-600 shadow-md sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo GSD" class="h-16 mx-auto">
            <p class="text-green-700 text-[10px] font-black uppercase mt-1 tracking-widest text-center">Sourcing • Logistique • Agricole • Auto</p>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full mt-6">

            <section class="rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-600">
                <div class="flex bg-white/50 border-b border-blue-200">
                    <button onclick="switchTab('photo')" id="tab-photo" class="tab-btn active flex-1 py-4 font-black uppercase text-xs tracking-widest text-center">📷 Analyse Carte Grise</button>
                    <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-xs tracking-widest text-slate-600 text-center">✍️ Saisie Manuelle</button>
                </div>

                <div class="p-6 space-y-4 text-center">
                    <div id="form-photo" class="space-y-4">
                        <label class="w-full flex flex-col items-center justify-center p-6 border-2 border-dashed border-blue-500 rounded-2xl bg-white/50 cursor-pointer hover:bg-white/80">
                            <i class="fas fa-id-card text-3xl text-blue-600 mb-2"></i>
                            <span class="text-xs font-bold uppercase">Scanner la Carte Grise (Garantie Totale)</span>
                            <input type="file" accept="image/*" id="input-cg" class="hidden" onchange="previewCG(this)">
                        </label>
                        <div id="cg-status" class="hidden text-[10px] text-green-700 font-bold uppercase">✓ ADN Véhicule chargé</div>
                    </div>

                    <div id="form-modele" class="hidden space-y-2">
                        <div class="grid-inputs">
                            <input type="text" id="m-marque" placeholder="MARQUE" class="p-3 rounded-xl text-sm uppercase text-center text-center">
                            <input type="text" id="m-modele" placeholder="MODÈLE" class="p-3 rounded-xl text-sm uppercase text-center text-center">
                        </div>
                    </div>

                    <input type="text" id="ai-piece" placeholder="NOM DE LA PIÈCE ?" class="w-full p-4 rounded-2xl outline-none border-2 border-blue-500 shadow-inner text-center font-bold">

                    <button onclick="rechercheIA()" id="btn-ia" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase shadow-lg flex items-center justify-center gap-3">
                        <i class="fas fa-microchip"></i> ANALYSER & TROUVER
                    </button>

                    <div id="ai-resultat" class="hidden mt-4 space-y-4">
                        <div id="ai-loading" class="py-8 bg-white/80 rounded-2xl text-center"><i class="fas fa-sync fa-spin text-blue-700 text-3xl"></i><p class="font-bold mt-2 uppercase text-[10px]">Analyse de compatibilité...</p></div>
                        <div id="ai-content" class="hidden space-y-4 text-left">
                            <div class="bg-white p-4 rounded-2xl flex items-center gap-4 shadow-md border-l-8 border-blue-700">
                                <img id="ai-vehicule-img" class="w-24 h-24 object-contain rounded-lg bg-slate-50 border" onerror="this.src='Logo.jpg'">
                                <div class="flex-1">
                                    <p id="ai-modele-long" class="font-black uppercase text-base leading-tight text-slate-900"></p>
                                    <p id="ai-moteur-details" class="text-[11px] font-bold text-blue-600 mt-1 italic"></p>
                                </div>
                            </div>
                            <div id="offres-container" class="grid grid-cols-1 gap-3"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="rounded-3xl shadow-2xl p-4 border-l-8 border-emerald-500 overflow-hidden text-center">
                <div class="rounded-2xl overflow-hidden shadow-inner bg-black aspect-video">
                    <video controls class="w-full h-full object-cover">
                        <source src="explication.mp4" type="video/mp4">
                    </video>
                </div>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 text-center">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center justify-center"><i class="fas fa-file-invoice-dollar mr-3 text-blue-700"></i> Demande de Devis</h2>
                <form action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4">
                    <select name="civilite" required class="w-full p-4 rounded-2xl outline-none text-center">
                        <option value="Monsieur">Monsieur</option>
                        <option value="Madame">Madame</option>
                    </select>
                    <div class="grid-inputs">
                        <input type="text" name="nom" placeholder="NOM" required class="p-4 rounded-2xl outline-none uppercase text-center">
                        <input type="text" name="prenom" placeholder="PRÉNOM" required class="p-4 rounded-2xl outline-none text-center">
                    </div>
                    <input type="text" name="plaque" placeholder="PLAQUE D'IMMATRICULATION" class="w-full p-4 rounded-2xl outline-none uppercase text-center">
                    <input type="email" name="email" placeholder="VOTRE EMAIL" required class="w-full p-4 rounded-2xl outline-none text-center">
                    <textarea name="description" placeholder="DÉTAILS DE VOTRE DEMANDE (Pièces, état, urgence...)" rows="3" required class="w-full p-4 rounded-2xl outline-none text-center"></textarea>
                    <button type="submit" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black uppercase text-center shadow-lg hover:bg-blue-800 transition-colors">Envoyer la demande</button>
                </form>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 border-2 border-orange-500 text-center">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center justify-center">
                    <i class="fas fa-shield-check mr-3 text-orange-500"></i> Espace Client
                </h2>
                <div class="space-y-3">
                    <input type="text" id="nomRecherche" placeholder="NOM (MAJUSCULES)" class="w-full p-4 rounded-2xl outline-none text-center">
                    <div class="flex space-x-2">
                        <input type="text" id="numDevis" placeholder="N° DEVIS" class="flex-1 p-4 rounded-2xl text-blue-900 font-black text-center outline-none">
                        <button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-2xl shadow-lg"><i class="fas fa-search"></i></button>
                    </div>
                </div>
                <div id="resultat" class="hidden mt-6 text-center">
                    <div class="bg-slate-900/95 rounded-3xl p-6 text-white border-b-8 border-yellow-500 shadow-2xl text-center">
                        <p id="nomClientDisplay" class="text-xl font-black uppercase text-yellow-500 mb-2"></p>
                        <div class="my-4 py-4 border-y border-slate-800 text-center">
                            <p id="montantDisplay" class="text-5xl font-black text-white"></p>
                        </div>
                        <div id="statut" class="inline-block px-6 py-2 rounded-full text-white font-black text-[10px] uppercase shadow-inner text-center"></div>
                    </div>
                    <div id="zonePaiement" class="hidden mt-6 space-y-4">
                        <a id="btnStripe" href="#" target="_blank" class="hidden w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase flex items-center justify-center gap-3"><i class="fas fa-credit-card"></i> Payer par Carte</a>
                        <a id="btnPaypal" href="#" target="_blank" class="hidden w-full bg-[#0070ba] text-white py-5 rounded-2xl font-black uppercase flex items-center justify-center gap-3"><i class="fab fa-paypal"></i> PayPal / 4X</a>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const OPENAI_API_KEY = "sk-proj-fqujJmA0bqzAHOgU-GuxlZxDMVmUYyJXGqtUB0b4mLIiUsOiHOmWswLdWoV" + "aUkYkRfqi3ehEM3T3BlbkFJnlfBbAyJ_uxv0l58PwIrksEoFvxqx-TJ4eYzWgtx7m6AQCGP3qRIc0EzAduLZVTcyj-Bb1lkYA";

        function switchTab(tab) {
            document.getElementById('tab-photo').classList.toggle('active', tab === 'photo');
            document.getElementById('tab-modele').classList.toggle('active', tab === 'modele');
            document.getElementById('form-photo').classList.toggle('hidden', tab !== 'photo');
            document.getElementById('form-modele').classList.toggle('hidden', tab !== 'modele');
        }

        function previewCG(input) { if(input.files[0]) document.getElementById('cg-status').classList.remove('hidden'); }

        async function rechercheIA() {
            const piece = document.getElementById('ai-piece').value;
            if(!piece) return alert("Saisissez une pièce.");

            document.getElementById('ai-resultat').classList.remove('hidden');
            document.getElementById('ai-loading').classList.remove('hidden');
            document.getElementById('ai-content').classList.add('hidden');

            let promptContent = [{ type: "text", text: `Expert GSD. Analyse carte grise (Case A: Plaque, D.2, E, P.1, P.2, P.3, P.6). Trouve 3 offres pour : "${piece}". JSON format: {'machine':{'nom':'','infos':'','img':'','plaque':''}, 'offres':[{'vendeur':'','nom_piece':'','fabricant':'','ref_fab':'','prix_ht':0,'etat':'','avis_expert':''}]}` }];
            
            const cgFile = document.getElementById('input-cg').files[0];
            if (cgFile && !document.getElementById('form-photo').classList.contains('hidden')) {
                const base64 = await toBase64(cgFile);
                promptContent.push({ type: "image_url", image_url: { url: base64 } });
            }

            try {
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${OPENAI_API_KEY}` },
                    body: JSON.stringify({
                        model: "gpt-4o",
                        messages: [{ role: "system", content: "Expert sourcing auto. Extraction plaque obligatoire." }, { role: "user", content: promptContent }],
                        response_format: { type: "json_object" }
                    })
                });

                const data = await response.json();
                const res = JSON.parse(data.choices[0].message.content);
                const plaque = res.machine.plaque || "";

                document.getElementById('ai-vehicule-img').src = res.machine.img || 'Logo.jpg';
                document.getElementById('ai-modele-long').innerText = res.machine.nom;
                document.getElementById('ai-moteur-details').innerText = "⚙️ " + res.machine.infos + (plaque ? " | Immat: " + plaque : "");

                let html = "";
                res.offres.forEach(o => {
                    const prixFinal = (parseFloat(o.prix_ht) * 1.20) + 45;
                    const rechercheAuto = `https://www.mister-auto.com/recherche/?q=${encodeURIComponent(o.nom_piece)}&plate=${plaque}`;
                    const waMessage = `Bonjour GSD ! Commande : ${o.nom_piece} (${o.etat}) | Plaque: ${plaque} | Réf: ${o.ref_fab} | Prix: ${prixFinal.toFixed(2)}€`;

                    html += `
                        <div class="bg-white rounded-2xl p-4 shadow-lg flex flex-col gap-3 text-left border-b-4 border-blue-600 text-left">
                            <div class="flex items-center gap-4">
                                <img src="Logo.jpg" class="w-16 h-16 object-contain rounded border">
                                <div class="flex-1">
                                    <p class="text-[11px] font-black uppercase text-slate-800 leading-tight">${o.nom_piece}</p>
                                    <p class="text-[9px] text-blue-600 font-bold uppercase">${o.etat} | REF: ${o.ref_fab}</p>
                                    <p class="text-[9px] bg-green-100 text-green-800 px-2 py-1 rounded-md mt-1 font-bold text-left"><i class="fas fa-check-circle"></i> ${o.avis_expert}</p>
                                </div>
                            </div>
                            <div class="flex justify-between items-end border-t pt-2">
                                <p class="text-xl font-black">${prixFinal.toFixed(2)}€</p>
                                <div class="flex gap-2">
                                     <button onclick="window.location.href='https://wa.me/33699337803?text=${encodeURIComponent(waMessage)}'" class="bg-slate-900 text-white text-[9px] px-4 py-2 rounded-lg font-black uppercase">Commander</button>
                                     <a href="${rechercheAuto}" target="_blank" class="bg-blue-500 text-white text-[9px] px-4 py-2 rounded-lg flex items-center justify-center"><i class="fas fa-search"></i></a>
                                </div>
                            </div>
                        </div>`;
                });
                document.getElementById('offres-container').innerHTML = html;
                document.getElementById('ai-loading').classList.add('hidden');
                document.getElementById('ai-content').classList.remove('hidden');
            } catch (e) { alert("Erreur d'analyse."); }
        }

        const toBase64 = file => new Promise((res, rej) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => res(reader.result);
            reader.onerror = e => rej(e);
        });

        async function chercherDossier() {
            const nomSaisi = document.getElementById('nomRecherche').value.trim().toUpperCase();
            const idSaisi = document.getElementById('numDevis').value.trim().toUpperCase();
            if(!nomSaisi || !idSaisi) return alert("Identifiants requis.");
            try {
                const response = await fetch("https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/export?format=csv");
                const data = await response.text();
                const lignes = data.split('\n');
                let trouve = false;
                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if(col[0]?.replace(/"/g, '').trim().toUpperCase() === idSaisi && col[2]?.replace(/"/g, '').trim().toUpperCase() === nomSaisi) {
                        trouve = true;
                        document.getElementById('resultat').classList.remove('hidden');
                        document.getElementById('nomClientDisplay').innerText = col[1]?.replace(/"/g, '').trim() + " " + col[2]?.replace(/"/g, '').trim();
                        document.getElementById('montantDisplay').innerText = col[7]?.replace(/"/g, '').trim() + " €";
                        const s = document.getElementById('statut');
                        s.innerText = col[3]?.replace(/"/g, '').trim();
                        s.style.backgroundColor = s.innerText.toLowerCase().includes('payé') ? '#00843D' : '#D97706';
                        
                        const stripeL = col[4]?.replace(/"/g, '').trim();
                        if(stripeL?.startsWith('http')) { document.getElementById('btnStripe').href = stripeL; document.getElementById('btnStripe').classList.remove('hidden'); }
                        const paypalL = col[6]?.replace(/"/g, '').trim();
                        if(paypalL?.startsWith('http')) { document.getElementById('btnPaypal').href = paypalL; document.getElementById('btnPaypal').classList.remove('hidden'); }
                        document.getElementById('zonePaiement').classList.remove('hidden');
                        break;
                    }
                }
                if (!trouve) alert("Dossier introuvable.");
            } catch (e) { alert("Erreur réseau."); }
        }
    </script>
</body>
</html>
