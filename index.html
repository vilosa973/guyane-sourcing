<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-white shadow-md p-6 text-center">
        <img src="Logo.jpg" alt="Logo Guyane Sourcing Direct" class="h-32 mx-auto mb-2">
        <p class="text-gray-500 text-sm mt-1 font-medium italic uppercase tracking-widest">Sourcing • Logistique • Accompagnement</p>
    </header>

    <div class="max-w-2xl mx-auto p-4 space-y-8">

        <section class="bg-white rounded-2xl shadow-xl p-6 border-t-8 border-blue-700">
            <h2 class="text-2xl font-black text-gray-800 uppercase mb-6 flex items-center">
                <i class="fas fa-file-signature mr-3 text-blue-700"></i> Demande de Devis
            </h2>
            <form action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4">
                <input type="text" name="nom" placeholder="Votre Nom complet" required class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl font-bold outline-none focus:border-blue-700">
                
                <input type="text" name="immatriculation" placeholder="Immatriculation du véhicule (Ex: AA-123-BB)" required class="w-full p-4 bg-blue-50 border-2 border-blue-100 rounded-xl font-bold outline-none focus:border-blue-700 placeholder-blue-300 uppercase">
                
                <input type="tel" name="telephone" placeholder="Téléphone" required class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl font-bold outline-none focus:border-blue-700">
                <input type="email" name="email" placeholder="Adresse Email" required class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl font-bold outline-none focus:border-blue-700">
                <textarea name="besoin" placeholder="Détaillez votre besoin ici..." rows="4" required class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl outline-none focus:border-blue-700"></textarea>
                
                <button type="submit" class="w-full bg-blue-700 text-white py-5 rounded-2xl font-black text-xl uppercase tracking-widest shadow-lg hover:bg-blue-800 transition">
                    Envoyer ma demande
                </button>
            </form>
        </section>

        <section class="bg-white rounded-2xl shadow-xl p-6 border-t-8 border-orange-500">
            <h2 class="text-xl font-black text-gray-800 uppercase mb-4 flex items-center">
                <i class="fas fa-box-open mr-3 text-orange-500"></i> Suivi de Dossier
            </h2>
            <div class="flex space-x-2">
                <input type="text" id="numDevis" placeholder="N° DE DEVIS" class="flex-1 p-4 border-2 border-gray-200 rounded-xl font-black text-blue-700 uppercase outline-none focus:border-orange-500">
                <button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-xl shadow-md">
                    <i class="fas fa-search text-2xl"></i>
                </button>
            </div>
            
            <div id="resultat" class="hidden mt-4 bg-gray-50 p-5 rounded-2xl border-2 border-dashed border-gray-200 text-center">
                <p id="nomClient" class="text-xl font-black text-gray-800 uppercase mb-2"></p>
                <div id="statut" class="inline-block px-6 py-3 rounded-full text-white font-black text-sm uppercase tracking-widest shadow-md mb-4"></div>
                
                <div id="zonePaiement" class="hidden pt-4 border-t border-gray-200">
                    <a id="btnStripe" href="#" target="_blank" class="block w-full bg-emerald-600 text-white py-4 rounded-xl font-black text-lg uppercase shadow-lg hover:bg-emerald-700 transition flex items-center justify-center gap-3">
                        <i class="fas fa-credit-card"></i> Payer mon devis
                    </a>
                </div>
            </div>
        </section>

        <a href="https://wa.me/33699337803" class="flex items-center justify-center space-x-4 bg-green-500 text-white p-5 rounded-3xl font-black shadow-2xl transition transform hover:scale-105">
            <i class="fab fa-whatsapp text-4xl"></i>
            <span class="text-xl uppercase">WhatsApp Direct</span>
        </a>
    </div>

    <script>
        const urlCSV = "https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/export?format=csv";
        
        async function chercherDossier() {
            const idRecherche = document.getElementById('numDevis').value.trim();
            const res = document.getElementById('resultat');
            const zonePay = document.getElementById('zonePaiement');
            const btnPay = document.getElementById('btnStripe');
            
            if(!idRecherche) return;
            
            try {
                const response = await fetch(urlCSV);
                const data = await response.text();
                const lignes = data.split('\n');
                
                let trouve = false;
                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const id = col[0]?.replace(/"/g, '').trim();
                    
                    if(id === idRecherche) {
                        trouve = true;
                        res.classList.remove('hidden');
                        document.getElementById('nomClient').innerText = col[1]?.replace(/"/g, '').trim();
                        
                        const s = document.getElementById('statut');
                        const statutTexte = col[2]?.replace(/"/g, '').trim();
                        s.innerText = statutTexte;
                        s.style.backgroundColor = (statutTexte.toLowerCase().includes('expédié') || statutTexte.toLowerCase().includes('payé')) ? '#10b981' : '#f59e0b';
                        
                        const lienStripe = col[3]?.replace(/"/g, '').trim();
                        if (lienStripe && lienStripe.startsWith('http')) {
                            zonePay.classList.remove('hidden');
                            btnPay.href = lienStripe;
                        } else {
                            zonePay.classList.add('hidden');
                        }
                        break;
                    }
                }
                if (!trouve) { alert("Numéro de dossier non trouvé."); }
            } catch (e) { alert("Erreur de chargement du tableau."); }
        }
    </script>
</body>
</html>
