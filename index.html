<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section { backdrop-filter: blur(15px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); }
        #scanner-container { position: relative; width: 100%; max-width: 320px; margin: 0 auto; aspect-ratio: 3/4; background: #000; border-radius: 24px; overflow: hidden; border: 3px solid #1d4ed8; }
        .tab-btn.active { background-color: #1d4ed8; color: white; box-shadow: 0 4px 15px rgba(29, 78, 216, 0.4); }
        input, select, textarea { background-color: rgba(255, 255, 255, 0.7) !important; font-weight: 800; border: 1px solid rgba(0,0,0,0.15) !important; color: #000 !important; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">
    <div class="content-overlay p-4 max-w-2xl mx-auto space-y-6">
        <header class="bg-white/95 p-4 border-b-4 border-green-600 shadow-lg sticky top-0 z-50 rounded-b-2xl">
            <img src="Logo.jpg" alt="Logo GSD" class="h-16 mx-auto">
        </header>

        <section class="rounded-3xl p-4 shadow-xl bg-black/20">
            <div class="aspect-video w-full rounded-2xl overflow-hidden bg-black"><video id="videoPlayer" controls class="w-full h-full object-cover"><source src="explication.mp4" type="video/mp4"></video></div>
        </section>

        <section class="rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-600">
            <div class="flex bg-white/40 border-b border-blue-200">
                <button onclick="switchTab('scan')" id="tab-scan" class="tab-btn active flex-1 py-4 font-black uppercase text-[10px]">📷 Scanner</button>
                <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-[10px]">✍️ Manuelle</button>
                <button onclick="switchTab('hors-cat')" id="tab-hors-cat" class="tab-btn flex-1 py-4 font-black uppercase text-[10px]">📧 Hors Cat.</button>
            </div>
            
            <div class="p-6">
                <div id="form-scan" class="space-y-4">
                    <div id="scanner-container"><video id="camera-feed" autoplay playsinline muted></video></div>
                    <select id="s-domaine" onchange="actualiserSelect('s-domaine', 's-famille', 's-piece')" class="w-full p-4 rounded-xl text-sm font-bold bg-white"><option value="">-- CHOISIR UN DOMAINE --</option><option value="chassis">🚗 CHÂSSIS</option><option value="freinage">🚗 FREINAGE</option></select>
                    <select id="s-famille" disabled class="w-full p-4 rounded-xl text-sm font-bold bg-white"><option value="">-- FAMILLE --</option></select>
                    <select id="s-piece" disabled class="w-full p-4 rounded-xl text-sm font-black bg-white"><option value="">-- PIÈCE EXACTE --</option></select>
                    <button onclick="ajouterAuPanierScanner()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black uppercase">RECHERCHER & AJOUTER AU PANIER</button>
                </div>
                <div id="zone-panier" class="hidden mt-6 border-t pt-4">
                    <h3 class="text-xs font-black uppercase mb-2">🛒 MON PANIER</h3>
                    <ul id="liste-panier" class="text-xs font-bold text-left mb-2"></ul>
                    <button onclick="validerPanier()" class="w-full bg-green-600 text-white py-2 rounded-xl text-xs font-black">VALIDER MON DEVIS</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        const basePieces = { chassis: { familles: { susp: { label: "Suspension", pieces: ["Amortisseurs", "Ressorts"] } } } };
        let panier = [];

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('form-scan').classList.toggle('hidden', tab !== 'scan');
        }

        function actualiserSelect(domId, famId, pieceId) {
            const dom = document.getElementById(domId).value;
            const famSel = document.getElementById(famId);
            famSel.innerHTML = '<option value="">-- FAMILLE --</option>';
            famSel.disabled = !dom;
            if (dom && basePieces[dom]) {
                for (let k in basePieces[dom].familles) { famSel.innerHTML += `<option value="${dom}|${k}">${basePieces[dom].familles[k].label}</option>`; }
            }
        }

        function ajouterAuPanierScanner() {
            const piece = document.getElementById('s-piece').value;
            if(!piece) return alert("Sélectionnez une pièce");
            panier.push(piece);
            document.getElementById('zone-panier').classList.remove('hidden');
            document.getElementById('liste-panier').innerHTML += `<li>✅ ${piece}</li>`;
        }

        function validerPanier() {
            alert("Devis généré. Mémoire réinitialisée.");
            panier = [];
            document.getElementById('liste-panier').innerHTML = "";
            document.getElementById('zone-panier').classList.add('hidden');
        }
    </script>
</body>
</html>
