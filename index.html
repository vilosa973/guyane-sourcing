<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        section { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); }
        input { background-color: rgba(255, 255, 255, 0.3) !important; border: 1px solid rgba(255, 255, 255, 0.3) !important; color: #000 !important; font-weight: 700; }
        .tab-btn.active { background-color: #1d4ed8; color: white; border-bottom: 4px solid #1e40af; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">

    <div class="min-h-screen flex flex-col p-4">
        <header class="bg-white/95 p-4 border-b-4 border-green-600 shadow-md mb-6 rounded-2xl">
            <img src="Logo.jpg" alt="GSD" class="h-12 mx-auto">
            <p class="text-green-700 text-[10px] font-black uppercase mt-1 tracking-widest text-center">Sourcing • Logistique • Guyane</p>
        </header>

        <div class="max-w-2xl mx-auto w-full space-y-6">
            
            <section class="rounded-3xl shadow-2xl p-6 border-2 border-orange-500">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center justify-center">
                    <i class="fas fa-shield-check mr-2 text-orange-500"></i> Suivre mon dossier
                </h2>
                
                <div class="space-y-3">
                    <input type="text" id="nomRecherche" placeholder="VOTRE NOM (MAJUSCULES)" class="w-full p-4 rounded-2xl outline-none text-center uppercase">
                    <div class="flex space-x-2">
                        <input type="text" id="numDevis" placeholder="N° DEVIS (Ex: GSD...)" class="flex-1 p-4 rounded-2xl text-blue-900 font-black text-center outline-none uppercase">
                        <button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-2xl shadow-lg active:scale-95 transition">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>

                <div id="resultat" class="hidden mt-6 animate-fade-in text-center">
                    <div class="bg-slate-900/95 rounded-3xl p-6 text-white border-b-8 border-yellow-500 shadow-2xl text-center">
                        
                        <div class="space-y-4">
                            <div class="border-b border-slate-700 pb-3 text-center">
                                <p class="text-[10px] text-yellow-500 font-bold uppercase tracking-widest">Dossier N° <span id="resNumDevis">--</span></p>
                                <p class="text-xl font-black uppercase mt-1">
                                    <span id="resCivilite">--</span> <span id="resNomClient">--</span>
                                </p>
                            </div>

                            <div class="text-center">
                                <p class="text-[10px] opacity-50 uppercase">Pièce(s) commandée(s) :</p>
                                <p id="resPiece" class="font-bold text-sm text-emerald-400 uppercase">--</p>
                            </div>

                            <div class="text-center">
                                <div id="resStatut" class="inline-block px-4 py-1 rounded-full text-[10px] font-black uppercase">--</div>
                            </div>

                            <div class="py-4 border-y border-slate-800 text-center">
                                <p class="text-[10px] opacity-50 uppercase mb-1">Montant total du dossier</p>
                                <p id="resMontant" class="text-5xl font-black text-white">0.00 €</p>
                            </div>

                            <div id="zonePaiement" class="hidden pt-2 text-center">
                                <a id="btnStripe" href="#" target="_blank" class="w-full bg-emerald-600 text-white py-5 rounded-2xl font-black uppercase flex items-center justify-center gap-3 shadow-lg">
                                    <i class="fas fa-credit-card"></i> Payer ma commande
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const URL_CSV = "https://docs.google.com/spreadsheets/d/1h7cfN7f2l1U9eSxmdIlCngIK5AXUNwxNxJ-Zz8H4y2c/export?format=csv";

        async function chercherDossier() {
            const nomSaisi = document.getElementById('nomRecherche').value.trim().toUpperCase();
            const idSaisi = document.getElementById('numDevis').value.trim().toUpperCase().replace(/-/g, "");
            
            if(!nomSaisi || !idSaisi) return alert("Veuillez entrer NOM et N° DEVIS.");
            
            try {
                // nocache pour forcer la mise à jour des données
                const res = await fetch(URL_CSV + "?nocache=" + Date.now());
                const data = await res.text();
                const lignes = data.split(/\r?\n/);
                const sep = data.includes(';') ? ';' : ',';
                
                let trouve = false;
                for (let i = 1; i < lignes.length; i++) {
                    if (!lignes[i].trim()) continue;
                    
                    // Découpage propre des colonnes (A, B, C, D, E, F, G, H, I...)
                    const col = lignes[i].split(new RegExp(`${sep}(?=(?:(?:[^"]*"){2})*[^"]*$)`)).map(v => v.replace(/^"|"$/g, '').trim());
                    
                    const idTableau = col[0] ? col[0].toUpperCase().replace(/-/g, "") : "";
                    const nomTableau = col[2] ? col[2].toUpperCase() : ""; // NOM en Colonne C

                    if(idTableau === idSaisi && (nomSaisi === nomTableau || nomSaisi.includes(nomTableau))) {
                        trouve = true;
                        
                        // 1 - Numéro de devis (Colonne A)
                        document.getElementById('resNumDevis').innerText = col[0];
                        // 2 - Civilité (Colonne B)
                        document.getElementById('resCivilite').innerText = col[1];
                        // 3 - Nom & Prénom (Colonnes C & D)
                        document.getElementById('resNomClient').innerText = col[2] + " " + (col[3] || "");
                        // 4 - Pièce commandée (Colonne L / Index 11)
                        document.getElementById('resPiece').innerText = col[11] || "PIÈCES DÉTACHÉES";
                        // 5 - Statut (Colonne E / Index 4)
                        const stat = col[4] ? col[4].toUpperCase() : "ACTIF";
                        const sBox = document.getElementById('resStatut');
                        sBox.innerText = stat;
                        sBox.style.backgroundColor = (stat.includes('PAYÉ') || stat.includes('OK')) ? '#059669' : '#D97706';
                        // 6 - Montant (Colonne I / Index 8)
                        let montant = col[8] || "0.00 €";
                        document.getElementById('resMontant').innerText = montant.includes('€') ? montant : montant + " €";
                        
                        // 7 - Lien Stripe (Colonne H / Index 7)
                        const stripeL = col[7];
                        if(stripeL && stripeL.startsWith('http')) {
                            document.getElementById('btnStripe').href = stripeL;
                            document.getElementById('zonePaiement').classList.remove('hidden');
                        } else {
                            document.getElementById('zonePaiement').classList.add('hidden');
                        }

                        document.getElementById('resultat').classList.remove('hidden');
                        break;
                    }
                }
                if(!trouve) alert("Dossier introuvable. Vérifiez l'ID et votre NOM.");
            } catch(e) { alert("Erreur de connexion."); }
        }
    </script>
</body>
</html>
