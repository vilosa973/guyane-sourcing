<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Suivi de Commande</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg p-6 border-t-4 border-blue-500">
        <h1 class="text-xl font-bold text-center mb-6">GUYANE SOURCING DIRECT</h1>
        
        <div class="space-y-4">
            <input type="text" id="numDevis" placeholder="Entrez votre N° de devis" 
                   class="w-full p-3 border rounded-lg text-center font-bold">
            <button onclick="chercher()" 
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">
                CHERCHER MON DOSSIER
            </button>
        </div>

        <div id="resultat" class="hidden mt-8 space-y-4 border-t pt-4 text-center">
            <p class="text-sm text-gray-500">Client</p>
            <p id="nom" class="font-bold text-lg uppercase"></p>
            
            <p class="text-sm text-gray-500">Statut</p>
            <p id="statut" class="font-bold text-orange-500 uppercase"></p>

            <div id="zonePaiement" class="hidden pt-4">
                <a id="btnStripe" href="#" target="_blank" 
                   class="block w-full bg-green-600 text-white py-4 rounded-xl font-black text-center shadow-md hover:bg-green-700">
                    PAYER MON DEVIS
                </a>
            </div>
        </div>
    </div>

    <script>
        async function chercher() {
            const id = document.getElementById('numDevis').value.trim();
            // Ton lien Excel CSV
            const url = "https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/export?format=csv";
            
            try {
                const response = await fetch(url);
                const data = await response.text();
                const lignes = data.split('\n');

                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const devis = col[0]?.replace(/"/g, '').trim();
                    
                    if (devis === id) {
                        document.getElementById('resultat').classList.remove('hidden');
                        document.getElementById('nom').innerText = col[1]?.replace(/"/g, '').trim();
                        document.getElementById('statut').innerText = col[2]?.replace(/"/g, '').trim();
                        
                        // Vérification du lien Stripe en Colonne D
                        const lien = col[3]?.replace(/"/g, '').trim();
                        if (lien && lien.startsWith('http')) {
                            document.getElementById('zonePaiement').classList.remove('hidden');
                            document.getElementById('btnStripe').href = lien;
                        } else {
                            document.getElementById('zonePaiement').classList.add('hidden');
                        }
                        return;
                    }
                }
                alert("Dossier introuvable");
            } catch (e) {
                alert("Erreur de connexion au tableau");
            }
        }
    </script>
</body>
</html>
