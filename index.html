<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <header class="bg-white shadow-md p-6 text-center">
        <h1 class="text-3xl font-extrabold text-blue-700">GUYANE SOURCING DIRECT</h1>
        <p class="text-gray-500 text-sm mt-1">Sourcing • Logistique • Accompagnement</p>
    </header>

    <div class="max-w-2xl mx-auto p-4 space-y-8">

        <section class="bg-white rounded-2xl shadow-xl p-6 border-t-4 border-blue-600">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center">
                <i class="fas fa-file-invoice-dollar mr-2 text-blue-600"></i> Demande de Devis Gratuit
            </h2>
            <form action="https://formspree.io/f/xvgzlowj" method="POST" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" name="nom" placeholder="Votre Nom" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <input type="tel" name="telephone" placeholder="Téléphone (ex: 0694...)" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <input type="email" name="email" placeholder="Votre Email" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <textarea name="description" placeholder="Détaillez votre besoin (Produits, quantités, liens...)" rows="4" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                
                <button type="submit" class="w-full bg-blue-700 text-white py-4 rounded-xl font-bold text-lg hover:bg-blue-800 transition shadow-lg transform hover:scale-[1.02]">
                    <i class="fas fa-paper-plane mr-2"></i> Envoyer ma demande
                </button>
            </form>
        </section>

        <section class="bg-white rounded-2xl shadow-xl p-6 border-t-4 border-orange-500">
            <h2 class="text-xl font-bold text-gray-800 mb-2 flex items-center">
                <i class="fas fa-search-location mr-2 text-orange-500"></i> Suivi de votre dossier
            </h2>
            <p class="text-xs text-gray-500 mb-4 font-medium italic">Consultez l'avancement de votre commande en temps réel.</p>
            
            <div class="flex space-x-2 mb-4">
                <input type="text" id="numDevis" placeholder="N° de Devis (ex: 01300426)" class="flex-1 p-3 border-2 border-gray-200 rounded-lg focus:border-orange-500 outline-none font-bold text-gray-700">
                <button onclick="chercherDossier()" class="bg-orange-500 text-white px-5 py-3 rounded-lg hover:bg-orange-600 transition">
                    <i class="fas fa-search text-xl"></i>
                </button>
            </div>

            <div id="resultat" class="hidden animate-fade-in bg-gray-50 p-4 rounded-xl border border-gray-200">
                <p class="text-[10px] text-gray-400 uppercase font-black mb-1">Dossier client</p>
                <p id="nomClient" class="text-lg font-bold text-gray-800 mb-3 border-b pb-2">-</p>

                <p class="text-[10px] text-gray-400 uppercase font-black mb-1">État actuel</p>
                <div id="statut" class="inline-block px-4 py-2 rounded-lg text-white font-black text-sm shadow-md mb-4 uppercase tracking-wider">
                    -
                </div>

                <div id="infoLogistique" class="mt-2 p-3 bg-white border rounded-lg shadow-inner">
                    <p id="infoColis" class="text-xs text-gray-600 font-bold mb-2"></p>
                    <div id="lienSuivi"></div>
                </div>
            </div>
        </section>

        <a href="https://wa.me/594694200000" class="flex items-center justify-center space-x-3 bg-green-500 text-white p-4 rounded-2xl font-bold shadow-xl hover:bg-green-600 transition transform hover:scale-[1.02]">
            <i class="fab fa-whatsapp text-3xl"></i>
            <div class="text-left leading-tight">
                <span class="block text-sm opacity-90 font-medium">Une question urgente ?</span>
                <span class="text-lg uppercase">Contactez-nous ici</span>
            </div>
        </a>

    </div>

    <script>
        // LIEN VERS TON GOOGLE SHEET
        const linkPrivé = "https://docs.google.com/spreadsheets/d/1iSZUCUMXn5YioZt6P_PqLCvYkuo6px_6/edit";
        const urlCSV = linkPrivé.replace('/edit', '/export?format=csv');

        async function chercherDossier() {
            const idRecherche = document.getElementById('numDevis').value.trim();
            const res = document.getElementById('resultat');
            
            if(!idRecherche) return;

            try {
                const response = await fetch(urlCSV);
                const data = await response.text();
                const lignes = data.split('\n').map(l => l.split(','));
                const dossiers = {};
                
                for (let i = 1; i < lignes.length; i++) {
                    const [id, client, statut, details, suivi] = lignes[i];
                    if(id) {
                        const cleanId = id.replace(/"/g, '').trim();
                        dossiers[cleanId] = { 
                            nom: client ? client.replace(/"/g, '') : "", 
                            statut: statut ? statut.replace(/"/g, '') : "En cours", 
                            details: details ? details.replace(/"/g, '') : "", 
                            suivi: suivi ? suivi.replace(/"/g, '').trim() : "" 
                        };
                    }
                }

                const dossier = dossiers[idRecherche];

                if (dossier) {
                    res.classList.remove('hidden');
                    document.getElementById('nomClient').innerText = dossier.nom + (dossier.details ? " — " + dossier.details : "");
                    document.getElementById('statut').innerText = dossier.statut;
                    
                    let st = dossier.statut.toLowerCase();
                    let couleur = "#3b82f6"; // Bleu
                    if(st.includes("attente") || st.includes("paiement")) couleur = "#f59e0b"; // Orange
                    if(st.includes("payé") || st.includes("expédié") || st.includes("reçu")) couleur = "#10b981"; // Vert
                    
                    document.getElementById('statut').style.backgroundColor = couleur;
                    
                    if (dossier.suivi && dossier.suivi.length > 5) {
                        document.getElementById('infoColis').innerText = "Numéro de suivi disponible :";
                        document.getElementById('lienSuivi').innerHTML = `
                            <a href="https://www.17track.net/fr/track?nums=${dossier.suivi}" target="_blank" class="block w-full bg-blue-700 text-white text-center py-3 rounded-lg font-bold text-sm uppercase shadow hover:bg-blue-800 transition">
                                <i class="fas fa-shipping-fast mr-2"></i> Suivre sur 17TRACK
                            </a>`;
                    } else {
                        document.getElementById('infoColis').innerText = "Veuillez patienter pour le numéro de suivi.";
                        document.getElementById('lienSuivi').innerHTML = "";
                    }
                } else {
                    alert("Numéro " + idRecherche + " introuvable. Vérifiez votre tableau.");
                }
            } catch (error) {
                alert("Erreur de connexion. Vérifiez la publication de votre tableau.");
            }
        }
    </script>
</body>
</html>
