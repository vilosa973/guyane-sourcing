<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-image: url('Font_Premium.jpg'); background-size: cover; background-position: center; background-attachment: fixed; background-color: #1a1a1a; }
        .content-overlay { position: relative; z-index: 1; min-height: 100vh; }
        section { backdrop-filter: blur(12px); background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.2); transition: all 0.3s ease; }
        input, textarea, select { background-color: rgba(255, 255, 255, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.4) !important; color: #000 !important; font-weight: 800; }
        .tab-btn.active { background-color: #1d4ed8; color: white; border-bottom: 4px solid #1e40af; }
        .grid-manual { display: flex; flex-direction: column; gap: 12px; }
        .manual-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body class="font-sans antialiased text-slate-900 text-center">

    <div class="content-overlay flex flex-col">
        <header class="bg-white/95 p-4 border-b-4 border-green-600 shadow-md sticky top-0 z-50 text-center">
            <img src="Logo.jpg" alt="Logo GSD" class="h-16 mx-auto">
            <p class="text-green-700 text-[10px] font-black uppercase mt-1 tracking-widest text-center">Sourcing • Logistique • Agricole • Auto</p>
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full mt-6">

            <section class="rounded-3xl shadow-2xl overflow-hidden border-2 border-blue-600">
                <div class="flex bg-white/50 border-b border-blue-200">
                    <button onclick="switchTab('photo')" id="tab-photo" class="tab-btn active flex-1 py-4 font-black uppercase text-xs text-center">📷 Photo Carte Grise</button>
                    <button onclick="switchTab('modele')" id="tab-modele" class="tab-btn flex-1 py-4 font-black uppercase text-xs text-center">✍️ Saisie Manuelle</button>
                </div>
                
                <div class="p-6 space-y-6">
                    <div id="form-photo" class="space-y-4">
                        <label class="w-full flex flex-col items-center justify-center p-8 border-2 border-dashed border-blue-500 rounded-2xl bg-white/50 cursor-pointer">
                            <i class="fas fa-camera text-4xl text-blue-600 mb-2"></i>
                            <span class="text-sm font-black uppercase">Scanner ma Carte Grise</span>
                            <input type="file" accept="image/*" id="input-cg" class="hidden" onchange="previewCG(this)">
                        </label>
                        <div id="cg-status" class="hidden text-xs font-bold text-green-700 uppercase">Image chargée avec succès</div>
                    </div>
                    
                    <div id="form-modele" class="hidden grid-manual">
                        <div class="manual-row">
                            <input type="text" id="m-immatriculation" placeholder="IMMATRICULATION" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                            <input type="text" id="m-vin" placeholder="N° VIN (CHÂSSIS)" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                        </div>
                        <div class="manual-row">
                            <input type="text" id="m-marque" placeholder="MARQUE" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                            <input type="text" id="m-modele" placeholder="MODÈLE" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                        </div>
                        <div class="manual-row">
                            <input type="text" id="m-moteur" placeholder="MOTORISATION" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                            <input type="number" id="m-annee" placeholder="ANNÉE" class="w-full p-4 rounded-xl text-sm text-center uppercase">
                        </div>
                    </div>

                    <div class="space-y-4 border-t border-blue-100 pt-6 text-left">
                        <div>
                            <label class="block text-xs font-black uppercase tracking-wider text-blue-900 mb-1">1. Domaine Général</label>
                            <select id="gsd-generique" onchange="actualiserFamilles()" class="w-full p-4 rounded-xl text-sm font-bold bg-white">
                                <option value="">-- Choisir un domaine --</option>
                                <option value="chassis">1. Châssis & Freinage</option>
                                <option value="moteur">2. Moteur & Technique</option>
                                <option value="electricite">3. Électricité & Visibilité</option>
                                <option value="transmission">4. Transmission & Fluides</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-black uppercase tracking-wider text-blue-900 mb-1">2. Famille / Sous-Domaine</label>
                            <select id="gsd-famille" onchange="actualiserPieces()" disabled class="w-full p-4 rounded-xl text-sm font-bold bg-white disabled:opacity-50">
                                <option value="">-- Sélectionnez d'abord le domaine --</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-black uppercase tracking-wider text-blue-900 mb-1">3. Pièce exacte</label>
                            <select id="gsd-piece" disabled class="w-full p-4 rounded-xl text-sm font-black bg-white disabled:opacity-50">
                                <option value="">-- Sélectionnez d'abord la famille --</option>
                            </select>
                        </div>

                        <button id="bouton-statut" onclick="rechercheIA()" class="w-full mt-4 bg-slate-900 text-white py-5 rounded-2xl font-black uppercase shadow-lg flex items-center justify-center gap-3 transition active:scale-95">
                            <i class="fas fa-microchip"></i> RECHERCHE
                        </button>
                    </div>

                    <div id="ai-resultat" class="hidden mt-4">
                        <div id="ai-loading" class="py-8 bg-white/80 rounded-2xl text-center"><i class="fas fa-sync fa-spin text-blue-700 text-3xl"></i></div>
                        <div id="ai-content" class="hidden space-y-4 text-left">
                            <div id="offres-container"></div>
                        </div>
                    </div>
                </div>
            </section>

            <div id="zone-panier" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 w-full max-w-md px-4 z-50">
                <div class="bg-slate-950 text-white p-4 rounded-3xl shadow-2xl border-2 border-emerald-500 space-y-3 flex flex-col">
                    <div class="flex justify-between items-center border-b border-white/10 pb-2">
                        <p class="font-black text-sm uppercase tracking-wide text-emerald-400"><i class="fas fa-shopping-basket mr-1"></i> Mon Panier GSD (<span id="panier-compteur">0</span>)</p>
                        <button onclick="viderPanier()" class="text-[10px] uppercase font-black text-red-400 hover:underline">Vider</button>
                    </div>
                    <div id="panier-liste-articles" class="max-h-24 overflow-y-auto space-y-1 text-left text-[11px] font-bold text-slate-300 pr-1"></div>
                    <div class="flex justify-between items-center border-t border-white/10 pt-2">
                        <p class="text-[10px] text-slate-400 uppercase font-black">Total global :</p>
                        <p id="panier-total" class="text-2xl font-black text-emerald-400">0.00 €</p>
                    </div>
                    <button onclick="procederAuPaiement()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-black uppercase text-xs shadow-lg tracking-wider flex items-center justify-center gap-2 transition">
                        <i class="fas fa-lock"></i> Procéder au paiement sécurisé
                    </button>
                </div>
            </div>

            <section class="rounded-3xl shadow-2xl p-4 border-l-8 border-emerald-500 overflow-hidden">
                <div class="rounded-2xl overflow-hidden shadow-inner bg-black aspect-video">
                    <video controls class="w-full h-full object-cover"><source src="explication.mp4" type="video/mp4"></video>
                </div>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 text-center">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4"><i class="fas fa-file-invoice-dollar mr-3 text-blue-700"></i> Demande de Devis manuel</h2>
                <form action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4">
                    <select name="civilite" required class="w-full p-4 rounded-2xl outline-none text-center">
                        <option value="Monsieur">Monsieur</option>
                        <option value="Madame">Madame</option>
                    </select>
                    <div class="manual-row">
                        <input type="text" name="nom" placeholder="NOM" required class="p-4 rounded-2xl outline-none uppercase text-center">
                        <input type="text" name="prenom" placeholder="PRÉNOM" required class="p-4 rounded-2xl outline-none text-center">
                    </div>
                    <input type="text" name="plaque" placeholder="PLAQUE D'IMMATRICULATION" class="w-full p-4 rounded-2xl outline-none uppercase text-center">
                    <input type="email" name="email" placeholder="VOTRE EMAIL" required class="w-full p-4 rounded-2xl outline-none text-center">
                    <textarea name="description" placeholder="VOTRE DEMANDE S'IL MANQUE UNE PIÈCE..." rows="3" required class="w-full p-4 rounded-2xl outline-none text-center"></textarea>
                    <button type="submit" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black uppercase shadow-lg">Envoyer ma demande</button>
                </form>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 border-2 border-orange-500">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center justify-center"><i class="fas fa-shield-check mr-3 text-orange-500"></i> Suivre mon dossier</h2>
                <div class="space-y-3">
                    <input type="text" id="nomRecherche" placeholder="NOM DU CLIENT (MAJUSCULES)" class="w-full p-4 rounded-2xl outline-none text-center uppercase font-black">
                    <div class="flex space-x-2">
                        <input type="text" id="numDevis" placeholder="N° DE DEVIS" class="flex-1 p-4 rounded-2xl text-blue-900 font-black text-center outline-none uppercase">
                        <button onclick="chercherDossier()" class="bg-orange-500 text-white px-6 py-4 rounded-2xl shadow-lg active:scale-95 transition"><i class="fas fa-search"></i></button>
                    </div>
                </div>
                
                <div id="resultat" class="hidden mt-6 text-center">
                    <div class="bg-slate-900/95 rounded-3xl p-6 text-white border-b-8 border-yellow-500 shadow-2xl space-y-6">
                        <div class="border-b border-slate-700 pb-3">
                            <p class="text-[10px] text-yellow-500 font-bold uppercase">Devis N° <span id="resNumDevis"></span></p>
                            <p class="text-xl font-black uppercase mt-1"><span id="resCivilite"></span> <span id="resNomClient"></span></p>
                        </div>
                        <div id="resMontant" class="py-4 border-y border-slate-800 text-5xl font-black text-white"></div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const URL_CSV = "https://docs.google.com/spreadsheets/d/1h7cfN7f2l1U9eSxmdIlCngIK5AXUNwxNxJ-Zz8H4y2c/export?format=csv";
        
        // 🛑 LIEN DE DEPLOIEMENT APPS SCRIPT
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwt8JcKCe7NP1tdbeQToisn6YA-U7z33etQtd8ZFBeoaqMxD81N-AHIo7nLfiqGwr4G/exec";
        
        let donneesDernierVehicule = null;
        let panierArticlesTableau = [];

        const basePiecesGSD = {
            chassis: {
                label: "Châssis & Freinage",
                familles: {
                    freinage: { label: "Freinage", pieces: ["Plaquettes de frein", "Disques de frein", "Étriers de frein", "Flexible de frein", "Maître-cylindre"] },
                    suspension: { label: "Suspension & Amortissement", pieces: ["Amortisseurs", "Ressorts de suspension", "Triangle de suspension"] },
                    direction: { label: "Direction & Roulement", pieces: ["Rotule de direction", "Biellette stabilisatrice", "Roulement de roue"] }
                }
            },
            moteur: {
                label: "Moteur & Technique",
                familles: {
                    distribution: { label: "Distribution & Courroies", pieces: ["Courroie de distribution", "Pompe à eau", "Courroie d'accessoire"] },
                    injection: { label: "Carburation & Injection", pieces: ["Injecteur", "Pompe à carburant", "Turbocompresseur"] },
                    echappement: { label: "Échappement & Antipollution", pieces: ["Silencieux d'échappement", "Catalyseur", "Vanne EGR", "Filtre à particules (FAP)"] }
                }
            },
            electricite: {
                label: "Électricité & Visibilité",
                familles: {
                    demarrage: { label: "Démarrage & Énergie", pieces: ["Batterie", "Alternateur", "Démarreur", "Bougies d'allumage"] },
                    eclairage: { label: "Éclairage & Signalisation", pieces: ["Phare avant", "Feu arrière", "Ampoule de phare"] },
                    essuyage: { label: "Essuyage & Habitacle", pieces: ["Balais d'essuie-glace", "Moteur d'essuie-glace", "Filtre d'habitacle"] }
                }
            },
            transmission: {
                label: "Transmission & Fluides",
                familles: {
                    embrayage: { label: "Embrayage & Boîte", pieces: ["Kit d'embrayage", "Volant moteur", "Cardan"] },
                    fluides: { label: "Entretien & Filtration", pieces: ["Liquide de refroidissement", "Huile moteur", "Filtre à huile", "Filtre à air"] }
                }
            }
        };

        function actualiserFamilles() {
            const generiqueSel = document.getElementById("gsd-generique").value;
            const familleSelect = document.getElementById("gsd-famille");
            const pieceSelect = document.getElementById("gsd-piece");
            familleSelect.innerHTML = '<option value="">-- Choisir la famille --</option>';
            pieceSelect.innerHTML = '<option value="">-- Sélectionnez d\'abord la famille --</option>';
            pieceSelect.disabled = true;
            if (generiqueSel && basePiecesGSD[generiqueSel]) {
                familleSelect.disabled = false;
                const familles = basePiecesGSD[generiqueSel].familles;
                for (let cle in familles) { familleSelect.innerHTML += `<option value="${generiqueSel}|${cle}">${familles[cle].label}</option>`; }
            } else { familleSelect.disabled = true; }
        }

        function actualiserPieces() {
            const familleValeur = document.getElementById("gsd-famille").value;
            const pieceSelect = document.getElementById("gsd-piece");
            pieceSelect.innerHTML = '<option value="">-- Choisir la pièce --</option>';
            if (familleValeur) {
                pieceSelect.disabled = false;
                const [genKey, famKey] = familleValeur.split('|');
                basePiecesGSD[genKey].familles[famKey].pieces.forEach(p => { pieceSelect.innerHTML += `<option value="${p}">${p}</option>`; });
            } else { pieceSelect.disabled = true; }
        }

        function switchTab(tab) {
            document.getElementById('tab-photo').classList.toggle('active', tab === 'photo');
            document.getElementById('tab-modele').classList.toggle('active', tab === 'modele');
            document.getElementById('form-photo').classList.toggle('hidden', tab !== 'photo');
            document.getElementById('form-modele').classList.toggle('hidden', tab !== 'modele');
        }

        function previewCG(input) { if(input.files[0]) { document.getElementById('cg-status').classList.remove('hidden'); } }

        async function rechercheIA() {
            const piece = document.getElementById('gsd-piece').value;
            const resultBox = document.getElementById('ai-resultat');
            const loadingBox = document.getElementById('ai-loading');
            const contentBox = document.getElementById('ai-content');
            const container = document.getElementById('offres-container');
            const inputCG = document.getElementById('input-cg');

            if (!piece || piece === "") return alert("Veuillez sélectionner une pièce.");

            resultBox.classList.remove('hidden');
            loadingBox.classList.remove('hidden');
            contentBox.classList.add('hidden');

            const formData = new FormData();
            formData.append('piece', piece);

            // Correction totale du blocage au clic : Envoi sécurisé
            if (donneesDernierVehicule && donneesDernierVehicule.vehicule && donneesDernierVehicule.vehicule.includes(" | ")) {
                const parts = donneesDernierVehicule.vehicule.split(" | ");
                const mm = parts[0].split(" ");
                formData.append('marque', mm[0] || "");
                formData.append('modele', mm[1] || "");
                formData.append('annee', parts[1] || "");
                formData.append('moteur', parts[2] || "");
                await envoyerDemandePOST(formData, loadingBox, contentBox, container, piece);
                return;
            }

            if (document.getElementById('tab-photo').classList.contains('active') && inputCG.files[0]) {
                const reader = new FileReader();
                reader.readAsDataURL(inputCG.files[0]);
                reader.onloadend = async () => {
                    formData.append('image', reader.result.split(',')[1]);
                    await envoyerDemandePOST(formData, loadingBox, contentBox, container, piece);
                };
            } else {
                formData.append('marque', document.getElementById('m-marque').value.trim());
                formData.append('modele', document.getElementById('m-modele').value.trim());
                formData.append('moteur', document.getElementById('m-moteur').value.trim());
                formData.append('annee', document.getElementById('m-annee').value.trim());
                await envoyerDemandePOST(formData, loadingBox, contentBox, container, piece);
            }
        }

        async function envoyerDemandePOST(formData, loading, content, container, nomPiece) {
            try {
                const response = await fetch(URL_WEB_APP, { method: 'POST', body: new URLSearchParams(formData) });
                const json = await response.json();
                loading.classList.add('hidden');
                content.classList.remove('hidden');
                
                donneesDernierVehicule = json; 
                
                let html = `
                    <div class="p-4 bg-slate-900 text-white rounded-2xl mb-4 text-center border-b-4 border-blue-600 shadow-lg">
                        <p class="text-xs uppercase text-blue-400 font-black tracking-wider mb-1">🚗 Fiche Véhicule Validée par Jarvis</p>
                        <h3 class="text-xl font-black text-white uppercase">${json.vehicule || 'VÉHICULE IDENTIFIÉ'}</h3>
                    </div>
                    <div class="space-y-3">`;

                if(json.offres && json.offres.length > 0) {
                    json.offres.forEach(offre => {
                        let bColor = "bg-green-600";
                        if (offre.type.includes("Premium")) bColor = "bg-indigo-700 border border-indigo-400";
                        if (offre.type.includes("Pro")) bColor = "bg-blue-600";
                        if (offre.type.includes("Grade A+")) bColor = "bg-amber-600 text-black";
                        if (offre.type.includes("Grade B")) bColor = "bg-amber-500 text-black";

                        html += `
                            <div class="bg-white/95 p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                                <div class="text-center md:text-left space-y-1 w-full md:w-auto">
                                    <span class="inline-block px-3 py-0.5 rounded-full text-[9px] font-black uppercase ${bColor} text-white mb-1">${offre.type}</span>
                                    <h4 class="text-base font-black text-slate-900 uppercase">${nomPiece.toUpperCase()}</h4>
                                    <p class="text-xs font-bold text-slate-700">Gamme : <span class="font-black text-blue-700">${offre.marque_piece}</span></p>
                                    <p class="text-xs font-bold text-slate-700">Réf : <span class="font-black text-slate-900">${offre.reference_article}</span></p>
                                    <p class="text-[11px] text-slate-600 font-bold"><i class="fas fa-truck text-blue-500 mr-1"></i> Livraison : (${offre.delai})</p>
                                </div>
                                <div class="text-center md:text-right flex md:flex-col items-center justify-between w-full md:w-auto gap-4 border-t md:border-t-0 pt-3 md:pt-0">
                                    <div>
                                        <p class="text-2xl font-black text-slate-900">${offre.prix} €</p>
                                    </div>
                                    <button onclick="ajouterAuPanier('${encodeURIComponent(nomPiece)}', '${offre.marque_piece}', '${offre.prix}', '${offre.type}')" class="bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-black uppercase px-4 py-2.5 rounded-xl shadow-md transition">
                                        <i class="fas fa-plus-circle"></i> Sélectionner
                                    </button>
                                </div>
                            </div>`;
                    });
                } else {
                    html += `<div class="p-4 bg-white rounded-xl font-bold text-center text-slate-700 uppercase">Aucune offre disponible actuellement.</div>`;
                }
                
                html += `</div>`;
                container.innerHTML = html;
                
            } catch (e) {
                loading.classList.add('hidden');
                container.innerHTML = `<div class="p-4 bg-red-500/10 border-2 border-red-500 rounded-xl text-center font-bold text-red-900 uppercase">Ajustement réseau en cours... Relancez la recherche.</div>`;
            }
        }

        function ajouterAuPanier(piece, marque, prix, type) {
            panierArticlesTableau.push({ nom: decodeURIComponent(piece), marque: marque, prix: parseFloat(prix), type: type });
            mettreAJourRenduPanier();
        }

        function mettreAJourRenduPanier() {
            const listeContainer = document.getElementById('panier-liste-articles');
            const compteur = document.getElementById('panier-compteur');
            const totalBox = document.getElementById('panier-total');
            listeContainer.innerHTML = "";
            let total = 0;
            panierArticlesTableau.forEach((art) => {
                total += art.prix;
                listeContainer.innerHTML += `
                    <div class="flex justify-between items-center bg-white/5 p-1.5 rounded-lg border border-white/5">
                        <span class="truncate max-w-[240px] uppercase text-slate-200">🔹 ${art.nom} [${art.type}]</span>
                        <span class="text-emerald-400 font-bold">${art.prix.toFixed(2)} €</span>
                    </div>`;
            });
            compteur.innerText = panierArticlesTableau.length;
            totalBox.innerText = `${total.toFixed(2)} €`;
            document.getElementById('zone-panier').classList.toggle('hidden', panierArticlesTableau.length === 0);
        }

        function viderPanier() { panierArticlesTableau = []; mettreAJourRenduPanier(); }
        
        function procederAuPaiement() {
            let rapport = "🛒 Commande GSD :\n";
            panierArticlesTableau.forEach(a => { rapport += `▪️ ${a.nom} (${a.type}) -> ${a.prix}€\n`; });
            window.open(`https://wa.me/33699337803?text=${encodeURIComponent(rapport)}`, '_blank');
        }

        // 🌟 RESTAURATION FONCTION CHERCHER DOSSIER DEVIS 🌟
        async function chercherDossier() {
            const nomS = document.getElementById('nomRecherche').value.trim().toUpperCase();
            const idS = document.getElementById('numDevis').value.trim().toUpperCase().replace("GSD", "").replace(/[- ]/g, "");
            try {
                const res = await fetch(URL_CSV + "&v=" + Date.now());
                const data = await res.text();
                const lignes = data.split(/\r?\n/);
                const sep = data.includes(';') ? ';' : ',';
                let tr = false;
                for (let i = 1; i < lignes.length; i++) {
                    const col = lignes[i].split(new RegExp(`${sep}(?=(?:(?:[^"]*"){2})*[^"]*$)`)).map(v => v.replace(/^"|"$/g, '').trim());
                    if (col.length < 5) continue;
                    const idTab = col[0].toUpperCase().replace("GSD", "").replace(/[- ]/g, "");
                    if(idTab === idS && (nomS === (col[2]||"").toUpperCase())) {
                        tr = true;
                        document.getElementById('resNumDevis').innerText = col[0];
                        document.getElementById('resNomClient').innerText = col[2] + " " + (col[3] || "");
                        document.getElementById('resCivilite').innerText = col[1];
                        document.getElementById('resMontant').innerText = col[8] || "0.00 €";
                        document.getElementById('resultat').classList.remove('hidden');
                        break;
                    }
                }
                if(!tr) alert("Dossier introuvable.");
            } catch(e) { alert("Erreur réseau."); }
        }
    </script>
</body>
</html>
