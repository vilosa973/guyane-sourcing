<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guyane Sourcing Direct | Officiel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-image: url('Font_Premium.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-color: #1a1a1a;
        }

        /* EFFET VERRE ULTRA LÉGER */
        section {
            backdrop-filter: blur(8px); /* Flou artistique pour voir les formes derrière */
            background-color: rgba(255, 255, 255, 0.4) !important; /* Très transparent */
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        /* RENDRE LES CASES DE SAISIE ÉGALEMENT TRANSPARENTES */
        input, textarea {
            background-color: rgba(255, 255, 255, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            color: #000 !important;
        }

        input::placeholder, textarea::placeholder {
            color: #4b5563; /* Gris foncé pour que ça reste lisible */
            font-weight: bold;
        }

        header {
            background-color: rgba(255, 255, 255, 0.9) !important;
        }
    </style>
</head>
<body class="font-sans antialiased text-slate-900">

    <div class="flex flex-col min-h-screen">
        
        <header class="p-4 text-center border-b-4 border-green-600 shadow-md sticky top-0 z-50">
            <img src="Logo.jpg" alt="Logo" class="h-16 mx-auto">
        </header>

        <div class="max-w-2xl mx-auto p-4 space-y-6 flex-grow w-full mt-6">

            <section class="rounded-3xl shadow-2xl p-6">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center border-b-2 border-blue-700 pb-2">
                    <i class="fas fa-file-invoice-dollar mr-3 text-blue-700"></i> Demande de Devis
                </h2>
                <form action="https://formspree.io/f/meenjkyj" method="POST" class="space-y-4">
                    <input type="text" name="nom" placeholder="Votre Nom complet" required class="w-full p-4 rounded-2xl font-bold outline-none focus:border-blue-700">
                    <button type="submit" class="w-full bg-blue-700 text-white py-4 rounded-2xl font-black uppercase shadow-lg hover:bg-blue-800 transition-all">Envoyer</button>
                </form>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 border-l-8 border-emerald-500">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-6 flex items-center">
                    <i class="fas fa-play-circle mr-3 text-emerald-600"></i> Comment ça marche ?
                </h2>
                
                <div class="grid grid-cols-3 gap-2 text-center mb-6">
                    <div class="text-[9px] font-black uppercase text-gray-800"><i class="fas fa-edit text-emerald-600 block text-lg mb-1"></i>Devis</div>
                    <div class="text-[9px] font-black uppercase text-gray-800"><i class="fas fa-credit-card text-emerald-600 block text-lg mb-1"></i>Paiement</div>
                    <div class="text-[9px] font-black uppercase text-gray-800"><i class="fas fa-truck-loading text-emerald-600 block text-lg mb-1"></i>Livraison</div>
                </div>

                <div class="rounded-2xl overflow-hidden bg-black aspect-video border-4 border-white/50 shadow-inner">
                    <video controls class="w-full h-full">
                        <source src="explication.mp4" type="video/mp4">
                    </video>
                </div>
            </section>

            <section class="rounded-3xl shadow-2xl p-6 border-2 border-orange-500">
                <h2 class="text-xl font-black text-slate-800 uppercase mb-4 flex items-center">
                    <i class="fas fa-shield-check mr-3 text-orange-500"></i> Espace Client Sécurisé
                </h2>
                </section>

        </div>
    </div>
</body>
</html>
