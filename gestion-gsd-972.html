<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSD Admin | Logiciel Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .bg-gsd { background-color: #0f172a; }
        #devis-a-imprimer {
            color: #000000 !important;
            background-color: #ffffff !important;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #devis-a-imprimer * { color: #000000 !important; }
        #content-admin { display: none; }
    </style>
</head>
<body class="bg-gsd text-white font-sans p-4 pb-20">

    <script>
        (function() {
            const mdpAttendu = "Martinique972";
            let saisie = prompt("ACCÈS ADMINISTRATEUR GSD\nVeuillez saisir le mot de passe :");
            if (saisie === mdpAttendu) {
                document.addEventListener("DOMContentLoaded", function() {
                    document.getElementById('content-admin').style.display = 'block';
                });
            } else {
                alert("Accès refusé.");
                window.location.href = "index.html";
            }
        })();
    </script>

    <div id="content-admin" class="max-w-2xl mx-auto space-y-6">
        <header class="text-center py-4">
            <h1 class="text-3xl font-black text-emerald-400 uppercase tracking-tighter italic">GSD | LOGICIEL ADMIN</h1>
            <p class="text-slate-400 text-[10px] uppercase tracking-widest">Guyane Sourcing Direct - Version Pro</p>
        </header>

        <div class="bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-700 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="prenomClient" placeholder="Prénom" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-emerald-500 text-sm" oninput="calculerDevis()">
                <input type="text" id="nomClient" placeholder="NOM" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-emerald-500 text-sm" oninput="calculerDevis()">
            </div>
            <input type="text" id="adresseClient" placeholder="Adresse / Ville" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-emerald-500 text-sm" oninput="calculerDevis()">
            
            <div class="flex gap-2">
                <input type="url" id="lienPiece" placeholder="Lien de la pièce..." class="flex-1 p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-emerald-500 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="relative">
                    <input type="number" id="prixAchat" oninput="calculerDevis()" placeholder="Prix Achat" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl font-bold text-xl outline-none text-emerald-400">
                    <span class="absolute right-4 top-5 text-slate-600 font-bold">€</span>
                </div>
                <select id="fraisPort" onchange="calculerDevis()" class="w-full p-4 bg-slate-700 border border-slate-600 rounded-2xl font-bold text-sm outline-none">
                    <option value="30">Petit Colis (30€)</option>
                    <option value="150">Moyen Colis (150€)</option>
                    <option value="450">Gros / Bâche (450€)</option>
                </select>
            </div>

            <div class="grid grid-cols-1 gap-2 pt-2">
                <button onclick="genererPDF()" class="bg-blue-600 p-5 rounded-2xl font-black text-sm flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
                    <i class="fas fa-file-pdf text-xl"></i> TÉLÉCHARGER LE PDF
                </button>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btnEnregistrer" onclick="enregistrerDevis()" class="bg-emerald-600 p-4 rounded-2xl font-bold text-xs uppercase tracking-tighter text-white">Enregistrer & Archiver</button>
                    <button onclick="partagerWhatsApp()" class="bg-[#25D366] p-4 rounded-2xl font-bold text-xs uppercase tracking-tighter text-slate-900">WhatsApp</button>
                </div>
            </div>
        </div>

        <div id="devis-a-imprimer">
            <div style="display: flex; justify-content: space-between; border-bottom: 3px solid #059669; padding-bottom: 20px; margin-bottom: 30px;">
                <div>
                    <img src="Logo.jpg" style="height: 60px; margin-bottom: 10px;">
                    <p style="font-size: 14px; font-weight: 900; color: #059669; text-transform: uppercase; margin: 0;">Guyane Sourcing Direct</p>
                </div>
                <div style="text-align: right;">
                    <h2 style="font-size: 26px; font-weight: 900; margin: 0;">DEVIS</h2>
                    <p style="font-size: 14px; font-weight: bold; color: #333; margin: 5px 0;">N° <span id="numDevisDisplay">...</span></p>
                    <p style="font-size: 11px; color: #999; margin: 0;">Édité le <span id="dateDevis">--/--/----</span></p>
                </div>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-bottom: 40px;">
                <div style="width: 280px; padding: 20px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;">
                    <p id="clientNomPdf" style="font-weight: 900; font-size: 15px; margin: 0; text-transform: uppercase; color: #1e293b;">--</p>
                    <p id="clientAdPdf" style="font-size: 12px; color: #64748b; margin-top: 4px; font-style: italic;">--</p>
                </div>
            </div>
            <table style="width: 100%; border-collapse: collapse; margin-bottom: 40px;">
                <thead>
                    <tr style="background: #f1f5f9;">
                        <th style="padding: 12px; border: 1px solid #e2e8f0; text-align: left;">Prestations</th>
                        <th style="padding: 12px; border: 1px solid #e2e8f0; text-align: center; width: 140px;">Montant TTC</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="padding: 15px; border: 1px solid #e2e8f0;">Fourniture de pièces détachées automobiles</td>
                        <td id="displayVente" style="padding: 15px; border: 1px solid #e2e8f0; text-align: center; font-weight: 900;">0.00 €</td>
                    </tr>
                    <tr>
                        <td style="padding: 15px; border: 1px solid #e2e8f0;">Services logistiques et expédition Guyane</td>
                        <td id="displayPort" style="padding: 15px; border: 1px solid #e2e8f0; text-align: center; font-weight: 900;">30.00 €</td>
                    </tr>
                </tbody>
            </table>
            <div style="text-align: right; border-top: 5px solid #059669; padding-top: 15px;">
                <p style="font-size: 34px; font-weight: 900; color: #059669; margin: 0;" id="displayTotal">0.00 €</p>
            </div>
        </div>

        <div class="bg-slate-800/50 p-6 rounded-3xl border border-slate-700">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xs font-bold text-slate-500 uppercase italic">Liste des Devis Cloud</h2>
                <button onclick="chargerCloud()" class="text-[10px] bg-emerald-600 px-3 py-1 rounded-full font-bold">ACTUALISER</button>
            </div>
            <div id="historique" class="space-y-3 mb-4 text-center"></div>
        </div>
    </div>

    <script>
        const URL_ZAPIER = "https://hooks.zapier.com/hooks/catch/27518535/4ytrv6b/";
        const URL_CSV = "https://docs.google.com/spreadsheets/d/1h7cfN7f2l1U9eSxmdIlCngIK5AXUNwxNxJ-Zz8H4y2c/export?format=csv";

        function genererNumeroUnique() {
            const d = new Date();
            return "GSD" + d.getFullYear().toString().substr(-2) + 
                   (d.getMonth()+1).toString().padStart(2,'0') + 
                   d.getDate().toString().padStart(2,'0') + "-" +
                   d.getHours().toString().padStart(2,'0') + 
                   d.getMinutes().toString().padStart(2,'0');
        }

        let idDevisActuel = genererNumeroUnique();

        function calculerDevis() {
            const achat = parseFloat(document.getElementById('prixAchat').value) || 0;
            const port = parseFloat(document.getElementById('fraisPort').value);
            const prenom = document.getElementById('prenomClient').value || "";
            const nom = document.getElementById('nomClient').value || "";
            const adresse = document.getElementById('adresseClient').value || "";
            const vente = (achat * 1.18).toFixed(2);
            const total = (parseFloat(vente) + port).toFixed(2);
            
            document.getElementById('dateDevis').innerText = new Date().toLocaleDateString('fr-FR');
            document.getElementById('clientNomPdf').innerText = prenom + " " + nom.toUpperCase();
            document.getElementById('clientAdPdf').innerText = adresse;
            document.getElementById('displayVente').innerText = vente + " €";
            document.getElementById('displayPort').innerText = port.toFixed(2) + " €";
            document.getElementById('displayTotal').innerText = total + " €";
        }

        async function enregistrerDevis() {
            const btn = document.getElementById('btnEnregistrer');
            const total = document.getElementById('displayTotal').innerText;
            if(total === "30.00 €") return alert("Veuillez saisir un prix d'achat.");
            
            btn.innerText = "⏳ Envoi...";
            btn.disabled = true;

            const donnees = {
                id: idDevisActuel,
                prenom: document.getElementById('prenomClient').value,
                nom: document.getElementById('nomClient').value.toUpperCase(),
                adresse: document.getElementById('adresseClient').value,
                site: document.getElementById('lienPiece').value,
                achat: document.getElementById('prixAchat').value,
                port: document.getElementById('fraisPort').value,
                montant: total,
                statut: "ACTIF",
                date: new Date().toLocaleDateString('fr-FR')
            };

            try {
                await fetch(URL_ZAPIER, { method: "POST", mode: "no-cors", body: JSON.stringify(donnees) });
                alert("Devis archivé !");
                setTimeout(() => location.reload(), 1000);
            } catch (e) { alert("Erreur d'envoi"); btn.disabled = false; }
        }

        // --- FONCTION DE CHARGEMENT ROBUSTE ---
        async function chargerCloud() {
            const container = document.getElementById('historique');
            container.innerHTML = "<p class='text-xs text-slate-500 animate-pulse'>Chargement des données...</p>";
            
            try {
                const res = await fetch(URL_CSV + "&cache=" + Date.now());
                const data = await res.text();
                const lignes = data.split('\n');
                
                // DETECTION DU SEPARATEUR (Gère virgule ou point-virgule)
                const sep = data.includes(';') ? ';' : ',';
                
                // On retire l'entête et les lignes vides
                const devisLignes = lignes.slice(1).filter(l => l.trim().length > 10).reverse();
                
                let html = "";
                devisLignes.forEach(l => {
                    // Split intelligent pour les CSV (gère les guillemets)
                    const col = sep === ',' ? l.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/) : l.split(';');
                    
                    if(col.length < 5) return;

                    // INDEX SELON TON TABLEAU : A=0(ID), B=1(Prenom), C=2(Nom), D=3(Statut), H=7(Total)
                    const id = col[0]?.replace(/"/g,'').trim();
                    const prenom = col[1]?.replace(/"/g,'').trim() || "";
                    const nom = col[2]?.replace(/"/g,'').trim() || "";
                    const statut = col[3]?.replace(/"/g,'').toUpperCase().trim() || "ACTIF";
                    const total = col[7]?.replace(/"/g,'').trim() || "0 €";

                    if(statut === "ANNULÉ") return;

                    html += `
                        <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700 flex justify-between items-center text-left">
                            <div class="flex-1">
                                <p class="text-[9px] text-slate-500 font-bold">${id}</p>
                                <p class="font-black text-emerald-400 uppercase text-sm">${prenom} ${nom}</p>
                                <p class="text-white font-black text-lg">${total}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="recupererCloud('${id}')" class="bg-blue-600 h-10 w-10 rounded-xl flex items-center justify-center active:scale-90 shadow-lg">
                                    <i class="fas fa-edit text-white text-xs"></i>
                                </button>
                                <button onclick="annulerCloud('${id}', '${nom}')" class="bg-red-600/20 h-10 w-10 rounded-xl flex items-center justify-center border border-red-600/30 active:scale-90">
                                    <i class="fas fa-trash text-red-500 text-xs"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html || "<p class='text-xs text-slate-500'>Aucun devis actif dans le tableau.</p>";
            } catch(e) { 
                container.innerHTML = "<p class='text-xs text-red-500'>Erreur de connexion au Cloud. Vérifiez le partage de l'Excel.</p>"; 
            }
        }

        async function recupererCloud(idCherche) {
            const res = await fetch(URL_CSV);
            const data = await res.text();
            const lignes = data.split('\n');
            const sep = data.includes(';') ? ';' : ',';
            
            for(let i=1; i<lignes.length; i++) {
                const c = sep === ',' ? lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/) : lignes[i].split(';');
                if(c[0]?.replace(/"/g,'').trim() === idCherche) {
                    document.getElementById('prenomClient').value = c[1]?.replace(/"/g,'').trim();
                    document.getElementById('nomClient').value = c[2]?.replace(/"/g,'').trim();
                    document.getElementById('prixAchat').value = c[4]?.replace(/"/g,'').trim();
                    document.getElementById('fraisPort').value = c[5]?.replace(/"/g,'').trim();
                    document.getElementById('adresseClient').value = c[8]?.replace(/"/g,'').trim();
                    document.getElementById('lienPiece').value = c[9]?.replace(/"/g,'').trim();
                    
                    idDevisActuel = idCherche;
                    document.getElementById('numDevisDisplay').innerText = idCherche;
                    calculerDevis();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    break;
                }
            }
        }

        async function annulerCloud(id, nom) {
            if(!confirm(`Annuler le devis de ${nom} ?`)) return;
            const donnees = { id: id, nom: nom, statut: "ANNULÉ", montant: "0 €" };
            try {
                await fetch(URL_ZAPIER, { method: "POST", mode: "no-cors", body: JSON.stringify(donnees) });
                alert("Annulé !");
                location.reload();
            } catch(e) { alert("Erreur"); }
        }

        function genererPDF() {
            const element = document.getElementById('devis-a-imprimer');
            html2pdf().set({ 
                margin: 10, 
                filename: 'DEVIS_'+idDevisActuel+'.pdf', 
                html2canvas: { scale: 2 }, 
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
            }).from(element).save();
        }

        function partagerWhatsApp() {
            const msg = `*GSD*\nVotre devis n°${idDevisActuel} est prêt.\nTotal : *${document.getElementById('displayTotal').innerText}*`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        window.onload = () => {
            document.getElementById('numDevisDisplay').innerText = idDevisActuel;
            calculerDevis();
            chargerCloud();
        };
    </script>
</body>
</html>
