<script>
    const URL_ZAPIER = "https://hooks.zapier.com/hooks/catch/27518535/4ytrv6b/";
    const URL_CSV = "https://docs.google.com/spreadsheets/d/1h7cfN7f2l1U9eSxmdIlCngIK5AXUNwxNxJ-Zz8H4y2c/export?format=csv";

    function genererNumeroUnique() {
        const d = new Date();
        return "GSD" + d.getFullYear().toString().substr(-2) + (d.getMonth()+1).toString().padStart(2,'0') + d.getDate().toString().padStart(2,'0') + "-" + d.getHours().toString().padStart(2,'0') + d.getMinutes().toString().padStart(2,'0');
    }

    let idDevisActuel = genererNumeroUnique();

    function calculerDevis() {
        const achat = parseFloat(document.getElementById('prixAchat').value) || 0;
        const port = parseFloat(document.getElementById('fraisPort').value);
        const civilite = document.getElementById('civiliteClient').value;
        const prenom = document.getElementById('prenomClient').value || "";
        const nom = document.getElementById('nomClient').value || "";
        const adresse = document.getElementById('adresseClient').value || "";
        const vente = (achat * 1.18).toFixed(2);
        const total = (parseFloat(vente) + port).toFixed(2);
        document.getElementById('dateDevis').innerText = new Date().toLocaleDateString('fr-FR');
        document.getElementById('clientNomPdf').innerText = civilite + " " + prenom + " " + nom.toUpperCase();
        document.getElementById('clientAdPdf').innerText = adresse;
        document.getElementById('displayVente').innerText = vente + " €";
        document.getElementById('displayPort').innerText = port.toFixed(2) + " €";
        document.getElementById('displayTotal').innerText = total + " €";
    }

    async function enregistrerDevis() {
        const btn = document.getElementById('btnEnregistrer');
        const total = document.getElementById('displayTotal').innerText;
        if(total === "30.00 €" || total === "0.00 €") return alert("Veuillez saisir un prix d'achat.");
        btn.innerText = "⏳ Envoi..."; btn.disabled = true;
        const donnees = { id: idDevisActuel, civilite: document.getElementById('civiliteClient').value, prenom: document.getElementById('prenomClient').value, nom: document.getElementById('nomClient').value.toUpperCase(), email: document.getElementById('emailClient').value, adresse: document.getElementById('adresseClient').value, site: document.getElementById('lienPiece').value, achat: document.getElementById('prixAchat').value, port: document.getElementById('fraisPort').value, montant: total, statut: "ACTIF", date: new Date().toLocaleDateString('fr-FR') };
        try { await fetch(URL_ZAPIER, { method: "POST", mode: "no-cors", body: JSON.stringify(donnees) }); alert("Devis enregistré !"); setTimeout(() => location.reload(), 1000); } catch (e) { alert("Erreur d'envoi"); btn.disabled = false; }
    }

    async function chargerCloud() {
        const container = document.getElementById('historique');
        container.innerHTML = "<p class='text-xs text-slate-500 animate-pulse text-center py-4'>Synchronisation Cloud...</p>";
        try {
            const res = await fetch(URL_CSV + "?v=" + Date.now());
            const data = await res.text();
            const lignes = data.split('\n');
            
            let html = "";
            // On commence à i=1 pour sauter l'en-tête, on filtre les lignes vides
            for (let i = 1; i < lignes.length; i++) {
                if (!lignes[i].trim()) continue;

                // On utilise une regex robuste pour séparer par virgule sans casser les liens URL
                const col = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                
                const id = col[0]?.replace(/"/g,'').trim();
                const civilite = col[1]?.replace(/"/g,'').trim() || "";
                const nom = col[2]?.replace(/"/g,'').trim() || "";
                const prenom = col[3]?.replace(/"/g,'').trim() || "";
                const statut = col[4]?.replace(/"/g,'').toUpperCase().trim() || "ACTIF";
                const total = col[8]?.replace(/"/g,'').trim() || "0 €";

                if (!id || statut === "ANNULÉ") continue;

                html = `<div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-700 flex justify-between items-center text-left mb-2 shadow-lg">
                    <div class="flex-1"><p class="text-[9px] text-slate-500 font-bold">${id} | ${statut}</p>
                    <p class="font-black text-emerald-400 uppercase text-sm leading-none mb-1">${civilite} ${prenom} ${nom}</p>
                    <p class="text-white font-black text-lg">${total}</p></div>
                    <div class="flex gap-2">
                        <button onclick="extrairePdfDirect('${id}')" title="Extraire PDF" class="bg-emerald-600 h-10 w-10 rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-file-download text-white text-xs"></i></button>
                        <button onclick="recupererCloud('${id}')" class="bg-blue-600 h-10 w-10 rounded-xl flex items-center justify-center shadow-lg"><i class="fas fa-edit text-white text-xs"></i></button>
                        <button onclick="annulerCloud('${id}', '${nom}')" class="bg-red-600/20 h-10 w-10 rounded-xl flex items-center justify-center border border-red-600/30"><i class="fas fa-trash text-red-500 text-xs"></i></button>
                    </div>
                </div>` + html; // On ajoute en haut de liste
            }
            container.innerHTML = html || "<p class='text-xs text-slate-500 text-center'>Aucun devis trouvé.</p>";
        } catch(e) { 
            console.error(e);
            container.innerHTML = "<p class='text-xs text-red-500 text-center'>Erreur de chargement. Vérifiez la publication du tableau.</p>"; 
        }
    }

    async function extrairePdfDirect(idCherche) {
        const res = await fetch(URL_CSV + "?v=" + Date.now());
        const data = await res.text();
        const lignes = data.split('\n');
        for(let i=1; i<lignes.length; i++) {
            const c = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if(c[0]?.replace(/"/g,'').trim() === idCherche) {
                const civilite = c[1]?.replace(/"/g,'').trim();
                const nom = c[2]?.replace(/"/g,'').trim();
                const prenom = c[3]?.replace(/"/g,'').trim();
                const achatOrig = parseFloat(c[5]?.replace(/"/g,'')) || 0;
                const portOrig = parseFloat(c[6]?.replace(/"/g,'')) || 0;
                const adresse = c[10]?.replace(/"/g,'').trim() || "";
                const vente = (achatOrig * 1.18).toFixed(2);
                const total = (parseFloat(vente) + portOrig).toFixed(2);
                document.getElementById('numDevisDisplay').innerText = idCherche;
                document.getElementById('clientNomPdf').innerText = civilite + " " + prenom + " " + nom.toUpperCase();
                document.getElementById('clientAdPdf').innerText = adresse;
                document.getElementById('displayVente').innerText = vente + " €";
                document.getElementById('displayPort').innerText = portOrig.toFixed(2) + " €";
                document.getElementById('displayTotal').innerText = total + " €";
                const element = document.getElementById('devis-a-imprimer');
                html2pdf().set({ margin: 10, filename: 'DEVIS_'+idCherche+'.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(element).save();
                break;
            }
        }
    }

    async function recupererCloud(idCherche) {
        const res = await fetch(URL_CSV + "?v=" + Date.now());
        const data = await res.text();
        const lignes = data.split('\n');
        for(let i=1; i<lignes.length; i++) {
            const c = lignes[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            if(c[0]?.replace(/"/g,'').trim() === idCherche) {
                document.getElementById('civiliteClient').value = c[1]?.replace(/"/g,'').trim() || "Monsieur";
                document.getElementById('nomClient').value = c[2]?.replace(/"/g,'').trim();
                document.getElementById('prenomClient').value = c[3]?.replace(/"/g,'').trim();
                document.getElementById('prixAchat').value = c[5]?.replace(/"/g,'').trim() || "";
                document.getElementById('adresseClient').value = c[10]?.replace(/"/g,'').trim() || "";
                idDevisActuel = idCherche;
                document.getElementById('numDevisDisplay').innerText = idCherche;
                calculerDevis();
                window.scrollTo({ top: 0, behavior: 'smooth' });
                break;
            }
        }
    }

    async function annulerCloud(id, nom) {
        if(!confirm(`Masquer définitivement le devis de ${nom} du site ?`)) return;
        const donnees = { id: id, nom: nom, statut: "ANNULÉ" };
        try { await fetch(URL_ZAPIER, { method: "POST", mode: "no-cors", body: JSON.stringify(donnees) }); alert("Devis retiré."); location.reload(); } catch(e) { alert("Erreur"); }
    }

    function genererPDF() {
        const element = document.getElementById('devis-a-imprimer');
        html2pdf().set({ margin: 10, filename: 'DEVIS_'+idDevisActuel+'.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } }).from(element).save();
    }

    function partagerWhatsApp() {
        const msg = `*GSD*\nVotre devis n°${idDevisActuel} est prêt.\nTotal : *${document.getElementById('displayTotal').innerText}*`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    window.onload = () => { 
        document.getElementById('numDevisDisplay').innerText = idDevisActuel; 
        calculerDevis(); 
        chargerCloud(); 
    };
</script>
